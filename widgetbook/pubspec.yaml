name: widgetbook_workspace
description: Catch design-system Widgetbook for primitive and screen state review.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  catch_ui:
    path: ../packages/catch_ui
  catch_tokens:
    path: ../packages/catch_tokens
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  catch_dating_app:
    path: ../
  firebase_auth: ^6.7.1
  firebase_messaging: ^16.7.1
  flutter_riverpod: ^3.4.3
  go_router: ^17.5.0
  image_picker: ^1.2.3
  widgetbook: ^3.25.0
  widgetbook_annotation: ^3.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  catch_ui_lints:
    path: ../packages/catch_ui_lints
  widgetbook_generator: ^3.24.0
  widgetbook_golden_test_core: 0.5.0
  analyzer: 12.1.0

flutter:
  uses-material-design: true

  assets:
    - assets/branding/catch_icon.png
    - assets/fixtures/club_hero_portrait.jpg
    - ../test/event_rehearsal/fixtures/settings_reviews.json
    - ../test/event_rehearsal/fixtures/staff_reviews.json
    - ../test/event_rehearsal/fixtures/movement_reviews.json
    - ../test/event_success/fixtures/checkpoint_reviews.json
    - ../test/event_rehearsal/fixtures/checkpoint_management.json
    - ../test/event_success/fixtures/help_queue.json
    - ../test/event_rehearsal/fixtures/help_queue.json
    - ../test/event_success/fixtures/late_join_settings.json
    - ../test/event_success/fixtures/runtime_senders.json
    - ../test/event_success/fixtures/delivery_queue.json
    - ../test/event_rehearsal/fixtures/delivery_queue.json
