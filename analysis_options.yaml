include: package:flutter_lints/flutter.yaml

plugins:
  riverpod_lint: 3.1.4
  catch_ui_lints:
    path: packages/catch_ui_lints

analyzer:
  exclude:
    - build/**
    # Each nested package is analyzed from its own package root by the
    # repository-wide analysis gate. Keeping those boundaries explicit avoids
    # resolving fixture/example code through the root package configuration.
    - apps/consumer/**
    - apps/host/**
    - packages/catch_tokens/**
    - packages/catch_ui/**
    - packages/catch_ui_lints/**
    - tool/widget_dedupe/**
    - packages/**/build/**
    - widgetbook/**
    # Scanner fixtures are deliberately non-compliant seed files, not app code.
    - tool/design/fixtures/**
    - '**/*.g.dart'
    - '**/*.freezed.dart'

linter:
  rules:
    # Style
    - prefer_single_quotes
    - directives_ordering
    - sort_child_properties_last
    - use_super_parameters
    - avoid_redundant_argument_values
    - prefer_const_constructors
    - prefer_const_literals_to_create_immutables
    - sized_box_shrink_expand
    - use_colored_box
    - use_decorated_box
    - use_named_constants

    # Safety
    - avoid_dynamic_calls
    - cancel_subscriptions
    - close_sinks
    - literal_only_boolean_expressions
    - no_adjacent_strings_in_list
    - throw_in_finally
    - unawaited_futures

    # Correctness
    - always_use_package_imports
