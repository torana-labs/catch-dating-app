<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kit · hero</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="playbook-panels.css">
<link rel="stylesheet" href="playbook-kit.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="pg"><section class="{{secCls}}" style="margin-top:0"><div class="split"><div class="htext">
<p class="k" style="color:{{ink}}">{{d.kicker}}</p>
<h1 class="d d-hero"><sc-for list="{{title}}" as="p" hint-placeholder-count="1"><span class="{{p.cls}}">{{p.t}}</span></sc-for></h1>
<sc-if value="{{hasLabels}}" hint-placeholder-val="{{ false }}"><div class="klabels"><sc-for list="{{labels}}" as="x" hint-placeholder-count="3"><span>{{x}}</span></sc-for></div></sc-if>
<p class="lead"><sc-for list="{{lead}}" as="p" hint-placeholder-count="1"><span class="{{p.cls}}">{{p.t}}</span></sc-for></p>
<sc-if value="{{hasProof}}" hint-placeholder-val="{{ false }}"><p class="proofline" style="color:{{ink}}"><sc-for list="{{proof}}" as="x" hint-placeholder-count="2"><span><sc-for list="{{x.parts}}" as="p" hint-placeholder-count="1"><span class="{{p.cls}}">{{p.t}}</span></sc-for></span></sc-for></p></sc-if>
<div class="btns"><sc-for list="{{btns}}" as="b" hint-placeholder-count="2"><a class="b {{b.cls}}" href="{{b.href}}">{{b.l}}</a></sc-for></div>
<sc-if value="{{hasBody}}" hint-placeholder-val="{{ false }}"><p class="body" style="margin-top:14px;font-size:13px"><sc-for list="{{body}}" as="p" hint-placeholder-count="1"><span class="{{p.cls}}">{{p.t}}</span></sc-for></p></sc-if>
<sc-if value="{{hasDoor}}" hint-placeholder-val="{{ false }}"><a class="door" href="#">{{d.door}}</a></sc-if></div>
<div class="hmedia"><dc-import name="KitMock" d="{{d.media}}" hint-size="100%,560px"></dc-import>
<sc-if value="{{hasChip}}" hint-placeholder-val="{{ false }}"><div class="hchip"><strong>{{d.chip.title}}</strong><sc-for list="{{chipRows}}" as="r" hint-placeholder-count="3"><div>{{r.l}}<b>{{r.v}}</b></div></sc-for></div></sc-if></div></div>
<sc-if value="{{hasNote}}" hint-placeholder-val="{{ true }}"><span class="note">{{d.note}}</span></sc-if></section></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"d": {"editor": null}, "$preview": {"width": 1440, "height": 820}}'>
class Component extends DCLogic {
  renderVals() {
const P = (t) => String(t == null ? '' : t).split(/(\[[^\]]+\])/).filter(Boolean).map((x) => ({ t: x, cls: /^\[.*\]$/.test(x) ? 'ph2' : '' }));
const B = (bs) => (bs || []).map((b) => ({ l: b.l, href: b.href || '#', cls: b.kind === 'sec' ? 'o' : b.kind === 'light' ? 'w' : b.kind === 'lightsec' ? 'ow' : '' }));
const has = (x) => Array.isArray(x) ? x.length > 0 : !!x;

    const d = this.props.d || {"tone": "m-pink", "ink": "#4A2330", "kicker": "Catch for supper clubs", "title": "Seat strangers well, then invite them back.", "lead": "Applications, payment before you buy the food, and tables planned from what guests told you.", "proof": ["[N] supper clubs host on Catch", "★ [4.8] from guests who booked"], "btns": [{"l": "Start free trial"}, {"l": "Talk to us on WhatsApp", "kind": "sec"}], "door": "Hosting for a company? Book a walkthrough →", "media": {"kind": "phonecard", "title": "Seating", "sub": "Long Table Supper", "rows": [{"t": "Table 1", "s": "6 seated", "tag": "Full", "tone": "good"}]}, "chip": {"title": "Long Table Supper", "rows": [{"l": "Applied", "v": "41"}, {"l": "Paid", "v": "24"}]}, "note": "Kit sample"};
    return {
      d, secCls: 'panel heroc ' + (d.tone || 'm-coral'), ink: d.ink || '#141114', title: P(d.title), lead: P(d.lead),
      hasLabels: has(d.labels), labels: d.labels || [], hasBody: has(d.body), body: P(d.body), hasProof: has(d.proof), proof: (d.proof || []).map((x) => ({ parts: P(x) })), btns: B(d.btns), hasDoor: has(d.door),
      hasChip: !!d.chip, chipRows: (d.chip && d.chip.rows) || [], hasNote: has(d.note)
    };
  }
}
</script>
</body>
</html>
