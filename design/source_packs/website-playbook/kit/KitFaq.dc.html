<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kit · questions</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="playbook-panels.css">
<link rel="stylesheet" href="playbook-kit.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="pg"><section class="open" style="{{secStyle}}"><div class="faq"><div><p class="k" style="color:#1F7A57">{{kicker}}</p><h2 class="d d-sec">{{d.title}}</h2>
<sc-if value="{{showWa}}" hint-placeholder-val="{{ true }}"><p class="body" style="margin-top:20px">Something else? <a href="#" style="font-weight:700">Ask us on WhatsApp</a>.</p></sc-if></div><div>
<sc-for list="{{faqs}}" as="f" hint-placeholder-count="6"><div><button class="q" type="button" onClick="{{f.toggle}}" aria-expanded="{{f.open}}">{{f.q}}<i>{{f.sign}}</i></button><sc-if value="{{f.open}}" hint-placeholder-val="{{ false }}"><p class="ans"><sc-for list="{{f.a}}" as="p" hint-placeholder-count="1"><span class="{{p.cls}}">{{p.t}}</span></sc-for></p></sc-if></div></sc-for>
</div></div></section></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"d": {"editor": null}, "$preview": {"width": 1440, "height": 700}}'>
class Component extends DCLogic {
  renderVals() {
const P = (t) => String(t == null ? '' : t).split(/(\[[^\]]+\])/).filter(Boolean).map((x) => ({ t: x, cls: /^\[.*\]$/.test(x) ? 'ph2' : '' }));
const B = (bs) => (bs || []).map((b) => ({ l: b.l, href: b.href || '#', cls: b.kind === 'sec' ? 'o' : b.kind === 'light' ? 'w' : b.kind === 'lightsec' ? 'ow' : '' }));
const has = (x) => Array.isArray(x) ? x.length > 0 : !!x;

    const d = this.props.d || {"kicker": "Supper club questions", "title": "What hosts ask us.", "items": [["Can I choose who comes?", "Yes."], ["Do guests need an app?", "No."]]};
    const open = this.state && this.state.open !== undefined ? this.state.open : 0;
    return { d, kicker: d.kicker || 'Questions', showWa: d.whatsapp !== false, secStyle: d.tight ? 'padding-top:72px' : '',
      faqs: (d.items || []).map((f, i) => ({ q: f[0], a: P(f[1]), open: open === i, sign: open === i ? '−' : '+', toggle: () => this.setState({ open: open === i ? -1 : i }) })) };
  }
}
</script>
</body>
</html>
