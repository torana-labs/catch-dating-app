name: catch_host_app
description: Installable Catch Host product with a host-only native graph.
publish_to: none
version: 1.0.3+5
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  catch_dating_app:
    path: ../..
  catch_kernel:
    path: ../../packages/kernel
  catch_platform:
    path: ../../packages/platform
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3

dev_dependencies:
  build_runner: ^2.11.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  riverpod_generator: ^4.0.4

flutter:
  generate: false
  uses-material-design: true
  config:
    enable-swift-package-manager: false
  assets:
    - assets/branding/catch_icon.png
    - assets/branding/catch_icon_round.png
    - assets/branding/catch_icon_square.png
    - assets/branding/catch_splash_mark_dark.png
    - assets/branding/catch_splash_mark_light.png
    - assets/branding/catch_host_splash_mark_dark.png
    - assets/branding/catch_host_splash_mark_light.png
    - assets/branding/catch_hosts_icon.png
    - assets/branding/catch_hosts_logo.png
    - assets/audio/event_success/
    - assets/audio/celebration/
    - assets/motion/event_success/
