name: catch_host_app
description: Installable Catch Host product with a host-only native graph.
publish_to: none
version: 1.0.6+8
resolution: workspace

environment:
  sdk: ^3.12.0

# Host screens move here from the root package (Phase 4, #2373). Every
# package they or their tests import is declared, because
# depend_on_referenced_packages fails an undeclared import and a mechanical
# move commit must not edit this file.
dependencies:
  catch_dating_app:
    path: ../..
  catch_kernel:
    path: ../../packages/kernel
  catch_l10n:
    path: ../../packages/l10n
  catch_platform:
    path: ../../packages/platform
  catch_tokens:
    path: ../../packages/catch_tokens
  catch_ui:
    path: ../../packages/catch_ui
  collection: ^1.19.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  freezed_annotation: ^3.0.0
  go_router: ^17.1.0
  image_picker: ^1.2.4
  intl: ^0.20.2
  meta: ^1.18.0
  qr_flutter: ^4.1.0
  riverpod_annotation: ^4.0.3

dev_dependencies:
  archive: ^4.7.1
  build_runner: ^2.16.1
  catch_test_support:
    path: ../../packages/catch_test_support
  cloud_firestore: ^6.10.2
  cloud_functions: ^6.5.1
  connectivity_plus: ^7.1.1
  crypto: ^3.0.8
  fake_async: ^1.3.3
  fake_cloud_firestore: ^4.3.0
  firebase_auth: ^6.7.1
  firebase_auth_mocks: ^0.15.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  geolocator: ^14.1.2
  google_maps_flutter: ^2.18.1
  idb_shim: ^2.11.3
  json_schema: ^5.2.2
  riverpod: '>=3.5.0 <3.6.0'
  riverpod_generator: ^4.0.4
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  sqlite3: ^3.8.0
  url_launcher: ^6.3.3

flutter:
  generate: false
  uses-material-design: true
  config:
    enable-swift-package-manager: false
  assets:
    - assets/branding/catch_icon.png
    - assets/branding/catch_icon_round.png
    - assets/branding/catch_icon_square.png
    - assets/branding/catch_splash_mark_dark.png
    - assets/branding/catch_splash_mark_light.png
    - assets/branding/catch_host_splash_mark_dark.png
    - assets/branding/catch_host_splash_mark_light.png
    - assets/branding/catch_hosts_icon.png
    - assets/branding/catch_hosts_logo.png
    - assets/audio/event_success/
    - assets/audio/celebration/
    - assets/motion/event_success/
