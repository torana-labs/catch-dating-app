name: catch_consumer_app
description: Installable Catch consumer product with consumer-only native SDKs.
publish_to: none
version: 1.0.2+3
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  catch_dating_app:
    path: ../..
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  health: ^13.3.2
  razorpay_flutter: ^1.4.7

dev_dependencies:
  cloud_firestore: ^6.10.2
  cloud_functions: ^6.5.1
  firebase_core: ^4.15.2
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7
  flutter_test:
    sdk: flutter
  shared_preferences: ^2.5.6

# Consumer native splash. Colors mirror design/tokens/catch.tokens.json and are
# rewritten by tool/branding/generate_native_brand_assets.dart.
# Regenerate from this directory with `dart run flutter_native_splash:create`,
# then rerun the brand generator (release operations guide, Native Splash Assets).
flutter_native_splash:
  color: "#F4F4F1"
  color_web: "#F4F4F1"
  color_dark: "#0F0E10"
  color_dark_web: "#0F0E10"
  image: assets/branding/catch_splash_mark_light.png
  image_dark: assets/branding/catch_splash_mark_dark.png
  android: true
  ios: true
  web: true
  android_12:
    color: "#F4F4F1"
    color_dark: "#0F0E10"
    image: assets/branding/catch_splash_mark_light.png
    image_dark: assets/branding/catch_splash_mark_dark.png

flutter:
  generate: false
  uses-material-design: true
  config:
    enable-swift-package-manager: false
  assets:
    - assets/branding/catch_icon.png
    - assets/branding/catch_icon_round.png
    - assets/branding/catch_icon_square.png
    - assets/branding/catch_splash_mark_dark.png
    - assets/branding/catch_splash_mark_light.png
    - assets/branding/catch_hosts_icon.png
    - assets/branding/catch_hosts_logo.png
    - assets/audio/event_success/
    - assets/audio/celebration/
    - assets/motion/event_success/
