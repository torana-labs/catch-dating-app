name: Main CI alert

# Keeps one "Main CI is red" issue in step with main's CI: opened on the first
# failed main push or nightly run, commented on each further failure, closed
# on the next green run. Opening it notifies repository watchers, so a red
# main is noticed within one run (owner decision, 12 Nov 2026: alert only, no
# auto-revert). After a green run it also checks whether main has been fully
# green for 7 days, and if so opens one issue saying the reporting lanes can
# block merges again (owner decision, 14 Nov 2026). After a failed nightly,
# the selection-miss job checks each failing Functions test against the pull
# request selection of every commit since the last green nightly, and opens or
# comments on one "Test selection missed a failing test" issue for any test no
# commit selected; it is report-only and never changes the nightly's result.
# After each main push run, the alert job also reports, on the "Main CI is red"
# issue, a commit whose push run was replaced before it ran and that no other
# main push run covers; it triggers nothing (22 Nov 2026).
# The golden-policy job keeps two more issues in step with main's macOS jobs
# (owner decision, 22 Nov 2026): "Golden or capture failure", labelled
# release-block:mobile so Release Readiness fails while it is open, when the
# goldens or the capture render failed; and the report-only "Golden baselines
# drifted", which dispatches the drifted suite's baseline workflow at that
# commit. Those workflows only upload baselines for a person to commit.
# It reads only main's own runs and checks out main's code.
# After each nightly, the semantic-budget job keeps one report-only "Semantic
# gate over budget" issue in step with the merge-queue gates' nightly p95
# (release engineer, 23 Nov 2026).
# Logic and tests: tool/ci/main_red_alert.mjs, tool/ci/golden_policy.mjs,
# tool/ci/selection_miss_report.mjs and tool/ci/semantic_gates.mjs. Operator guide:
# docs/release_operations.md, "Main CI alert" and "Test selection miss report".

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: main-red-alert
  cancel-in-progress: false

jobs:
  alert:
    name: Update the main CI alert issue
    if: ${{ github.event.workflow_run.head_branch == 'main' && contains(fromJSON('["push", "schedule"]'), github.event.workflow_run.event) && contains(fromJSON('["success", "failure", "timed_out", "startup_failure"]'), github.event.workflow_run.conclusion) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            tool/ci
            .github/actions/load-toolchain
      - id: toolchain
        uses: ./.github/actions/load-toolchain
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
      - name: Open, update or close the alert issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: node tool/ci/main_red_alert.mjs

  golden-policy:
    name: Update the golden and capture issues
    if: ${{ github.event.workflow_run.head_branch == 'main' && contains(fromJSON('["push", "schedule"]'), github.event.workflow_run.event) && contains(fromJSON('["success", "failure", "timed_out", "startup_failure"]'), github.event.workflow_run.conclusion) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # actions: write only dispatches the dispatch-only baseline workflows.
    permissions:
      actions: write
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            tool/ci
            .github/actions/load-toolchain
      - id: toolchain
        uses: ./.github/actions/load-toolchain
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
      - name: Open, update or close the golden and capture issues
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: node tool/ci/golden_policy.mjs

  selection-miss:
    name: Check nightly failures against the test selection
    if: ${{ github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'schedule' && github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      # Full first-parent history back to the last green nightly; the
      # selection needs paths and trees, not old file contents.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - id: toolchain
        uses: ./.github/actions/load-toolchain
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
      - run: npm ci --prefix tool/impact
      - name: Open or update the selection miss issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: node tool/ci/selection_miss_report.mjs

  semantic-budget:
    name: Report semantic gates over budget
    # After every nightly, whatever its result: the gates' p95 over the last 7
    # nightlies, report-only (release engineer, 23 Nov 2026). A slow gate is not
    # a broken main, so this never touches the "Main CI is red" issue.
    if: ${{ github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'schedule' && contains(fromJSON('["success", "failure", "timed_out"]'), github.event.workflow_run.conclusion) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            tool/ci
            tool/lib
            tool/manifest
            .github/actions/load-toolchain
      - id: toolchain
        uses: ./.github/actions/load-toolchain
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
      - name: Open, update or close the semantic gate budget issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tool/ci/semantic_gates.mjs budget --github
