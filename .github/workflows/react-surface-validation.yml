name: React Surface Validation

on:
  workflow_call:
    inputs:
      surface:
        description: React surface to validate (marketing or admin)
        required: true
        type: string
      update_visual_baselines:
        description: Capture Ubuntu visual baselines instead of comparing them
        required: false
        type: boolean
        default: false
      capture_binding:
        description: Exact immutable capture artifact identity; required for marketing consumers.
        required: false
        type: string
        default: ""
      skip_deployable_build:
        description: Skip the generic site build when the caller will build one exact production artifact.
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

jobs:
  validate:
    name: Validate ${{ inputs.surface }} website
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate requested surface
        env:
          REACT_SURFACE: ${{ inputs.surface }}
        run: |
          case "$REACT_SURFACE" in
            marketing|admin) ;;
            *) echo "Unsupported React surface: $REACT_SURFACE" >&2; exit 64 ;;
          esac

      - id: toolchain
        uses: ./.github/actions/load-toolchain

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Import verified exact-source marketing captures
        if: ${{ inputs.surface == 'marketing' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CAPTURE_BINDING: ${{ inputs.capture_binding }}
        run: node tool/marketing/import_hosted_captures.mjs --import

      - uses: ./.github/actions/setup-flutter
        if: ${{ inputs.surface == 'marketing' }}

      - name: Resolve Flutter dependencies
        if: ${{ inputs.surface == 'marketing' }}
        run: flutter pub get

      - run: npm ci

      # The checks below read Admin's import graph without an npm lifecycle.
      - name: Generate Admin modules
        run: npm --workspace catch-admin run generate

      - name: Check unused code and undeclared imports (Knip ratchet)
        run: >-
          node tool/audit/check_unused_code.mjs --check
          --workspace ${{ inputs.surface == 'admin' && 'admin' || 'website' }}
          --workspace packages/web-ui --workspace packages/web-config

      - name: Check React dependency topology
        run: node tool/web/react_dependency_graph.mjs --check

      # Features name icon roles; lucide-react imports outside the icon layer
      # may only fall.
      - name: Check icon-family references
        run: node tool/design/check_icon_family_usage.mjs --check

      - name: Check design tokens
        if: ${{ inputs.surface == 'marketing' }}
        run: npm run web:tokens:check

      - name: Check cross-stack component lexicon
        run: node tool/design/check_component_lexicon.mjs --surfaces-only

      - name: Check public surface behavior matrix
        if: ${{ inputs.surface == 'marketing' }}
        run: npm run design:public-surfaces:check

      - name: Check organizer admin review bridge
        if: ${{ inputs.surface == 'admin' }}
        run: node tool/web/check_admin_review_bridge.mjs

      - name: Run admin unit tests with coverage
        if: ${{ inputs.surface == 'admin' }}
        run: npm --workspace catch-admin run test:coverage

      - name: Check React controller tests
        run: npm run web:controller-tests:check

      - name: Run marketing unit tests with coverage
        if: ${{ inputs.surface == 'marketing' }}
        run: npm --workspace catch-marketing run test:unit:coverage

      - name: Check shared web UI adoption
        run: npm run web:shared-ui-adoption:check

      - name: Run shared web UI tests and typecheck
        run: npm run web:ui:test && npm run web:ui:typecheck

      - name: Validate marketing build prerequisites without emitting a bundle
        if: ${{ inputs.surface == 'marketing' && inputs.skip_deployable_build }}
        run: npm run web:marketing:typecheck

      - name: Validate admin build prerequisites without emitting a bundle
        if: ${{ inputs.surface == 'admin' && inputs.skip_deployable_build }}
        run: npm run web:admin:typecheck

      - name: Build marketing website
        if: ${{ inputs.surface == 'marketing' && !inputs.skip_deployable_build }}
        run: npm run web:marketing:build

      - name: Verify built marketing capture bytes
        if: ${{ inputs.surface == 'marketing' && !inputs.skip_deployable_build }}
        env:
          CAPTURE_BINDING: ${{ inputs.capture_binding }}
        run: node tool/marketing/import_hosted_captures.mjs --check-dist

      - name: Verify validation-only marketing Hosting package
        if: ${{ inputs.surface == 'marketing' && !inputs.skip_deployable_build && github.event_name == 'workflow_dispatch' && github.workflow == 'Marketing Website' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CAPTURE_BINDING: ${{ inputs.capture_binding }}
        run: |
          set -euo pipefail
          current_attempt="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT")"
          workflow_id="$(jq -er \
            --arg repository "$GITHUB_REPOSITORY" --arg sha "$GITHUB_SHA" \
            --argjson id "$GITHUB_RUN_ID" --argjson attempt "$GITHUB_RUN_ATTEMPT" \
            --argjson number "$GITHUB_RUN_NUMBER" '
              select(.id == $id and .run_attempt == $attempt and .run_number == $number and
                .head_sha == $sha and .event == "workflow_dispatch" and
                (.path | split("@")[0]) == ".github/workflows/marketing-website.yml" and
                .repository.full_name == $repository and .head_repository.full_name == $repository and
                (.workflow_id | type == "number" and . > 0 and floor == .)) | .workflow_id
            ' <<< "$current_attempt")"
          test ! -e build/ci/marketing-hosting-validation
          mkdir -p build/ci/marketing-hosting-validation/upload
          package_args=(--surface marketing --source-sha "$GITHUB_SHA"
            --ci-workflow-id "$workflow_id" --ci-run-number "$GITHUB_RUN_NUMBER"
            --ci-run-id "$GITHUB_RUN_ID" --ci-run-attempt "$GITHUB_RUN_ATTEMPT")
          node tool/ci/package_web_hosting.mjs prepare "${package_args[@]}" \
            --stage-dir build/ci/marketing-hosting-validation/package
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import {canonicalInventory} from './tool/marketing/export_hosted_captures.mjs';
          const captures = canonicalInventory(JSON.parse(fs.readFileSync('tool/marketing/capture_manifest.json', 'utf8')));
          const paths = ['website/public/assets/app-screenshots/manifest.json', ...captures.map(c => c.websitePath)];
          const files = paths.map(file => {
            const built = fs.readFileSync(file.replace('website/public/', 'website/dist/'));
            const packaged = fs.readFileSync(file.replace('website/public/', 'build/ci/marketing-hosting-validation/package/site/'));
            assert.ok(packaged.equals(built), `Packaged capture differs: ${file}`);
            return {path: file, bytes: built.length, sha256: crypto.createHash('sha256').update(built).digest('hex')};
          });
          fs.writeFileSync('build/ci/marketing-hosting-validation/upload/capture-package-proof.json',
            JSON.stringify({validationOnly: true, captureBinding: JSON.parse(process.env.CAPTURE_BINDING), files}, null, 2) + '\n');
          NODE
          archive=build/ci/marketing-hosting-validation/upload/web-hosting-marketing.tar.gz
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf "$archive" -C build/ci/marketing-hosting-validation/package .
          provenance=build/ci/marketing-hosting-validation/upload/marketing-validation-provenance.json
          node tool/ci/delivery_core.mjs manifest --artifact "$archive" \
            --source-sha "$GITHUB_SHA" --ci-run-id "$GITHUB_RUN_ID" \
            --ci-run-attempt "$GITHUB_RUN_ATTEMPT" --stages hosting-marketing --out "$provenance"
          node tool/ci/delivery_core.mjs verify --manifest "$provenance" --artifact "$archive" \
            --source-sha "$GITHUB_SHA" --ci-run-id "$GITHUB_RUN_ID" --ci-run-attempt "$GITHUB_RUN_ATTEMPT"
          node tool/ci/package_web_hosting.mjs verify "${package_args[@]}" \
            --package-dir build/ci/marketing-hosting-validation/package --provenance-manifest "$provenance"

      - name: Retain validation-only marketing package proof
        if: ${{ inputs.surface == 'marketing' && !inputs.skip_deployable_build && github.event_name == 'workflow_dispatch' && github.workflow == 'Marketing Website' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: marketing-hosting-validation-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci/marketing-hosting-validation/upload
          if-no-files-found: error
          retention-days: 7

      # The bundle budget must measure the bytes that ship. The production
      # build (_web-hosting-build.yml) sets live data mode and an App Check key,
      # which add the App Check and live-data code to the entry chunk; the real
      # values are prod-environment variables this lane cannot read. These
      # synthetic values have the production shape and lengths, so the entry
      # measures within a few bytes of the shipped one.
      - name: Build admin website
        if: ${{ inputs.surface == 'admin' && !inputs.skip_deployable_build }}
        env:
          VITE_ADMIN_DATA_MODE: live
          VITE_ADMIN_FIREBASE_ENV: prod
          VITE_ADMIN_APPCHECK_SITE_KEY: 6LcSyntheticAppCheckSiteKeyForBudgetsXyz0
          VITE_FIREBASE_API_KEY: synthetic-budget-build-api-key-00000000
          VITE_FIREBASE_AUTH_DOMAIN: catch-dating-app-64e51.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: catch-dating-app-64e51
          VITE_FIREBASE_STORAGE_BUCKET: catch-dating-app-64e51.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "123456789012"
          VITE_FIREBASE_APP_ID: "1:123456789012:web:0123456789abcdef012345"
          VITE_FIREBASE_MEASUREMENT_ID: G-SYNTHETIC1
        run: npm run web:admin:build

      - name: Install Storybook accessibility browser
        run: npx playwright install chromium

      - name: Exercise isolated custom-domain browser scenarios
        if: ${{ inputs.surface == 'marketing' }}
        timeout-minutes: 5
        env:
          RSVP_SOURCE_REPO: ${{ github.workspace }}
          RSVP_SOURCE_SHA: ${{ github.sha }}
          RSVP_CAPTURE_OUTPUT: ${{ runner.temp }}/form-domain-browser-${{ github.run_id }}-${{ github.run_attempt }}
          RSVP_CAPTURE_SCENARIOS: domain-submit-desktop,domain-held-mobile,domain-unknown-mobile,domain-revoked-mobile,domain-mismatch-mobile,domain-transport-mobile
        run: |
          test "$(git rev-parse HEAD)" = "$RSVP_SOURCE_SHA"
          npm --workspace catch-marketing run capture:rsvp

      - name: Retain custom-domain synthetic browser evidence
        if: ${{ inputs.surface == 'marketing' && success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: form-domain-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/form-domain-browser-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7

      # Storybook screenshots take 5-6 minutes, so pull requests skip them; the
      # merge queue and main render every story on the exact combined source.
      # Pixel changes against the committed baselines are reported in the job
      # summary and diagnostics artifact, never failed: the app is still
      # changing visually on purpose. A story that cannot render still fails.
      - name: Build marketing Storybook
        if: ${{ inputs.surface == 'marketing' && (github.event_name != 'pull_request' || inputs.update_visual_baselines) }}
        run: npm --workspace catch-marketing run build:storybook

      - name: Build admin Storybook
        if: ${{ inputs.surface == 'admin' && (github.event_name != 'pull_request' || inputs.update_visual_baselines) }}
        run: npm --workspace catch-admin run build:storybook

      - name: Report marketing and shared web UI visual changes
        id: marketing-visual-check
        if: ${{ inputs.surface == 'marketing' && !inputs.update_visual_baselines && github.event_name != 'pull_request' }}
        run: |
          node tool/web/check_storybook_visuals.mjs --surface website --report
          node tool/web/check_storybook_visuals.mjs --surface webui --report

      - name: Report admin visual changes
        id: admin-visual-check
        if: ${{ inputs.surface == 'admin' && !inputs.update_visual_baselines && github.event_name != 'pull_request' }}
        run: node tool/web/check_storybook_visuals.mjs --surface admin --report

      - name: Capture marketing and shared web UI visual baselines
        id: marketing-visual-update
        if: ${{ inputs.surface == 'marketing' && inputs.update_visual_baselines }}
        run: |
          node tool/web/check_storybook_visuals.mjs --surface website --update
          node tool/web/check_storybook_visuals.mjs --surface webui --update

      - name: Capture admin visual baselines
        id: admin-visual-update
        if: ${{ inputs.surface == 'admin' && inputs.update_visual_baselines }}
        run: node tool/web/check_storybook_visuals.mjs --surface admin --update

      - name: Upload marketing visual diagnostics
        if: ${{ always() && (steps.marketing-visual-check.outcome == 'failure' || steps.marketing-visual-check.outputs.has_changes == 'true') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: marketing-visual-diagnostics-${{ github.run_id }}
          path: |
            artifacts/visual-actuals/website
            artifacts/visual-actuals/webui
            artifacts/visual-diffs/website
            artifacts/visual-diffs/webui
          if-no-files-found: error
          retention-days: 14

      - name: Upload admin visual diagnostics
        if: ${{ always() && (steps.admin-visual-check.outcome == 'failure' || steps.admin-visual-check.outputs.has_changes == 'true') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: admin-visual-diagnostics-${{ github.run_id }}
          path: |
            artifacts/visual-actuals/admin
            artifacts/visual-diffs/admin
          if-no-files-found: error
          retention-days: 14

      - name: Upload marketing visual baselines
        if: ${{ steps.marketing-visual-update.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: marketing-visual-baselines-${{ github.run_id }}
          path: |
            design/visual_baselines/website/linux
            design/visual_baselines/webui/linux
          if-no-files-found: error
          retention-days: 14

      - name: Upload admin visual baselines
        if: ${{ steps.admin-visual-update.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: admin-visual-baselines-${{ github.run_id }}
          path: design/visual_baselines/admin/linux
          if-no-files-found: error
          retention-days: 14

      - name: Run marketing Storybook accessibility gate
        if: ${{ inputs.surface == 'marketing' }}
        run: npm --workspace catch-marketing run test:storybook:a11y

      - name: Run admin Storybook accessibility gate
        if: ${{ inputs.surface == 'admin' }}
        run: npm --workspace catch-admin run test:storybook:a11y
