name: Flutter CI

on:
  workflow_call:
    inputs:
      base_sha:
        required: true
        type: string
      commit_window:
        description: Include every committed path touched between the exact base and source.
        required: false
        type: boolean
        default: false
      full:
        required: false
        type: boolean
        default: false
      design_parity_in_tools:
        description: The required same-run Tools plan executes every registered parity check.
        required: false
        type: boolean
        default: false
      design_handoff_in_tools:
        description: The required same-run Tools plan executes all snapshot and context export checks.
        required: false
        type: boolean
        default: false
      ui_lint_smoke_in_tools:
        description: The same CI run selected the registered Tools engine check.
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact reachable base commit used for delta-based Flutter gates.
        required: true
        type: string
      full:
        description: Run all root unit and widget tests.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test-plan:
    name: Plan affected Flutter tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      shard_total: ${{ steps.select.outputs.shard_total }}
      ui_lint_smoke: ${{ steps.select.outputs.ui_lint_smoke }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: toolchain
        uses: ./.github/actions/load-toolchain
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get
      - name: Retain generated English localization for reviewed source
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import shutil
          import subprocess

          if subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() != os.environ['SOURCE_SHA']:
              raise SystemExit('Checkout does not match the workflow source SHA')

          output = pathlib.Path('build/ci/generated-english-l10n')
          output.mkdir(parents=True, exist_ok=True)
          sources = [pathlib.Path('lib/l10n/app_en.arb'), pathlib.Path('l10n.yaml')]
          generated = [
              pathlib.Path('lib/l10n/generated/app_localizations.dart'),
              pathlib.Path('lib/l10n/generated/app_localizations_en.dart'),
          ]
          digest = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
          for path in generated:
              if not path.is_file():
                  raise SystemExit(f'Generated localization missing: {path}')
              shutil.copy2(path, output / path.name)
          manifest = {
              'sourceSha': os.environ['SOURCE_SHA'],
              'runId': os.environ['RUN_ID'],
              'runAttempt': os.environ['RUN_ATTEMPT'],
              'sourceHashes': {str(path): digest(path) for path in sources},
              'generatedHashes': {str(path): digest(path) for path in generated},
              'kind': 'generated English localization; source artifact, not a screenshot',
          }
          (output / 'manifest.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          PY
      - name: Upload generated English localization
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-english-l10n-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: build/ci/generated-english-l10n/
          if-no-files-found: error
          retention-days: 7
      - name: Verify test selection safety
        run: dart test tool/harness/lib/flutter_test_selection_test.dart
      - name: Select tests from committed dependency closures
        id: select
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          SOURCE_SHA: ${{ github.sha }}
          FULL: ${{ inputs.full }}
          COMMIT_WINDOW: ${{ inputs.commit_window || false }}
        run: |
          dart run tool/harness/lib/flutter_test_selection.dart \
            --base "$BASE_SHA" --head "$SOURCE_SHA" --full "$FULL" \
            --commit-window "$COMMIT_WINDOW" \
            --output build/ci/flutter-test-plan.json \
            --github-output "$GITHUB_OUTPUT"
          jq '{mode, reason, totalTests, selectedTests, uiLintSmoke}' build/ci/flutter-test-plan.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload selected test inventory
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flutter-test-plan-${{ github.run_id }}-${{ github.sha }}
          path: build/ci/flutter-test-plan.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  analysis-gates:
    needs: test-plan
    name: Flutter analysis and gates
    runs-on: ubuntu-latest
    # Eight-package analysis and serial UI lint probes exceed 25 minutes on
    # hosted Linux runners; retain every probe within a bounded job allowance.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: toolchain
        uses: ./.github/actions/load-toolchain

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Derive exact-source route and widget inventories
        run: node tool/ci/generated_inventories.mjs --source-sha "$GITHUB_SHA"

      - uses: ./.github/actions/setup-flutter

      - name: Analyze every Dart and Flutter package
        run: node tool/ci/check_flutter_workspace_analysis.mjs --root-diagnostics-dir /tmp/catch-ui-root-analysis

      - run: npm ci

      - name: New widget inventory gate
        env:
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          if [[ -z "$BASE_SHA" ]]; then
            echo "Missing exact base SHA for the new-widget inventory gate." >&2
            exit 64
          fi
          git cat-file -e "${BASE_SHA}^{commit}"
          git merge-base --is-ancestor "$BASE_SHA" "$GITHUB_SHA"
          node tool/design/check_new_widget_inventory.mjs \
            --base "$BASE_SHA" \
            --check \
            --no-write

      - name: Form and schema constraint alignment
        run: flutter test --concurrency=1 test/core/forms/contract_alignment_test.dart

      - name: Localization catalog and getter usage ratchet
        run: |
          mkdir -p build/ci
          node tool/copy/check_l10n_key_usage.mjs --check --json > build/ci/l10n-key-usage.json
          jq '{summary: .inventory.summary}' build/ci/l10n-key-usage.json

      - name: Upload localization key-usage evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: l10n-key-usage-${{ github.sha }}
          path: build/ci/l10n-key-usage.json
          if-no-files-found: error
          retention-days: 14

      - name: Design parity gate
        if: ${{ !inputs.design_parity_in_tools }}
        run: npm run design:parity:check

      - name: Public surface behavior matrix
        run: npm run design:public-surfaces:check

      - name: Check cross-stack component lexicon
        run: node tool/design/check_component_lexicon.mjs

      # Flutter names say organizer: club stays only as the subtype and in
      # names the generated schema contracts declare.
      - name: Organizer nomenclature
        run: node tool/check_organizer_nomenclature.mjs

      # Every Flutter change runs both: CatchIcons must match the role catalog,
      # and icon-family references outside the icon layer may only fall.
      - name: Icon roles and icon-family references
        run: |
          node tool/design/generate_icon_catalog.mjs --check
          node tool/design/check_icon_family_usage.mjs --check

      - name: Design token drift check
        run: dart run tool/design_tokens.dart --check

      - name: Check affected design handoff inputs
        if: ${{ !inputs.design_handoff_in_tools }}
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          SOURCE_SHA: ${{ github.sha }}
          FULL: ${{ inputs.full }}
          COMMIT_WINDOW: ${{ inputs.commit_window || false }}
        run: >-
          node tool/design/check_design_parity.mjs --check-handoff
          --base "$BASE_SHA" --head "$SOURCE_SHA" --full "$FULL"
          --commit-window "$COMMIT_WINDOW"

      - name: Backend error boundary gate
        run: npm run audit:backend-errors:check

      - name: Frontend error boundary gate
        run: npm run audit:frontend-errors:check

      - name: Riverpod lint plugin smoke check
        run: bash tool/check_riverpod_lint.sh

      - name: Catch UI lint plugin smoke check
        if: ${{ needs.test-plan.outputs.ui_lint_smoke == 'true' && !inputs.ui_lint_smoke_in_tools }}
        run: bash tool/check_catch_ui_lints.sh

      - name: Reuse the verified root analyzer diagnostics
        run: |
          test "$(cat /tmp/catch-ui-root-analysis/analyze.status)" = "0"
          test -f /tmp/catch-ui-root-analysis/analyze.machine
          echo 'CATCH_UI_ANALYZE_OUTPUT_PATH=/tmp/catch-ui-root-analysis/analyze.machine' >> "$GITHUB_ENV"
          echo 'CATCH_UI_ANALYZE_STATUS=0' >> "$GITHUB_ENV"

      - name: Catch UI zero-diagnostic gate
        run: bash tool/check_catch_ui_lint_drift.sh --check

      - name: Catch UI enforcement generation and coverage
        run: |
          node tool/design/build_lint_enforcement_tables.mjs --check
          node tool/design/check_component_enforcement_coverage.mjs

      - name: Catch UI resolved composition contracts
        run: dart run tool/architecture/check_ui_composition_contracts.dart --check --json /tmp/catch-ui-composition.json

      - name: Widget cleanup remaining scanner ratchet
        run: bash tool/widget_cleanup_scan.sh --check

      - name: Export Catch UI lint drift artifact
        run: bash tool/check_catch_ui_lint_drift.sh --all --json /tmp/catch-ui-lint-drift.json

      - name: Upload Catch UI enforcement drift
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catch-ui-enforcement-drift
          path: |
            /tmp/catch-ui-lint-drift.json
            /tmp/catch-ui-composition.json
          if-no-files-found: error

      # Schema/codegen drift is covered by Contracts CI, which installs the
      # Node dependencies required by the schema generator.

  flutter-test-shards:
    name: Unit & widget tests shard ${{ matrix.shard_label }}/${{ matrix.shard_total }}
    needs: test-plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.test-plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-flutter

      - run: flutter pub get

      - name: Download this run's selected test inventory
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: flutter-test-plan-${{ github.run_id }}-${{ github.sha }}
          path: build/ci

      - name: Unit & widget tests
        env:
          SHARD_INDEX: ${{ matrix.shard_index }}
          SHARD_TOTAL: ${{ matrix.shard_total }}
          CATCH_EVENT_PARTICIPANTS_CAPTURE_DIR: /tmp/catch-event-participants-review
          CATCH_HOST_RESPONSE_REVIEW_DIR: /tmp/catch-host-response-review
          CATCH_RESPONSE_PAYMENT_REVIEW_DIR: /tmp/catch-response-payment-review
          CATCH_FORM_PAYMENT_CAPTURE_DIR: /tmp/catch-form-payment-review
          CATCH_FORM_PROFILE_CAPTURE_DIR: /tmp/catch-form-profile-review
          CATCH_MESSAGING_CAPTURE_DIR: /tmp/catch-messaging-permissions-review
          CATCH_CHAT_SAFETY_CAPTURE_DIR: /tmp/catch-chat-safety-review
          CATCH_MATCHING_HOST_REVIEW_DIR: /tmp/catch-matching-host-review
        run: |
          jq -er --arg sha "$GITHUB_SHA" --argjson index "$SHARD_INDEX" \
            '.sourceSha == $sha and (.shards[$index].files | length > 0)' \
            build/ci/flutter-test-plan.json > /dev/null
          jq -r --argjson index "$SHARD_INDEX" '.shards[$index].files[]' \
            build/ci/flutter-test-plan.json > /tmp/flutter_test_files.txt

          count="$(wc -l < /tmp/flutter_test_files.txt | tr -d '[:space:]')"
          echo "Running ${count} test files in shard ${SHARD_INDEX}/${SHARD_TOTAL}."
          if [[ "${count}" == "0" ]]; then
            echo "No test files were selected for shard ${SHARD_INDEX}/${SHARD_TOTAL}." >&2
            exit 1
          fi

          mapfile -t files < /tmp/flutter_test_files.txt

          # Exact PNG goldens are generated against the local desktop renderer and
          # are intentionally tagged out of Ubuntu CI to avoid cross-platform font
          # antialiasing noise. Run them locally with `flutter test test/goldens`.
          # Two file workers use the hosted runner without unbounded compiler
          # processes; shard coverage is still owned by this single invocation.
          flutter test --concurrency=2 --exclude-tags=golden --coverage "${files[@]}"

      - name: Label synthetic RSVP widget captures
        if: always()
        env:
          CAPTURE_OUTPUT_DIR: ${{ runner.temp }}/rsvp-widget-captures
          CAPTURE_SHARD_INDEX: ${{ matrix.shard_index }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil

          sources = {
              'event-profile': ('/tmp/catch-event-profile-review', 'test/chats/event_profile_widget_test.dart'),
              'event-chat': ('/tmp/catch-event-chat-review', 'test/chats/event_chat_widget_test.dart'),
              'event-participants': ('/tmp/catch-event-participants-review', 'test/chats/event_chat_participants_widget_test.dart'),
              'host-response-review': ('/tmp/catch-host-response-review', 'test/hosts/forms/host_form_response_detail_screen_test.dart'),
              'response-payment': ('/tmp/catch-response-payment-review', 'test/hosts/forms/host_form_response_detail_screen_test.dart'),
              'form-payment': ('/tmp/catch-form-payment-review', 'test/hosts/forms/host_form_payments_section_list_test.dart'),
              'form-profile-question': ('/tmp/catch-form-profile-review', 'test/hosts/forms/host_form_profile_question_section_test.dart'),
              'messaging-permissions': ('/tmp/catch-messaging-permissions-review', 'test/safety/messaging_permissions_widget_test.dart'),
              'chat-safety': ('/tmp/catch-chat-safety-review', 'test/chats/event_chat_message_actions_widget_test.dart'),
              'matching-host': ('/tmp/catch-matching-host-review', 'test/event_success/event_success_assignment_features_test.dart'),
              'audience-response-catalog': ('artifacts/response-detail-review/after', 'test/ui_captures/response_detail_preview_test.dart'),
              'audience-person-catalog': ('artifacts/ui-captures/audience-person-review', 'test/ui_captures/fixtures/host_audience_journey_fixture_test.dart'),
          }
          nested_groups = {'audience-response-catalog', 'audience-person-catalog'}
          output = Path(os.environ['CAPTURE_OUTPUT_DIR'])
          captures = []
          for group, (directory, source_test) in sources.items():
              root = Path(directory)
              nested = group in nested_groups
              if nested and any(part.is_symlink() for part in (root, *root.parents)):
                  raise SystemExit(f'Refusing symlink capture root: {root}')
              if not root.is_dir():
                  continue
              images = root.rglob('*') if nested else root.iterdir()
              for image in sorted(images):
                  if nested and image.is_symlink():
                      raise SystemExit(f'Refusing symlink capture entry: {image}')
                  if image.suffix != '.png' or not image.is_file() or image.is_symlink():
                      continue
                  target = output / group / image.relative_to(root)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(image, target)
                  capture_source = source_test
                  if group == 'event-chat' and image.name.startswith('directory-'):
                      capture_source = 'test/chats/event_chat_directory_widget_test.dart'
                  if group == 'host-response-review' and image.name.startswith('filters-'):
                      capture_source = 'test/hosts/forms/host_form_response_filters_test.dart'
                  if group == 'form-payment' and image.name.startswith(('unavailable-', 'configure-fee-', 'ready-large-')):
                      capture_source = 'test/hosts/forms/host_form_payment_settings_test.dart'
                  captures.append({
                      'path': str(target.relative_to(output)),
                      'sourceTest': capture_source,
                      'sha256': hashlib.sha256(target.read_bytes()).hexdigest(),
                  })
          if captures:
              (output / 'manifest.json').write_text(json.dumps({
                  'label': 'synthetic Flutter widget fixture; not live or visually reviewed',
                  'sourceSha': os.environ['GITHUB_SHA'],
                  'runId': os.environ['GITHUB_RUN_ID'],
                  'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
                  'shardIndex': os.environ['CAPTURE_SHARD_INDEX'],
                  'captures': captures,
              }, indent=2) + '\n')
          PY

      - name: Retain synthetic RSVP widget captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rsvp-synthetic-widget-captures-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-${{ matrix.shard_index }}
          path: ${{ runner.temp }}/rsvp-widget-captures/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test-shard coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flutter-coverage-shard-${{ github.run_id }}-${{ github.sha }}-${{ matrix.shard_index }}
          path: coverage/lcov.info
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  flutter-coverage:
    name: Flutter coverage visibility
    needs: [test-plan, flutter-test-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - id: toolchain
        uses: ./.github/actions/load-toolchain

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}

      - name: Download coverage from every successful test shard
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: flutter-coverage-shard-${{ github.run_id }}-${{ github.sha }}-*
          path: coverage/shards

      - name: Merge coverage without rerunning tests
        env:
          SHARD_TOTAL: ${{ needs.test-plan.outputs.shard_total }}
        run: >-
          node tool/test/flutter_coverage_report.mjs
          --merge-shards coverage/shards
          --expected-shards "$SHARD_TOTAL"
          --output coverage/lcov.info

      - name: Build feature-level coverage report
        run: |
          node tool/test/flutter_coverage_report.mjs \
            --lcov coverage/lcov.info \
            --format markdown \
            --output coverage/flutter-coverage-summary.md
          cat coverage/flutter-coverage-summary.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Flutter coverage evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flutter-coverage-${{ github.run_id }}
          path: |
            coverage/lcov.info
            coverage/flutter-coverage-summary.md
          if-no-files-found: error
          retention-days: 14

  app-package-tests:
    name: Catch UI, Consumer & Host package tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-flutter

      - run: flutter pub get

      - name: Catch UI package tests
        working-directory: packages/catch_ui
        run: flutter test --concurrency=1

      - name: Consumer package tests
        working-directory: apps/consumer
        run: flutter test --concurrency=1

      - name: Host package tests
        working-directory: apps/host
        run: flutter test --concurrency=1

  widgetbook:
    name: Widgetbook analyze & build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-flutter

      - name: Resolve Widgetbook dependencies
        working-directory: widgetbook
        run: flutter pub get

      # The golden inventory check renders nothing, so pull requests run it
      # here on Linux instead of waiting for the merge queue's macOS goldens.
      # The shared font loader reads the repository package config.
      - name: Resolve repository Flutter dependencies
        run: flutter pub get

      - name: Check the Widgetbook golden inventory
        working-directory: widgetbook
        run: >-
          flutter test test/primitive_goldens_test.dart
          --plain-name "generator visits every registered case and every designation once"

      - name: Build Widgetbook web app
        working-directory: widgetbook
        run: flutter build web --release

  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    needs:
      - test-plan
      - analysis-gates
      - app-package-tests
      - flutter-coverage
      - flutter-test-shards
      - widgetbook
    if: ${{ !cancelled() }}
    timeout-minutes: 5

    steps:
      - name: Check Flutter CI results
        env:
          TEST_PLAN_RESULT: ${{ needs['test-plan'].result }}
          GATES_RESULT: ${{ needs['analysis-gates'].result }}
          APP_PACKAGES_RESULT: ${{ needs['app-package-tests'].result }}
          COVERAGE_RESULT: ${{ needs['flutter-coverage'].result }}
          TESTS_RESULT: ${{ needs['flutter-test-shards'].result }}
          WIDGETBOOK_RESULT: ${{ needs.widgetbook.result }}
        run: |
          echo "analysis gates: ${GATES_RESULT}"
          echo "app package tests: ${APP_PACKAGES_RESULT}"
          echo "coverage visibility: ${COVERAGE_RESULT}"
          echo "test shards: ${TESTS_RESULT}"
          echo "widgetbook: ${WIDGETBOOK_RESULT}"
          if [[ "${TEST_PLAN_RESULT}" != "success" || "${GATES_RESULT}" != "success" || "${APP_PACKAGES_RESULT}" != "success" || "${COVERAGE_RESULT}" != "success" || "${TESTS_RESULT}" != "success" || "${WIDGETBOOK_RESULT}" != "success" ]]; then
            exit 1
          fi
