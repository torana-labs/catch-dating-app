name: Release Readiness

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to verify before release.
        required: true
        default: prod
        type: choice
        options:
          - staging
          - prod
      app_role:
        description: App role to verify.
        required: true
        default: consumer
        type: choice
        options:
          - consumer
          - host
          - both

jobs:
  checklist:
    name: Release checklist
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - id: toolchain
        uses: ./.github/actions/load-toolchain

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.java-version }}

      - uses: ./.github/actions/setup-flutter

      - run: flutter pub get

      - run: npm --prefix functions ci

      - run: npm install -g firebase-tools@${{ steps.toolchain.outputs.firebase-tools-version }}

      - name: Validate installable app targets
        run: node tool/run.mjs check platform:app-targets platform:verify-ios-release-identity

      - name: Validate checked-in Firebase config for environment
        run: |
          roles="${{ inputs.app_role }}"
          if [[ "$roles" == "both" ]]; then
            roles="consumer host"
          fi

          for role in $roles; do
            ./tool/use_firebase_environment.sh "${{ inputs.environment }}" "$role" "apps/$role"
            ./tool/validate_firebase_environment.sh "${{ inputs.environment }}" "$role" "apps/$role"
          done

      - name: Flutter analysis
        run: flutter analyze --no-fatal-infos

      - name: Flutter tests
        run: flutter test --concurrency=1

      - name: Firestore contract check
        run: node tool/contracts/check_firestore_contract.mjs

      - name: Functions lint
        run: npm --prefix functions run lint

      - name: Functions tests
        run: npm --prefix functions test

      - name: Firestore rules tests
        run: firebase emulators:exec --project demo-catch-rules --only firestore,storage "npm --prefix functions run test:rules"

      - name: Build release web artifact
        run: |
          roles="${{ inputs.app_role }}"
          if [[ "$roles" == "both" ]]; then
            roles="consumer host"
          fi

          for role in $roles; do
            if [[ "$role" == "consumer" ]]; then
              ./tool/flutter_with_env.sh "${{ inputs.environment }}" build web --release
            else
              ./tool/flutter_with_env.sh "${{ inputs.environment }}" --role host build web --release
            fi
          done

      - name: Write release checklist summary
        run: |
          {
            echo "## Release readiness"
            echo
            echo "- Environment: \`${{ inputs.environment }}\`"
            echo "- App role: \`${{ inputs.app_role }}\`"
            echo "- Firebase config validation: passed"
            echo "- Flutter analysis: passed"
            echo "- Flutter tests: passed"
            echo "- Firestore contract check: passed"
            echo "- Functions lint/tests: passed"
            echo "- Firestore rules emulator tests: passed"
            echo "- Release web build: passed"
            echo
            echo "Still required outside this workflow:"
            echo "- TestFlight upload/install evidence."
            echo "- Play internal testing evidence."
            echo "- Crashlytics dashboard event evidence."
            echo "- Analytics DebugView event evidence."
            echo "- Store metadata, screenshots, privacy forms, and legal/support URLs."
          } >> "$GITHUB_STEP_SUMMARY"
