name: Backend deploy (one environment)

# Deploys one environment's Firebase backend from the commit this run was
# started on. Functions deploy as the codebases in functions/deploy-codebases.json
# (functions/scripts/build-deploy-codebases.cjs). The Firebase CLI hashes each
# codebase's code, parameters and secrets and skips every Function whose hash
# matches what is live, so a deploy rebuilds only what changed, and a retry
# rebuilds only what failed. Indexes and rules deploy every time; the CLI
# leaves them alone when they match. Two GitHub deployments record this
# commit and each codebase's hash: deploy:backend-functions once the Functions
# pass parity, and deploy:backend once the rules are verified too. Before any
# change, a run reports the codebases it changes against the newer of the
# two: each is one Cloud Build (its
# Functions share the build) and an update of every Function in it. Updates
# are free and a build is about a minute, so the size is reported, not
# limited. A run given named Functions deploys only those, for a configuration
# change, and records nothing. Operator guide: docs/release_operations.md, "Deploy backend".

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      full:
        required: false
        type: boolean
        default: false
      # Comma-separated Function names deployed instead of every changed one,
      # for a configuration change. The record stays where it is, because the
      # rest of this commit has not reached the environment.
      functions:
        required: false
        type: string
        default: ''
      # The commit to deploy; empty means the commit this run started on. The
      # scheduled run passes the newest main commit whose CI passed.
      ref:
        required: false
        type: string
        default: ''

permissions:
  actions: read
  contents: write
  deployments: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: ${{ inputs.environment }}
    # One deploy per environment at a time. A newer run waits; GitHub keeps
    # only the newest waiting run.
    concurrency:
      group: backend-deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      DEPLOY_SHA: ${{ inputs.ref || github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      # A rerun of an older commit must not replace a newer deployed one.
      # Two records say what an environment has: deploy:backend (everything,
      # with verified rules) and deploy:backend-functions (written as soon as
      # the Functions are deployed and pass parity, so a later rules failure
      # does not make the next run redeploy every Function). This commit must
      # contain the newest delivered record of each. GitHub marks a record
      # inactive seconds after its success status (a newer deployment in the
      # environment supersedes it), so a record counts as delivered when any
      # of its statuses is success, not only the newest.
      - id: guard
        name: Skip a commit older than the deployed one
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          skip=false
          for task in deploy:backend deploy:backend-functions; do
            key=deployment
            if [[ "$task" == "deploy:backend-functions" ]]; then key=functions_deployment; fi
            page=1
            found=""
            while [[ -z "$found" ]]; do
              # Assign separately: failures in a for substitution or an if
              # condition do not stop Bash even with errexit enabled.
              ids="$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=$DEPLOY_ENVIRONMENT&task=$task&per_page=100&page=$page" -q '.[].id')"
              if [[ -z "$ids" ]]; then break; fi
              for id in $ids; do
                state="$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=100" \
                  -q 'if any(.[]; .state == "success") then "success" else (.[0].state // "") end')"
                if [[ "$state" == "success" ]]; then
                  base="$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id" -q .sha)"
                  echo "$key=$id" >> "$GITHUB_OUTPUT"
                  if ! git merge-base --is-ancestor "$base" "$DEPLOY_SHA"; then
                    echo "::notice::$DEPLOY_ENVIRONMENT already has $base ($task), which $DEPLOY_SHA does not contain; nothing to deploy."
                    skip=true
                  fi
                  found="$id"
                  break
                fi
              done
              page=$((page + 1))
            done
          done
          if [[ "$skip" == "true" ]]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi

      - id: toolchain
        if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: ./.github/actions/load-toolchain

      - uses: actions/setup-node@v6
        if: ${{ steps.guard.outputs.skip != 'true' }}
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: ./.github/actions/generate-contracts
      # Functions CI publishes the lib its tests ran, under a hash of what tsc
      # reads (tool/firebase/functions_build_hash.mjs). After prebuild has
      # generated the same sources, the deploy ships that build if a trusted
      # main or merge-queue CI run published it and every file verifies
      # (tool/firebase/select_functions_build.mjs); otherwise it compiles here.
      - name: Install and build Functions
        if: ${{ steps.guard.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_VERSION: ${{ steps.toolchain.outputs.node-version }}
        run: |
          set -euo pipefail
          npm --prefix functions ci
          npm --prefix functions run prebuild
          if ! node tool/firebase/select_functions_build.mjs --functions-dir functions \
            --node-version "$NODE_VERSION" --repository "$GITHUB_REPOSITORY" --summary "$GITHUB_STEP_SUMMARY"; then
            npm --prefix functions run build
          fi

      - name: Authenticate to Google Cloud
        if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Install Google Cloud CLI
        if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: google-github-actions/setup-gcloud@v3

      - name: Install Firebase CLI
        if: ${{ steps.guard.outputs.skip != 'true' }}
        run: npm install -g firebase-tools@${{ steps.toolchain.outputs.firebase-tools-version }}

      - name: Materialize Functions parameters from this environment's variables
        if: ${{ steps.guard.outputs.skip != 'true' }}
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          # Non-secret configuration only; secret values stay in Secret Manager.
          ENVIRONMENT_VARIABLES: ${{ toJSON(vars) }}
        run: |
          set -euo pipefail
          project_id="$(jq -er --arg env "$DEPLOY_ENVIRONMENT" '.projects[$env]' .firebaserc)"
          node -e '
            const env = {...process.env, ...JSON.parse(process.env.ENVIRONMENT_VARIABLES)};
            const run = require("node:child_process").spawnSync(
              process.execPath, process.argv.slice(1), {env, stdio: "inherit"});
            process.exit(run.status ?? 1);
          ' tool/firebase/prepare_functions_params_for_deploy.mjs \
            --functions-dir functions --project "$project_id"
          node tool/firebase/check_functions_params_coverage.mjs \
            --functions-dir functions --env-file "functions/.env.$project_id"

      # CI already ran the predeploy test suites for this commit and the build
      # above produced lib, so the deploy config carries no predeploy hooks.
      - name: Package Functions as codebases
        if: ${{ steps.guard.outputs.skip != 'true' }}
        run: |
          set -euo pipefail
          node functions/scripts/build-deploy-codebases.cjs --config-out firebase.deploy.json \
            --manifest-out build/functions-codebases.json
          jq 'walk(if type == "object" then del(.predeploy) else . end)' \
            firebase.deploy.json > firebase.deploy.tmp.json
          mv firebase.deploy.tmp.json firebase.deploy.json

      # The CLI addresses a Function in a codebase as functions:<codebase>:<name>.
      # Exact names may also pass --force (newly enabling retry on failure);
      # a broad selector never does, because --force also deletes Functions
      # missing from source.
      - id: choose
        name: Choose the Functions to deploy
        if: ${{ steps.guard.outputs.skip != 'true' }}
        env:
          FULL: ${{ inputs.full }}
          FUNCTIONS: ${{ inputs.functions }}
        run: |
          set -euo pipefail
          functions="${FUNCTIONS:-}"
          if [[ -z "${functions// /}" ]]; then
            only=functions
            if [[ "$FULL" == "true" ]]; then
              only="$(jq -r '[.functions[].codebase | "functions:" + .] | join(",")' firebase.deploy.json)"
            fi
            printf 'only=%s\npostconditions=functions\n' "$only" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$FULL" == "true" ]]; then
            echo "::error::Choose a full deploy or named Functions, not both."
            exit 1
          fi
          only=""
          names=""
          for name in $(tr ',' ' ' <<< "$functions"); do
            if [[ ! "$name" =~ ^[A-Za-z][A-Za-z0-9_-]*$ ]]; then
              echo "::error::'$name' is not a Function name."
              exit 1
            fi
            entry="$(grep -lF "Object.defineProperty(exports, \"$name\"," build/functions-codebases/*/index.js || true)"
            if [[ -z "$entry" ]]; then
              echo "::error::'$name' is not a deployable Function in this commit."
              exit 1
            fi
            only="${only:+$only,}functions:$(basename "$(dirname "$entry")"):$name"
            names="${names:+$names,}functions:$name"
          done
          printf 'mode=named\nonly=%s\npostconditions=%s\n' "$only" "$names" >> "$GITHUB_OUTPUT"
          echo "Named Functions only: $only" >> "$GITHUB_STEP_SUMMARY"

      # Missing and indeterminate prerequisites both stop before mutation.
      # Preserve the checker's exit status, including errors without a report.
      # A closed billing account stops Cloud Run from serving every Function
      # and refuses every deploy. That is not this commit's fault, so the run
      # defers with a warning and records nothing; the next run after the
      # project serves again deploys the whole delta. The probe is an
      # unauthenticated POST to one callable plus a metadata-only gcloud
      # listing; uncertainty counts as serving.
      - id: platform
        name: Check the platform is serving before touching it
        if: ${{ steps.guard.outputs.skip != 'true' }}
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        run: node tool/firebase/check_platform_availability.mjs --env "$DEPLOY_ENVIRONMENT" --callable adminListEventDirectory --gcloud-probe

      # The CLI rebuilds every codebase whose content changed and updates every
      # Function in it. Compare each codebase's hash with the ones the last
      # delivered deploy recorded and report the builds and updates in the run
      # summary. A missing record counts every codebase. Named runs deploy only
      # those.
      - name: Report what this deploy changes
        if: ${{ steps.guard.outputs.skip != 'true' && steps.platform.outputs.available != 'false' && steps.choose.outputs.mode != 'named' }}
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          # The Functions record is the newer of the two when a run's rules failed.
          DEPLOYED_ID: ${{ steps.guard.outputs.functions_deployment || steps.guard.outputs.deployment }}
          FULL: ${{ inputs.full }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : > build/deployed-codebases.json
          if [[ -n "${DEPLOYED_ID:-}" ]]; then
            gh api "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYED_ID" -q '.payload' > build/deployed-codebases.json
          fi
          node functions/scripts/deploy-size.cjs --current build/functions-codebases.json \
            --previous build/deployed-codebases.json \
            --environment "$DEPLOY_ENVIRONMENT" --full "$FULL" --summary "$GITHUB_STEP_SUMMARY"

      # Each Function's hash includes the newest version of every secret it
      # declares with defineSecret, as the Firebase CLI's does, so rotating a
      # secret still redeploys exactly the Functions that declare it. This is
      # the same metadata read the CLI makes on every deploy (versions/latest,
      # never the value). A secret that cannot be read is named loudly, and the
      # planner falls back to every changed codebase for this run.
      - name: Read the declared secrets' newest versions
        if: ${{ steps.guard.outputs.skip != 'true' && steps.platform.outputs.available != 'false' && steps.choose.outputs.mode != 'named' }}
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          project_id="$(jq -er --arg env "$DEPLOY_ENVIRONMENT" '.projects[$env]' .firebaserc)"
          secrets="$(jq -r '[.codebases[].functionSecrets // {} | .[][]] | unique | .[]' build/functions-codebases.json)"
          versions='{}'
          failures='[]'
          for secret in $secrets; do
            if version="$(gcloud secrets versions describe latest --secret="$secret" --project="$project_id" \
                --format='value(name)' --quiet 2> build/secret-version-error.txt)" && [[ -n "$version" ]]; then
              versions="$(jq -c --arg s "$secret" --arg v "$version" '. + {($s): $v}' <<< "$versions")"
            else
              failures="$(jq -c --arg s "$secret" '. + [$s]' <<< "$failures")"
              echo "::warning::Could not read the newest version of secret $secret: $(head -c 300 build/secret-version-error.txt | tr '\n' ' ')"
              echo "- Could not read the newest version of secret \`$secret\`; this run deploys every changed codebase." >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          jq -n --argjson versions "$versions" --argjson failures "$failures" \
            '{versions: $versions, failures: $failures}' > build/secret-versions.json

      # Deploy exactly the Functions whose own hash changed since the
      # delivered Functions record (tool/firebase/plan_function_deploy.mjs),
      # or fall back to the CLI's codebase skip when that cannot be proven.
      # The plan, with each Function and why, goes to the run summary; it also
      # writes the payload both records store.
      - id: plan
        name: Plan the Functions to deploy
        if: ${{ steps.guard.outputs.skip != 'true' && steps.platform.outputs.available != 'false' && steps.choose.outputs.mode != 'named' }}
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          FULL: ${{ inputs.full }}
          TOOLCHAIN: ${{ format('{{"firebaseTools":"{0}","node":"{1}"}}', steps.toolchain.outputs.firebase-tools-version, steps.toolchain.outputs.node-version) }}
        run: >-
          node tool/firebase/plan_function_deploy.mjs --current build/functions-codebases.json
          --previous build/deployed-codebases.json --secrets build/secret-versions.json
          --retired functions/retired-functions.json --toolchain "$TOOLCHAIN" --full "$FULL" --environment "$DEPLOY_ENVIRONMENT"
          --plan-out build/function-plan.json --record-out build/functions-record.json
          --summary "$GITHUB_STEP_SUMMARY" --github-output "$GITHUB_OUTPUT"

      - name: Check this environment is ready
        if: ${{ steps.guard.outputs.skip != 'true' && steps.platform.outputs.available != 'false' }}
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          DEPLOY_TARGETS: >-
            ${{ steps.choose.outputs.mode == 'named' && steps.choose.outputs.postconditions
            || 'firestore:indexes,functions,firestore:rules,storage' }}
        run: |
          set -euo pipefail
          mkdir -p build
          readiness_status=0
          node tool/firebase/check_environment_readiness.mjs \
            --env "$DEPLOY_ENVIRONMENT" --targets "$DEPLOY_TARGETS" \
            --source-root . --source-sha "$DEPLOY_SHA" --json > build/readiness.json || readiness_status=$?
          cat build/readiness.json
          exit "$readiness_status"

      # New indexes must be READY before Functions that query them deploy.
      - name: Deploy Firestore indexes
        if: ${{ steps.guard.outputs.skip != 'true' && steps.platform.outputs.available != 'false' && steps.choose.outputs.mode != 'named' }}
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          # This run deploys its own exact commit; the record says which one.
          CATCH_DEPLOY_ALLOW_BEHIND: "1"
        run: |
          set -euo pipefail
          project_id="$(jq -er --arg env "$DEPLOY_ENVIRONMENT" '.projects[$env]' .firebaserc)"
          ./tool/deploy_firebase_targets.sh "$DEPLOY_ENVIRONMENT" firestore:indexes \
            --config firebase.deploy.json
          node tool/firebase/wait_firestore_indexes_ready.mjs \
            --indexes firestore.indexes.json --project "$project_id" \
            --timeout-seconds 1800 --poll-seconds 20

      # A Function removed from source stops a broad deploy, and --force would
      # delete whatever is missing. So removals are named in
      # functions/retired-functions.json: this deletes exactly those that are
      # live in this environment, in every kind of run, and nothing else. A name
      # still in this commit's source is refused before any deletion.
      - name: Retire named Functions
        if: ${{ steps.guard.outputs.skip != 'true' && steps.platform.outputs.available != 'false' }}
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          retired="$(jq -r '.[]' functions/retired-functions.json)"
          if [[ -z "$retired" ]]; then exit 0; fi
          while IFS= read -r name; do
            if [[ ! "$name" =~ ^[A-Za-z][A-Za-z0-9_]*$ ]]; then
              echo "::error::'$name' is not a Function name."
              exit 1
            fi
            if grep -qF "Object.defineProperty(exports, \"$name\"," build/functions-codebases/*/index.js; then
              echo "::error::'$name' is listed as retired but this commit still deploys it."
              exit 1
            fi
          done <<< "$retired"
          live="$(./tool/firebase_with_env.sh "$DEPLOY_ENVIRONMENT" functions:list --json | jq -r '.result[].id')"
          present=()
          while IFS= read -r name; do
            # The CLI's filter also takes a Function group of this name.
            if grep -q "^$name-" <<< "$live"; then
              echo "::error::'$name' is also a live Function group; delete by exact name is not possible."
              exit 1
            fi
            if grep -qxF "$name" <<< "$live"; then present+=("$name"); fi
          done <<< "$retired"
          if [[ "${#present[@]}" == "0" ]]; then exit 0; fi
          echo "::notice::Retiring from $DEPLOY_ENVIRONMENT: ${present[*]}"
          ./tool/firebase_with_env.sh "$DEPLOY_ENVIRONMENT" functions:delete "${present[@]}" --force --non-interactive
          echo "Retired from $DEPLOY_ENVIRONMENT: ${present[*]}" >> "$GITHUB_STEP_SUMMARY"

      # Naming codebases (full) or Functions (named) makes the CLI deploy them
      # even when unchanged. A broad deploy that adds a Function retrying on
      # failure is refused before any change, with those Functions listed; they
      # deploy by name with --force (which then deletes nothing), and the next
      # attempt does the rest. A planned run deploys exactly the Functions the
      # plan names, and skips this step when it names none.
      # Up to three attempts, 60 seconds apart. When the CLI names the Functions
      # that failed (an update, or setting the invoker: on 16 Nov 2026 Cloud
      # Run read-quota 429s failed 3 invoker sets the CLI does not retry), the
      # next attempt deploys exactly those, by name; the CLI never skips a
      # Function named in --only, so the invoker is set again. Otherwise a
      # planned or named run repeats its targets, and any other run deploys
      # plain `functions`, whose unchanged codebases are skipped.
      - name: Deploy Functions
        if: ${{ steps.guard.outputs.skip != 'true' && steps.platform.outputs.available != 'false' && !(steps.plan.outputs.mode == 'planned' && steps.plan.outputs.count == '0') }}
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          DEPLOY_ONLY: ${{ (steps.choose.outputs.mode == 'named' || inputs.full) && steps.choose.outputs.only || steps.plan.outputs.only || steps.choose.outputs.only }}
          NAMED: ${{ steps.choose.outputs.mode == 'named' }}
          PLANNED: ${{ steps.plan.outputs.mode == 'planned' }}
          RETRY_DELAY_SECONDS: "60"
        run: |
          set -euo pipefail
          mkdir -p build
          only="$DEPLOY_ONLY"
          force=()
          if [[ "$NAMED" == "true" ]]; then force=(--force); fi
          attempts=3
          for attempt in $(seq 1 "$attempts"); do
            status=0
            started=$SECONDS
            ./tool/firebase_with_env.sh "$DEPLOY_ENVIRONMENT" deploy --only "$only" \
              --config firebase.deploy.json --non-interactive "${force[@]}" 2>&1 |
              tee build/functions-deploy.log || status=$?
            # What each attempt cost. One CLI call: on 16 Nov 2026 a full dev
            # deploy took 19 min in one call, 30 in groups of 80 and 37 in
            # groups of 40, and every group rebuilt each codebase it touched;
            # the CLI waits out its own 429s (docs/release_operations.md).
            count() { grep -c "$1" build/functions-deploy.log || true; }
            echo "- Functions attempt $attempt: $(count 'HTTP Error: 429') HTTP 429 responses," \
              "$(count 'Successful update operation') updated, $(count 'Successful create operation') created," \
              "exit $status, $((SECONDS - started)) s" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            if [[ "$status" == "0" ]]; then exit 0; fi
            retrying="$(perl -ne 's/\e\[[0-9;]*m//g;
              print "$1\n" if /newly be retried in case of failure: (.*?)\. Retried/' build/functions-deploy.log |
              tr ',' '\n' | sed -E 's/^ +//; s/\([^)]*\)$//; /^$/d; s/^/functions:/' | paste -sd, -)"
            if [[ -n "$retrying" && "$NAMED" != "true" ]]; then
              echo "::notice::Deploying Functions that newly retry on failure: $retrying"
              ./tool/firebase_with_env.sh "$DEPLOY_ENVIRONMENT" deploy --only "$retrying" \
                --config firebase.deploy.json --non-interactive --force ||
                echo "::warning::Deploying the newly retrying Functions failed."
            fi
            # The Functions the CLI lists as failed, as exact codebase targets.
            failed="$(perl -ne 's/\e\[[0-9;]*m//g;
              if (/^(Functions deploy had errors with|Unable to set the invoker for the IAM policy on) the following functions:/) {
                $on = 1; next }
              $on = 0 if /^\s*$/;
              print "functions:$1\n" if $on && /^\s+([a-z0-9_-]+:[A-Za-z0-9_-]+)\(/' build/functions-deploy.log |
              sort -u | paste -sd, -)"
            # Narrow only when the CLI's final error is its per-Function one and
            # every Function it names is in those lists. Any other error (a
            # build, an upload, a secret grant) or an unlisted Function (an
            # aborted delete) would stay stale behind a narrow retry that
            # passes, and parity checks only presence; the broad retry
            # redeploys whatever did not land.
            if [[ -n "$failed" ]] && ! FAILED="$failed" perl -e '
              my %listed = map { (split /:/)[-1] => 1 } split /,/, $ENV{FAILED};
              my ($final, $other) = (0, 0);
              while (<>) {
                s/\e\[[0-9;]*m//g;
                if (/^Error: There was an error deploying functions/) { $final = 1; next }
                if (/^Error:/) { $other = 1; next }
                if ($final && /^- Error Failed to .+ function (\S+) in region /) { $other = 1 unless $listed{$1} }
              }
              exit($final && !$other ? 0 : 1)' build/functions-deploy.log; then
              echo "::warning::The CLI reported a failure outside its list of failed Functions; the next attempt deploys broadly."
              failed=""
            fi
            if (( attempt == attempts )); then
              echo "::error::Functions deploy failed after $attempts attempts${failed:+; still failing: $failed}."
              break
            fi
            if [[ -n "$failed" ]]; then only="$failed"
            elif [[ "$NAMED" != "true" && "$PLANNED" != "true" ]]; then only=functions; fi
            echo "::warning::Functions deploy attempt $attempt failed; attempt $((attempt + 1)) deploys $only."
            sleep "$RETRY_DELAY_SECONDS"
          done
          exit "$status"

      - name: Check callable access and Functions parity
        if: ${{ steps.guard.outputs.skip != 'true' && steps.platform.outputs.available != 'false' }}
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          # This run deploys its own exact commit; the record says which one.
          CATCH_DEPLOY_ALLOW_BEHIND: "1"
          TARGETS: ${{ steps.choose.outputs.postconditions }}
        run: ./tool/deploy_firebase_targets.sh --functions-postconditions-only "$DEPLOY_ENVIRONMENT" "$TARGETS"

      # The Functions are live and match this commit (the parity check above),
      # so record that now: a later rules or verify failure then leaves the
      # next run nothing to redeploy for Functions. The full deploy:backend
      # record below still waits for the rules. Its payload holds each
      # codebase's hash, which the next run's report compares with.
      - name: Record the delivered Functions
        if: ${{ steps.guard.outputs.skip != 'true' && steps.platform.outputs.available != 'false' && steps.choose.outputs.mode != 'named' }}
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jq -n --arg ref "$DEPLOY_SHA" --arg environment "$DEPLOY_ENVIRONMENT" \
            --slurpfile payload build/functions-record.json \
            '{ref: $ref, environment: $environment, task: "deploy:backend-functions", auto_merge: false,
              required_contexts: [], description: "Firebase Functions deployed", payload: $payload[0]}' > build/functions-deployment.json
          # A temporary GitHub API error retries (tool/firebase/retry_transient.mjs).
          id="$(node tool/firebase/retry_transient.mjs --label "Recording deploy:backend-functions" -- \
            gh api -X POST "repos/$GITHUB_REPOSITORY/deployments" --input build/functions-deployment.json -q .id)"
          node tool/firebase/retry_transient.mjs --label "Marking deploy:backend-functions delivered" -- \
            gh api -X POST "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" -f state=success \
            -f log_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
          echo "$DEPLOY_ENVIRONMENT deploy:backend-functions -> $DEPLOY_SHA (deployment $id)" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy Firestore and Storage rules
        if: ${{ steps.guard.outputs.skip != 'true' && steps.platform.outputs.available != 'false' && steps.choose.outputs.mode != 'named' }}
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          # This run deploys its own exact commit; the record says which one.
          CATCH_DEPLOY_ALLOW_BEHIND: "1"
        run: ./tool/deploy_firebase_targets.sh "$DEPLOY_ENVIRONMENT" firestore:rules,storage --config firebase.deploy.json

      # Live Firestore and Storage rules must equal this commit's sources before
      # the record claims the environment received it.
      - name: Verify the active rules match this commit
        if: ${{ steps.guard.outputs.skip != 'true' && steps.platform.outputs.available != 'false' && steps.choose.outputs.mode != 'named' }}
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        run: >-
          node tool/firebase/check_rules_deployment_drift.mjs
          --env "$DEPLOY_ENVIRONMENT" --wait-seconds 180 --poll-seconds 10

      # A GitHub deployment, not a tag: GITHUB_TOKEN may create one for any
      # commit, while GitHub refuses it a tag on a commit whose history changes
      # workflow files. The guard above refuses a commit older than the record.
      # Its payload holds each codebase's hash, which the next run's report
      # compares with.
      - name: Record the deployed commit
        if: ${{ steps.guard.outputs.skip != 'true' && steps.platform.outputs.available != 'false' && steps.choose.outputs.mode != 'named' }}
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jq -n --arg ref "$DEPLOY_SHA" --arg environment "$DEPLOY_ENVIRONMENT" \
            --slurpfile payload build/functions-record.json \
            '{ref: $ref, environment: $environment, task: "deploy:backend", auto_merge: false,
              required_contexts: [], description: "Firebase backend deployed", payload: $payload[0]}' > build/backend-deployment.json
          # A temporary GitHub API error retries (tool/firebase/retry_transient.mjs).
          id="$(node tool/firebase/retry_transient.mjs --label "Recording deploy:backend" -- \
            gh api -X POST "repos/$GITHUB_REPOSITORY/deployments" --input build/backend-deployment.json -q .id)"
          node tool/firebase/retry_transient.mjs --label "Marking deploy:backend delivered" -- \
            gh api -X POST "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" -f state=success \
            -f log_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
          echo "$DEPLOY_ENVIRONMENT deploy:backend -> $DEPLOY_SHA (deployment $id)" >> "$GITHUB_STEP_SUMMARY"
