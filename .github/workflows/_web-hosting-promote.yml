name: Web Hosting Exact Promotion

on:
  workflow_call:
    inputs:
      artifact_digest:
        description: Exact GitHub SHA-256 digest for the artifact ZIP.
        required: true
        type: string
      artifact_id:
        description: Immutable GitHub artifact id.
        required: true
        type: string
      recovery:
        description: Whether this is an explicit terminal-run recovery.
        required: false
        default: false
        type: boolean
      recovery_reason:
        description: Required operator reason for bounded recovery.
        required: false
        default: ""
        type: string
      source_ci_run_attempt:
        required: true
        type: string
      source_ci_run_id:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      surface:
        description: Exact Hosting target (admin, host, or marketing).
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  promote:
    name: Promote exact ${{ inputs.surface }} Hosting bytes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: prod-hosting
    concurrency:
      group: web-hosting-${{ inputs.surface }}
      cancel-in-progress: false
      queue: max

    steps:
      # workflow_sha is the immutable, main-bound caller/control-plane SHA.
      # source_sha and artifact contents remain unauthorized until authorize passes.
      - name: Checkout immutable workflow control plane before source authorization
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .hosting-control
          sparse-checkout: tool/ci/web_hosting_freshness.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Preserve trusted freshness helper across producing-source checkout
        env:
          CONTROL_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$CONTROL_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C .hosting-control rev-parse HEAD)" = "$CONTROL_SHA"
          mkdir -p "$RUNNER_TEMP/web-hosting-control"
          cp .hosting-control/tool/ci/web_hosting_freshness.mjs \
            "$RUNNER_TEMP/web-hosting-control/web_hosting_freshness.mjs"

      - id: authorize
        name: Authorize one exact producing workflow attempt and artifact
        env:
          ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          GH_TOKEN: ${{ github.token }}
          IS_RECOVERY: ${{ inputs.recovery }}
          RECOVERY_REASON: ${{ inputs.recovery_reason }}
          SOURCE_CI_RUN_ATTEMPT: ${{ inputs.source_ci_run_attempt }}
          SOURCE_CI_RUN_ID: ${{ inputs.source_ci_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SURFACE: ${{ inputs.surface }}
        run: |
          set -euo pipefail
          [[ "$SURFACE" =~ ^(admin|host|marketing)$ ]]
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$SOURCE_CI_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_CI_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]

          if [[ "$IS_RECOVERY" == "true" ]]; then
            test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
            test "$GITHUB_REF" = "refs/heads/main"
            if (( GITHUB_RUN_ATTEMPT > 1 )); then
              echo "A recovery rerun can replay stale authorization. Start a fresh manual dispatch for the same exact artifact."
              exit 64
            fi
            if [[ -z "${RECOVERY_REASON//[[:space:]]/}" ]]; then
              echo "Bounded Web Hosting recovery requires a non-empty operator reason."
              exit 64
            fi
            test "$SOURCE_CI_RUN_ID" != "$GITHUB_RUN_ID"
          else
            test "$GITHUB_EVENT_NAME" = "push"
            test "$GITHUB_REF" = "refs/heads/main"
            test "$SOURCE_CI_RUN_ID" = "$GITHUB_RUN_ID"
            test "$SOURCE_CI_RUN_ATTEMPT" = "$GITHUB_RUN_ATTEMPT"
            test "$SOURCE_SHA" = "$GITHUB_SHA"
          fi

          authorization="$(node "$RUNNER_TEMP/web-hosting-control/web_hosting_freshness.mjs" authorize)"
          if jq -e '.superseded == true' <<< "$authorization" > /dev/null; then
            # A newer main push of this surface promotes newer bytes. Every
            # later step skips, so this run deploys nothing instead of failing.
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            jq -r '"::notice::Superseded by run \(.latestRunNumber) of this workflow on main; this run deploys nothing."' \
              <<< "$authorization"
            exit 0
          fi
          jq -r '"workflow_id=\(.workflowId)", "run_number=\(.runNumber)", "artifact_name=\(.artifactName)"' \
            <<< "$authorization" >> "$GITHUB_OUTPUT"

      - name: Checkout the exact producing source
        if: ${{ steps.authorize.outputs.superseded != 'true' }}
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Require the producing source to remain safely ordered on main
        if: ${{ steps.authorize.outputs.superseded != 'true' }}
        env:
          IS_RECOVERY: ${{ inputs.recovery }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch origin main:refs/remotes/origin/main --no-tags
          git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main
          if [[ "$IS_RECOVERY" == "true" ]]; then
            test "$(git rev-parse refs/remotes/origin/main)" = "$SOURCE_SHA"
          fi

      - id: toolchain
        if: ${{ steps.authorize.outputs.superseded != 'true' }}
        uses: ./.github/actions/load-toolchain

      - uses: actions/setup-node@v6
        if: ${{ steps.authorize.outputs.superseded != 'true' }}
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}

      - name: Download only the immutable artifact id and verify its GitHub digest
        if: ${{ steps.authorize.outputs.superseded != 'true' }}
        env:
          ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          GH_TOKEN: ${{ github.token }}
          SURFACE: ${{ inputs.surface }}
        run: |
          set -euo pipefail
          mkdir -p build/web-delivery/source
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            > build/web-delivery/source.zip
          test "sha256:$(sha256sum build/web-delivery/source.zip | awk '{print $1}')" = "$ARTIFACT_DIGEST"
          unzip -Z1 build/web-delivery/source.zip | \
            awk '/(^\/|(^|\/)\.\.($|\/))/ { exit 64 }'
          unzip -q build/web-delivery/source.zip -d build/web-delivery/source
          test "$(find build/web-delivery/source -type l | wc -l | tr -d ' ')" = "0"
          test -f "build/web-delivery/source/web-hosting-${SURFACE}.tar.gz"
          test -f build/web-delivery/source/web-hosting-provenance.json
          test "$(find build/web-delivery/source -type f | wc -l | tr -d ' ')" = "2"

      - name: Verify provenance and every packaged byte before credentials
        if: ${{ steps.authorize.outputs.superseded != 'true' }}
        env:
          SOURCE_CI_RUN_ATTEMPT: ${{ inputs.source_ci_run_attempt }}
          SOURCE_CI_RUN_ID: ${{ inputs.source_ci_run_id }}
          SOURCE_CI_RUN_NUMBER: ${{ steps.authorize.outputs.run_number }}
          SOURCE_CI_WORKFLOW_ID: ${{ steps.authorize.outputs.workflow_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SURFACE: ${{ inputs.surface }}
        run: |
          set -euo pipefail
          archive="build/web-delivery/source/web-hosting-${SURFACE}.tar.gz"
          provenance=build/web-delivery/source/web-hosting-provenance.json
          node tool/ci/delivery_core.mjs verify \
            --manifest "$provenance" \
            --artifact "$archive" \
            --source-sha "$SOURCE_SHA" \
            --ci-run-id "$SOURCE_CI_RUN_ID" \
            --ci-run-attempt "$SOURCE_CI_RUN_ATTEMPT"
          tar -tzf "$archive" | \
            awk '/(^\/|(^|\/)\.\.($|\/))/ { exit 64 }'
          tar -tvzf "$archive" | \
            awk 'substr($0, 1, 1) != "-" && substr($0, 1, 1) != "d" { exit 64 }'
          mkdir -p build/web-delivery/package
          tar -xzf "$archive" --no-same-owner --no-same-permissions \
            -C build/web-delivery/package
          test "$(find build/web-delivery/package -type l | wc -l | tr -d ' ')" = "0"
          node tool/ci/package_web_hosting.mjs verify \
            --surface "$SURFACE" \
            --package-dir build/web-delivery/package \
            --source-sha "$SOURCE_SHA" \
            --ci-workflow-id "$SOURCE_CI_WORKFLOW_ID" \
            --ci-run-number "$SOURCE_CI_RUN_NUMBER" \
            --ci-run-id "$SOURCE_CI_RUN_ID" \
            --ci-run-attempt "$SOURCE_CI_RUN_ATTEMPT" \
            --provenance-manifest "$provenance"

      - name: Verify production Admin callable dependencies
        if: ${{ inputs.surface == 'admin' && steps.authorize.outputs.superseded != 'true' }}
        run: node tool/web/check_admin_live_data_sources.mjs --check --verify-live --environment prod --summary

      - name: Install the pinned Firebase CLI before deployment credentials
        if: ${{ steps.authorize.outputs.superseded != 'true' }}
        run: npm install -g firebase-tools@${{ steps.toolchain.outputs.firebase-tools-version }}

      - name: Re-extract and reverify immutable bytes before deployment credentials
        if: ${{ steps.authorize.outputs.superseded != 'true' }}
        env:
          ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
          SOURCE_CI_RUN_ATTEMPT: ${{ inputs.source_ci_run_attempt }}
          SOURCE_CI_RUN_ID: ${{ inputs.source_ci_run_id }}
          SOURCE_CI_RUN_NUMBER: ${{ steps.authorize.outputs.run_number }}
          SOURCE_CI_WORKFLOW_ID: ${{ steps.authorize.outputs.workflow_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SURFACE: ${{ inputs.surface }}
        run: |
          set -euo pipefail
          test "sha256:$(sha256sum build/web-delivery/source.zip | awk '{print $1}')" = \
            "$ARTIFACT_DIGEST"
          rm -rf build/web-delivery/source build/web-delivery/package
          mkdir -p build/web-delivery/source build/web-delivery/package
          unzip -Z1 build/web-delivery/source.zip | \
            awk '/(^\/|(^|\/)\.\.($|\/))/ { exit 64 }'
          unzip -q build/web-delivery/source.zip -d build/web-delivery/source
          test "$(find build/web-delivery/source -type l | wc -l | tr -d ' ')" = "0"
          test -f "build/web-delivery/source/web-hosting-${SURFACE}.tar.gz"
          test -f build/web-delivery/source/web-hosting-provenance.json
          test "$(find build/web-delivery/source -type f | wc -l | tr -d ' ')" = "2"
          archive="build/web-delivery/source/web-hosting-${SURFACE}.tar.gz"
          provenance=build/web-delivery/source/web-hosting-provenance.json
          node tool/ci/delivery_core.mjs verify \
            --manifest "$provenance" \
            --artifact "$archive" \
            --source-sha "$SOURCE_SHA" \
            --ci-run-id "$SOURCE_CI_RUN_ID" \
            --ci-run-attempt "$SOURCE_CI_RUN_ATTEMPT"
          tar -tzf "$archive" | \
            awk '/(^\/|(^|\/)\.\.($|\/))/ { exit 64 }'
          tar -tvzf "$archive" | \
            awk 'substr($0, 1, 1) != "-" && substr($0, 1, 1) != "d" { exit 64 }'
          tar -xzf "$archive" --no-same-owner --no-same-permissions \
            -C build/web-delivery/package
          test "$(find build/web-delivery/package -type l | wc -l | tr -d ' ')" = "0"
          node tool/ci/package_web_hosting.mjs verify \
            --surface "$SURFACE" \
            --package-dir build/web-delivery/package \
            --source-sha "$SOURCE_SHA" \
            --ci-workflow-id "$SOURCE_CI_WORKFLOW_ID" \
            --ci-run-number "$SOURCE_CI_RUN_NUMBER" \
            --ci-run-id "$SOURCE_CI_RUN_ID" \
            --ci-run-attempt "$SOURCE_CI_RUN_ATTEMPT" \
            --provenance-manifest "$provenance"

      - uses: google-github-actions/setup-gcloud@v3
        if: ${{ inputs.surface == 'marketing' && steps.authorize.outputs.superseded != 'true' }}

      - name: Authenticate to Google Cloud only for final freshness and mutation
        if: ${{ steps.authorize.outputs.superseded != 'true' }}
        uses: google-github-actions/auth@v3
        with:
          create_credentials_file: true
          export_environment_variables: true
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Refuse to overtake a newer main push immediately before mutation
        id: freshness
        if: ${{ steps.authorize.outputs.superseded != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          IS_RECOVERY: ${{ inputs.recovery }}
          SOURCE_CI_RUN_ATTEMPT: ${{ inputs.source_ci_run_attempt }}
          SOURCE_CI_RUN_ID: ${{ inputs.source_ci_run_id }}
          SOURCE_CI_RUN_NUMBER: ${{ steps.authorize.outputs.run_number }}
          SOURCE_CI_WORKFLOW_ID: ${{ steps.authorize.outputs.workflow_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          read_freshness_evidence() {
            local cache_mode="$1"
            local cache_header=""
            if [[ "$cache_mode" == "no-cache" ]]; then
              cache_header="Cache-Control: no-cache"
            fi

            git fetch origin main:refs/remotes/origin/main --no-tags
            local current_main_sha
            current_main_sha="$(git rev-parse refs/remotes/origin/main)"
            local source_is_ancestor=false
            if git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main; then
              source_is_ancestor=true
            fi

            local current_source_run latest_surface_push
            local source_run_path latest_surface_push_path
            source_run_path="repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_CI_RUN_ID"
            latest_surface_push_path="repos/$GITHUB_REPOSITORY/actions/workflows/$SOURCE_CI_WORKFLOW_ID/runs?branch=main&event=push&per_page=1"
            if [[ -n "$cache_header" ]]; then
              current_source_run="$(gh api -H "$cache_header" "$source_run_path")"
              latest_surface_push="$(gh api -H "$cache_header" "$latest_surface_push_path")"
            else
              current_source_run="$(gh api "$source_run_path")"
              latest_surface_push="$(gh api "$latest_surface_push_path")"
            fi

            local source_run_summary latest_runs_summary
            source_run_summary="$(jq -c '{
              id,
              runAttempt: .run_attempt,
              headSha: .head_sha,
              event,
              branch: .head_branch
            }' <<< "$current_source_run")"
            latest_runs_summary="$(jq -c '
              (.workflow_runs // []) |
              if type == "array" then map({
                id,
                runNumber: .run_number,
                sha: .head_sha,
                branch: .head_branch,
                event
              }) else [] end
            ' <<< "$latest_surface_push")"
            local recovery=false
            if [[ "$IS_RECOVERY" == "true" ]]; then recovery=true; fi

            jq -cn \
              --arg source_sha "$SOURCE_SHA" \
              --arg run_id "$SOURCE_CI_RUN_ID" \
              --argjson run_attempt "$SOURCE_CI_RUN_ATTEMPT" \
              --arg workflow_id "$SOURCE_CI_WORKFLOW_ID" \
              --argjson run_number "$SOURCE_CI_RUN_NUMBER" \
              --argjson recovery "$recovery" \
              --arg main_sha "$current_main_sha" \
              --argjson source_is_ancestor "$source_is_ancestor" \
              --argjson source_run "$source_run_summary" \
              --argjson latest_runs "$latest_runs_summary" '
                {
                  expected: {
                    sourceSha: $source_sha,
                    runId: $run_id,
                    runAttempt: $run_attempt,
                    workflowId: $workflow_id,
                    runNumber: $run_number,
                    recovery: $recovery
                  },
                  actual: {
                    mainSha: $main_sha,
                    sourceIsAncestor: $source_is_ancestor,
                    sourceRun: $source_run,
                    latestRuns: $latest_runs
                  }
                }
              '
          }

          first_evaluation="$(read_freshness_evidence cached | \
            node "$RUNNER_TEMP/web-hosting-control/web_hosting_freshness.mjs" evaluate)"
          echo "Final source/freshness predicates (initial read): $first_evaluation"
          if ! jq -e '.passed == true' <<< "$first_evaluation" > /dev/null; then
            echo "::warning::Initial source/freshness read did not satisfy every predicate; taking one no-cache read."
            retry_evaluation="$(read_freshness_evidence no-cache | \
              node "$RUNNER_TEMP/web-hosting-control/web_hosting_freshness.mjs" evaluate)"
            echo "Final source/freshness predicates (single no-cache read): $retry_evaluation"
            if ! jq -e '.passed == true' <<< "$retry_evaluation" > /dev/null; then
              if jq -e '.superseded == true' <<< "$retry_evaluation" > /dev/null; then
                echo "::notice::A newer main push of this surface started before deployment; this run deploys nothing."
                echo "superseded=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "::error::Source/freshness gate remains unsatisfied after one no-cache read; refusing deployment."
              exit 1
            fi
          fi

      - id: legacy-runtime
        name: Retire static marketing promotion once Next owns live Hosting
        if: ${{ inputs.surface == 'marketing' && steps.authorize.outputs.superseded != 'true' && steps.freshness.outputs.superseded != 'true' }}
        run: node website/scripts/next/hostingState.mjs legacy-guard

      - name: Deploy only the verified production Hosting target without rebuilding
        if: ${{ steps.legacy-runtime.outputs.retired != 'true' && steps.authorize.outputs.superseded != 'true' && steps.freshness.outputs.superseded != 'true' }}
        working-directory: build/web-delivery/package
        env:
          SURFACE: ${{ inputs.surface }}
        run: >-
          "$GITHUB_WORKSPACE/tool/firebase_with_env.sh" prod deploy
          --config firebase.json
          --only "hosting:${SURFACE}"
          --non-interactive

      - name: Remove deploy credentials before postconditions
        if: ${{ steps.authorize.outputs.superseded != 'true' }}
        run: |
          set -euo pipefail
          credential_file="${GOOGLE_GHA_CREDS_PATH:-}"
          test -n "$credential_file"
          case "$credential_file" in
            "$GITHUB_WORKSPACE"/gha-creds-*.json) ;;
            *) echo "Unexpected Google credential path: $credential_file" >&2; exit 64 ;;
          esac
          rm -f -- "$credential_file"
          test ! -e "$credential_file"
          {
            echo "CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE="
            echo "GOOGLE_APPLICATION_CREDENTIALS="
            echo "GOOGLE_GHA_CREDS_PATH="
          } >> "$GITHUB_ENV"

      - name: Verify marketing production unknown paths return HTTP 404
        if: ${{ inputs.surface == 'marketing' && steps.legacy-runtime.outputs.retired != 'true' && steps.authorize.outputs.superseded != 'true' && steps.freshness.outputs.superseded != 'true' }}
        run: node website/scripts/verifyHosting404.mjs https://catchdates.com

      - name: Verify launch-critical marketing production routes
        if: ${{ inputs.surface == 'marketing' && steps.legacy-runtime.outputs.retired != 'true' && steps.authorize.outputs.superseded != 'true' && steps.freshness.outputs.superseded != 'true' }}
        run: node website/scripts/probeProduction.mjs --base-url https://catchdates.com --json

      - name: Verify the standalone Host web shell
        if: ${{ inputs.surface == 'host' && steps.authorize.outputs.superseded != 'true' && steps.freshness.outputs.superseded != 'true' }}
        run: curl --fail --location --silent --show-error https://catchdates-host.web.app/ > /dev/null
