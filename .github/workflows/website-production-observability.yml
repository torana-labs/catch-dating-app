name: Website Production Observability

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: website-production-observability
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    name: Probe launch-critical production routes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            website/scripts/next/liveOriginCheck.mjs
            packages/brand/brand.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # Cloudflare challenges GitHub-hosted runners on every public path
      # (#1272), so the probe reads the live release from the Firebase host,
      # checks that host still redirects pages, and checks the edge answers.
      - name: Check the live release, the Firebase redirect and the edge
        run: node website/scripts/next/liveOriginCheck.mjs
