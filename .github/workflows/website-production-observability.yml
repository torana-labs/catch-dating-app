name: Website Production Observability

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: website-production-observability
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    name: Probe launch-critical production routes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            website/scripts/probeProduction.mjs
            packages/brand/brand.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Check status, canonical metadata, and launch content
        run: |
          origin="$(node -p 'require("./packages/brand/brand.json").web.origin')"
          node website/scripts/probeProduction.mjs --base-url "$origin" --json
