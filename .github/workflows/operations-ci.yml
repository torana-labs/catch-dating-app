name: Operations CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  operations:
    name: Operations platform
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - id: toolchain
        uses: ./.github/actions/load-toolchain

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
          cache: npm
          cache-dependency-path: operations/package-lock.json

      - name: Install Operations dependencies
        run: npm --prefix operations ci

      - name: Run Operations contracts, tests, boundaries, and CLI smoke
        run: npm --prefix operations run check
