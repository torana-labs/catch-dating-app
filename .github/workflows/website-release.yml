name: Website Release

# The release train from main to catchdates.com. After main CI succeeds (and
# hourly, in case an event was missed), it previews main's head with the
# existing Next Website Preview workflow, passes the prod environment's gate
# (no required reviewer since 30 Oct 2026; add one to approve releases by
# hand again), then promotes that exact preview
# with Next Website Promotion. Both workflows keep every check of their own.
# When the website changed since live but main's head ran no website
# validation of its own, the train first runs full CI on that head.
# Trains queue rather than cancel, so an approval is never reset by a newer
# merge; the newest pending train waits behind it. Operator guide:
# docs/web_surface_architecture.md, "Release train".

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-release
  cancel-in-progress: false

jobs:
  plan:
    name: Decide whether main's head should be released
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event.workflow_run.event)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      deployments: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
      validate: ${{ steps.plan.outputs.validate }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
    steps:
      # Full history: the planner compares live with main's head.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: toolchain
        uses: ./.github/actions/load-toolchain
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: node website/scripts/next/releaseTrain.mjs plan

  validate:
    name: Validate main's head with full CI
    needs: plan
    if: ${{ needs.plan.outputs.validate == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      actions: write
      contents: read
    outputs:
      current: ${{ steps.validate.outputs.current }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: toolchain
        uses: ./.github/actions/load-toolchain
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
      - id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        run: node website/scripts/next/releaseTrain.mjs validate

  preview:
    name: Preview main's head
    needs: [plan, validate]
    # A failed validation stops the train; one main moved past hands over to
    # the next train.
    if: ${{ !cancelled() && needs.plan.outputs.release == 'true' && (needs.validate.result == 'skipped' || (needs.validate.result == 'success' && needs.validate.outputs.current == 'true')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      actions: write
      contents: read
    outputs:
      preview_run_id: ${{ steps.preview.outputs.preview_run_id }}
      preview_url: ${{ steps.preview.outputs.preview_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: toolchain
        uses: ./.github/actions/load-toolchain
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
      - id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        run: node website/scripts/next/releaseTrain.mjs preview

  approve:
    name: Approve the preview for catchdates.com
    needs: [plan, preview]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # The prod environment is the release gate: a required reviewer on it
    # makes this job wait for approval. It has none since 30 Oct 2026. The
    # job holds no token and uses none of the environment's credentials.
    environment:
      name: prod
      url: ${{ needs.preview.outputs.preview_url }}
    permissions: {}
    steps:
      - env:
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          PREVIEW_URL: ${{ needs.preview.outputs.preview_url }}
        run: echo "Approved $SOURCE_SHA for production after review of $PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"

  promote:
    name: Promote the approved preview
    needs: [plan, preview, approve]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: toolchain
        uses: ./.github/actions/load-toolchain
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
      - env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          PREVIEW_RUN_ID: ${{ needs.preview.outputs.preview_run_id }}
        run: node website/scripts/next/releaseTrain.mjs promote
