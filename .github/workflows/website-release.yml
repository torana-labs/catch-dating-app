name: Website Release

# The release train from main to the production website. After main CI
# completes (and hourly, in case an event was missed), it previews the newest
# commit of main newer than live whose own CI passed with website validation,
# by commit, with the existing Next Website Preview workflow. That is often not
# main's head: on a busy day the head's CI has rarely finished (owner
# decision, 12 Nov 2026). It passes the prod environment's gate
# (no required reviewer since 30 Oct 2026; add one to approve releases by
# hand again), then promotes that exact preview
# with Next Website Promotion. Both workflows keep every check of their own.
# When no such commit exists but the website changed since live, the train
# first runs CI on main's head, planned over every commit since live.
# Trains queue rather than cancel, so an approval is never reset by a newer
# merge; the newest pending train waits behind it. Operator guide:
# docs/web_surface_architecture.md, "Release train".

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-release
  cancel-in-progress: false

jobs:
  plan:
    name: Decide which validated commit of main to release
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event.workflow_run.event)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      deployments: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
      validate: ${{ steps.plan.outputs.validate }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      live_sha: ${{ steps.plan.outputs.live_sha }}
    steps:
      # Full history: Nx compares live with main's head.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: toolchain
        uses: ./.github/actions/load-toolchain
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: node website/scripts/next/releaseTrain.mjs plan

  validate:
    name: Validate main's head with CI planned from live
    needs: plan
    if: ${{ needs.plan.outputs.validate == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - id: toolchain
        uses: ./.github/actions/load-toolchain
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
      - id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          LIVE_SHA: ${{ needs.plan.outputs.live_sha }}
        run: node website/scripts/next/releaseTrain.mjs validate

  preview:
    name: Preview the planned commit
    needs: [plan, validate]
    # A failed validation stops the train. One main moved past still
    # releases: the preview builds the validated commit, not main's head.
    if: ${{ !cancelled() && needs.plan.outputs.release == 'true' && (needs.validate.result == 'skipped' || needs.validate.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      actions: write
      contents: read
    outputs:
      preview_run_id: ${{ steps.preview.outputs.preview_run_id }}
      preview_url: ${{ steps.preview.outputs.preview_url }}
      deferred: ${{ steps.preview.outputs.deferred }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - id: toolchain
        uses: ./.github/actions/load-toolchain
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
      - id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        run: node website/scripts/next/releaseTrain.mjs preview

  approve:
    name: Approve the preview for production
    needs: [plan, preview]
    # Without its own condition a job inherits success() over every ancestor,
    # so the skipped validate job (the usual case) skipped the gate and the
    # promotion, and the train passed having released nothing (run 41092948800).
    if: ${{ !cancelled() && needs.preview.result == 'success' && needs.preview.outputs.deferred != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # The prod environment is the release gate: a required reviewer on it
    # makes this job wait for approval. It has none since 30 Oct 2026. The
    # job holds no token and uses none of the environment's credentials.
    environment:
      name: prod
      url: ${{ needs.preview.outputs.preview_url }}
    permissions: {}
    steps:
      - env:
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          PREVIEW_URL: ${{ needs.preview.outputs.preview_url }}
        run: echo "Approved $SOURCE_SHA for production after review of $PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"

  promote:
    name: Promote the approved preview
    needs: [plan, preview, approve]
    if: ${{ !cancelled() && needs.preview.result == 'success' && needs.approve.result == 'success' && needs.preview.outputs.deferred != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - id: toolchain
        uses: ./.github/actions/load-toolchain
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
      - env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          PREVIEW_RUN_ID: ${{ needs.preview.outputs.preview_run_id }}
        run: node website/scripts/next/releaseTrain.mjs promote
