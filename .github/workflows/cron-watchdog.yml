name: Scheduled run watchdog

# Notices a scheduled workflow that never started (owner decision, 22 Nov
# 2026: "dev runs automatically, prod asks first"). Each hour it checks the
# latest daily run of Firestore Data Validation (20:13 UTC), Deploy backend
# (21:13 UTC) and the nightly CI (02:23 UTC) whose grace period has passed. A
# missing dev-only run (the nightly CI, Deploy backend for dev) is dispatched
# once. A run that uses prod (Data Validation, Deploy backend for prod) is
# never dispatched: the "Scheduled run missed" issue gets the missing run and
# the command for the owner. A nightly that never started is reported as
# unknown, not green, on the "Main CI is red" issue. Each missed run is
# handled at most once, recorded in its issue. It also runs after each CI run
# on main completes, because the hourly schedule stalls with the scheduler it
# watches (no slot started from 01:47 to 04:47 UTC on 23 Nov 2026); the records
# and the concurrency group keep the extra runs from acting twice. An
# occurrence from before a workflow reached main is not owed.
# Logic and tests: tool/ci/cron_watchdog.mjs. Operator guide:
# docs/release_operations.md, "Scheduled run watchdog".

on:
  schedule:
    # Hourly at :47, off the :00/:30 minutes GitHub delays most.
    - cron: "47 * * * *"
  # Main pushes are not scheduler-dependent, so they wake the watchdog too.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print what would happen; dispatch and post nothing.
        type: boolean
        default: true
      grace_hours:
        description: Hours after its cron before a run counts as missing (1-23).
        type: string
        default: "3"
      now:
        description: Evaluate as of this ISO time (dry runs; empty means now).
        type: string
        default: ""
      assume_missing:
        description: Treat this target's runs as absent (dry runs only).
        type: choice
        options: [none, data-validation, deploy-backend, nightly-ci]
        default: none

permissions: {}

concurrency:
  group: cron-watchdog
  cancel-in-progress: false

jobs:
  watch:
    name: Check scheduled runs started
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # Read the checkout, read and dispatch workflow runs, comment on issues.
      contents: read
      actions: write
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            tool/ci
            .github/actions/load-toolchain
      - id: toolchain
        uses: ./.github/actions/load-toolchain
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
      - name: Dispatch or report missed scheduled runs
        env:
          GH_TOKEN: ${{ github.token }}
          WATCHDOG_GRACE_HOURS: ${{ github.event_name == 'workflow_dispatch' && inputs.grace_hours || '3' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          EVALUATE_AT: ${{ github.event_name == 'workflow_dispatch' && inputs.now || '' }}
          ASSUME_MISSING: ${{ github.event_name == 'workflow_dispatch' && inputs.assume_missing || 'none' }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          if [[ -n "$EVALUATE_AT" ]]; then args+=(--now "$EVALUATE_AT"); fi
          if [[ "$ASSUME_MISSING" != "none" ]]; then args+=(--assume-missing "$ASSUME_MISSING"); fi
          node tool/ci/cron_watchdog.mjs "${args[@]}"
