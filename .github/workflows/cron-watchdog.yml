name: Scheduled run watchdog

# Notices a scheduled workflow that never started (owner decision, 22 Nov
# 2026: "dev runs automatically, prod asks first"). Each hour it checks the
# latest daily run of Firestore Data Validation (20:13 UTC), Deploy backend
# (21:13 UTC) and the nightly CI (02:23 UTC) whose grace period has passed. A
# missing dev-only run (the nightly CI, Deploy backend for dev) is dispatched
# once. A run that uses prod (Data Validation, Deploy backend for prod) is
# never dispatched: the "Scheduled run missed" issue gets the missing run and
# the command for the owner. A nightly that never started is reported as
# unknown, not green, on the "Main CI is red" issue. Each missed run is
# handled at most once, recorded in its issue. It also runs after each CI run
# on main completes, because the hourly schedule stalls with the scheduler it
# watches (no slot started from 01:47 to 04:47 UTC on 23 Nov 2026); the records
# and the concurrency group keep the extra runs from acting twice. An
# occurrence from before a workflow reached main is not owed.
# It also follows up each completed CI nightly that no Main CI alert run has
# handled, by dispatching main-red-alert.yml with that run's run_id: GITHUB_TOKEN
# dispatched the nightly, so its completion wakes no workflow (owner decision,
# 26 Nov 2026). That is the only other workflow it may dispatch. Each such
# dispatch uploads a marker artifact, so a wake before the runs listing shows
# the alert run does not dispatch it twice.
# Logic and tests: tool/ci/cron_watchdog.mjs. Operator guide:
# docs/release_operations.md, "Scheduled run watchdog".

on:
  schedule:
    # Hourly at :47, off the :00/:30 minutes GitHub delays most.
    - cron: "47 * * * *"
  # Main pushes are not scheduler-dependent, so they wake the watchdog too.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print what would happen; dispatch and post nothing.
        type: boolean
        default: true
      grace_hours:
        description: Hours after its cron before a run counts as missing (1-23).
        type: string
        default: "3"
      now:
        description: Evaluate as of this ISO time (dry runs; empty means now).
        type: string
        default: ""
      assume_missing:
        description: Treat this target's runs as absent (dry runs only).
        type: choice
        options: [none, data-validation, deploy-backend, nightly-ci]
        default: none

permissions: {}

concurrency:
  group: cron-watchdog
  cancel-in-progress: false

jobs:
  watch:
    name: Check scheduled runs started
    # A workflow_run wake counts only for main's own push or nightly CI runs,
    # never a pull-request run (a fork's branch can also be called main).
    if: >-
      github.event_name != 'workflow_run' || (
      contains(fromJSON('["push", "schedule"]'), github.event.workflow_run.event) &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # Read the checkout, read and dispatch workflow runs, comment on issues.
      contents: read
      actions: write
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          # cron_watchdog.mjs imports main_red_alert.mjs, which imports
          # tool/lib/github_issues.mjs through golden_policy.mjs.
          sparse-checkout: |
            tool/ci
            tool/lib
            .github/actions/load-toolchain
      - id: toolchain
        uses: ./.github/actions/load-toolchain
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
      - id: watch
        name: Dispatch or report missed scheduled runs
        env:
          GH_TOKEN: ${{ github.token }}
          WATCHDOG_GRACE_HOURS: ${{ github.event_name == 'workflow_dispatch' && inputs.grace_hours || '3' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          EVALUATE_AT: ${{ github.event_name == 'workflow_dispatch' && inputs.now || '' }}
          ASSUME_MISSING: ${{ github.event_name == 'workflow_dispatch' && inputs.assume_missing || 'none' }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          if [[ -n "$EVALUATE_AT" ]]; then args+=(--now "$EVALUATE_AT"); fi
          if [[ "$ASSUME_MISSING" != "none" ]]; then args+=(--assume-missing "$ASSUME_MISSING"); fi
          node tool/ci/cron_watchdog.mjs "${args[@]}"

      # The runs listing lags a dispatch, so the watchdog's next wake could miss
      # the alert run it just started. This marker stands in for it for 2 hours.
      - name: Record the Main CI alert dispatch
        if: steps.watch.outputs.alert_marker != ''
        env:
          MARKER: ${{ steps.watch.outputs.alert_marker }}
        run: |
          mkdir -p "$RUNNER_TEMP/alert-marker"
          echo "Dispatched main-red-alert.yml at $(date -u +%FT%TZ) from run $GITHUB_RUN_ID." > "$RUNNER_TEMP/alert-marker/$MARKER.txt"

      - name: Upload the Main CI alert dispatch marker
        if: steps.watch.outputs.alert_marker != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.watch.outputs.alert_marker }}
          path: ${{ runner.temp }}/alert-marker/
          if-no-files-found: error
          retention-days: 3
