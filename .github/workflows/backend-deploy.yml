name: Deploy backend

# The one path from main to the Firebase backend (indexes, Functions, Firestore
# and Storage rules). In sprint mode nothing deploys on merge: the owner's rule
# is one full backend deploy a week, so the window run (dispatch, full) ships
# everything merged since the last one, dev first, then prod automatically
# once dev succeeds (the prod environment has no required reviewer since
# 30 Oct 2026). Each deploy
# rebuilds only the Functions codebases whose code, parameters or secrets
# changed; the Firebase CLI skips the rest. A run that would update more than
# 200 Functions stops before changing anything until one is run with
# allow_large. Run it manually for prod, dev or
# staging, optionally as a full deploy or for named Functions only. Operator guide: docs/release_operations.md, "Deploy backend".

on:
  # Sprint mode (8 Nov 2026): a merge to main no longer deploys. The backend
  # ships in the one weekly window run (dispatch with full=true on the
  # window day; #1552 schedules it). Restore the push trigger with CI.
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [prod, dev, staging]
        default: prod
      full:
        description: Redeploy every Function, including unchanged ones
        type: boolean
        default: false
      functions:
        description: >-
          Only these Functions, comma-separated (a configuration change such as a
          feature switch). Nothing else deploys and the deployed commit stays.
        type: string
        default: ''
      allow_large:
        description: >-
          Deploy even when more than 200 Functions would change (a shared module
          or dependency change); a merge's own run stops before changing anything.
        type: boolean
        default: false

permissions:
  contents: write
  deployments: write
  id-token: write

jobs:
  dev:
    if: ${{ github.event_name == 'push' || inputs.environment == 'dev' }}
    uses: ./.github/workflows/_backend-deploy.yml
    with:
      environment: dev
      full: ${{ inputs.full == true }}
      functions: ${{ inputs.functions || '' }}
      allow_large: ${{ inputs.allow_large == true }}

  prod:
    needs: dev
    if: >-
      ${{ !cancelled() && (
        github.event_name == 'push' && needs.dev.result == 'success' ||
        github.event_name == 'workflow_dispatch' && inputs.environment == 'prod') }}
    uses: ./.github/workflows/_backend-deploy.yml
    with:
      environment: prod
      full: ${{ inputs.full == true }}
      functions: ${{ inputs.functions || '' }}
      allow_large: ${{ inputs.allow_large == true }}

  staging:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && inputs.environment == 'staging' }}
    uses: ./.github/workflows/_backend-deploy.yml
    with:
      environment: staging
      full: ${{ inputs.full == true }}
      functions: ${{ inputs.functions || '' }}
      allow_large: ${{ inputs.allow_large == true }}
