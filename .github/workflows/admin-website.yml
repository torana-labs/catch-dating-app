name: Admin Website

on:
  push:
    branches: [main]
    paths:
      - ".github/actions/**"
      - ".github/workflows/_web-hosting-build.yml"
      - ".github/workflows/_web-hosting-promote.yml"
      - ".github/workflows/admin-website.yml"
      - ".github/workflows/react-surface-validation.yml"
      - ".firebaserc"
      - "admin/**"
      - "contracts/callables/**"
      - "contracts/callable_responses/**"
      - "contracts/admin/admin_live_data_sources.json"
      - "contracts/shared/**"
      - "design/admin/**"
      - "design/components/**"
      - "design/website/**"
      - "firebase.json"
      - "package.json"
      - "package-lock.json"
      - "packages/web-config/**"
      - "packages/web-ui/**"
      - "tool/ci/toolchain.env"
      - "tool/ci/delivery_core.mjs"
      - "tool/ci/package_web_hosting.mjs"
      - "tool/env/check_web_hosting_env.mjs"
      - "tool/firebase/check_client_callable_dependencies.mjs"
      - "tool/lib/firebase_project.mjs"
      - "tool/firebase_with_env.sh"
      - "tool/design/check_component_lexicon.mjs"
      - "tool/web/check_shared_web_ui_adoption.mjs"
      - "tool/web/lib/**"
      - "tool/web/check_storybook_visuals.mjs"
      - "tool/web/check_react_controller_test_targets.mjs"
      - "tool/web/check_admin_live_data_sources.mjs"
      - "tool/web/react_controller_test_targets.json"
      - "tool/web/react_dependency_graph.mjs"
      - "tool/organizer_intake/**"
  workflow_dispatch:
    inputs:
      update_visual_baselines:
        description: Capture Ubuntu visual baselines and upload them for review
        required: false
        type: boolean
        default: false
      recovery_artifact_digest:
        description: Exact sha256 digest from a failed source run's Web Hosting artifact
        required: false
        type: string
      recovery_artifact_id:
        description: Exact artifact id from a failed source run (leave empty for validation-only dispatch)
        required: false
        type: string
      recovery_reason:
        description: Operator reason required for exact-artifact recovery
        required: false
        type: string
      recovery_source_run_attempt:
        description: Producing failed workflow run attempt
        required: false
        type: string
      recovery_source_run_id:
        description: Producing failed workflow run id
        required: false
        type: string
      recovery_source_sha:
        description: Exact 40-character source SHA from the failed run
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  validate:
    name: Validate admin website
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.recovery_artifact_id == '' }}
    uses: ./.github/workflows/react-surface-validation.yml
    with:
      surface: admin
      update_visual_baselines: ${{ github.event_name == 'workflow_dispatch' && inputs.update_visual_baselines }}
      skip_deployable_build: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  package:
    name: Package exact admin Hosting bytes
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_web-hosting-build.yml
    with:
      surface: admin
    secrets: inherit
    permissions:
      actions: read
      contents: read
      id-token: write

  promote:
    name: Promote exact admin Hosting bytes
    needs: package
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.package.result == 'success' }}
    uses: ./.github/workflows/_web-hosting-promote.yml
    with:
      artifact_digest: ${{ needs.package.outputs.artifact_digest }}
      artifact_id: ${{ needs.package.outputs.artifact_id }}
      source_ci_run_attempt: ${{ needs.package.outputs.source_ci_run_attempt }}
      source_ci_run_id: ${{ needs.package.outputs.source_ci_run_id }}
      source_sha: ${{ needs.package.outputs.source_sha }}
      surface: admin
    secrets: inherit
    permissions:
      actions: read
      contents: read
      id-token: write

  recover:
    name: Recover exact admin Hosting bytes
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.recovery_artifact_id != '' }}
    uses: ./.github/workflows/_web-hosting-promote.yml
    with:
      artifact_digest: ${{ inputs.recovery_artifact_digest }}
      artifact_id: ${{ inputs.recovery_artifact_id }}
      recovery: true
      recovery_reason: ${{ inputs.recovery_reason }}
      source_ci_run_attempt: ${{ inputs.recovery_source_run_attempt }}
      source_ci_run_id: ${{ inputs.recovery_source_run_id }}
      source_sha: ${{ inputs.recovery_source_sha }}
      surface: admin
    secrets: inherit
    permissions:
      actions: read
      contents: read
      id-token: write
