name: Admin Website

# CI is switched off for the redesign sprint (owner, 8 Nov 2026): nothing runs on
# pull requests or pushes; the full run happens once a night on main.
on:
  schedule:
    - cron: '10 22 * * *' # once a night, main
  workflow_dispatch:
    inputs:
      update_visual_baselines:
        description: Capture Ubuntu visual baselines and upload them for review
        required: false
        type: boolean
        default: false
      recovery_artifact_digest:
        description: Exact sha256 digest from a failed source run's Web Hosting artifact
        required: false
        type: string
      recovery_artifact_id:
        description: Exact artifact id from a failed source run (leave empty for validation-only dispatch)
        required: false
        type: string
      recovery_reason:
        description: Operator reason required for exact-artifact recovery
        required: false
        type: string
      recovery_source_run_attempt:
        description: Producing failed workflow run attempt
        required: false
        type: string
      recovery_source_run_id:
        description: Producing failed workflow run id
        required: false
        type: string
      recovery_source_sha:
        description: Exact 40-character source SHA from the failed run
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  queue-validation:
    name: Find merge queue validation
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      validated: ${{ steps.queue.outputs.validated }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - id: queue
        uses: ./.github/actions/find-queue-validation
        with:
          jobs: |
            admin / Validate admin website

  validate:
    name: Validate admin website
    needs: queue-validation
    if: >-
      ${{ !cancelled() && needs.queue-validation.outputs.validated != 'true' &&
          (github.event_name != 'workflow_dispatch' || inputs.recovery_artifact_id == '') }}
    uses: ./.github/workflows/react-surface-validation.yml
    with:
      surface: admin
      update_visual_baselines: ${{ github.event_name == 'workflow_dispatch' && inputs.update_visual_baselines }}
      skip_deployable_build: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  package:
    name: Package exact admin Hosting bytes
    needs: [queue-validation, validate]
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          (needs.validate.result == 'success' ||
           (needs.validate.result == 'skipped' && needs.queue-validation.outputs.validated == 'true')) }}
    uses: ./.github/workflows/_web-hosting-build.yml
    with:
      surface: admin
    permissions:
      actions: read
      contents: read
      id-token: write

  promote:
    name: Promote exact admin Hosting bytes
    needs: package
    # Validation reuse intentionally skips an ancestor; override implicit success().
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.package.result == 'success' }}
    uses: ./.github/workflows/_web-hosting-promote.yml
    with:
      artifact_digest: ${{ needs.package.outputs.artifact_digest }}
      artifact_id: ${{ needs.package.outputs.artifact_id }}
      source_ci_run_attempt: ${{ needs.package.outputs.source_ci_run_attempt }}
      source_ci_run_id: ${{ needs.package.outputs.source_ci_run_id }}
      source_sha: ${{ needs.package.outputs.source_sha }}
      surface: admin
    permissions:
      actions: read
      contents: read
      id-token: write

  recover:
    name: Recover exact admin Hosting bytes
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.recovery_artifact_id != '' }}
    uses: ./.github/workflows/_web-hosting-promote.yml
    with:
      artifact_digest: ${{ inputs.recovery_artifact_digest }}
      artifact_id: ${{ inputs.recovery_artifact_id }}
      recovery: true
      recovery_reason: ${{ inputs.recovery_reason }}
      source_ci_run_attempt: ${{ inputs.recovery_source_run_attempt }}
      source_ci_run_id: ${{ inputs.recovery_source_run_id }}
      source_sha: ${{ inputs.recovery_source_sha }}
      surface: admin
    permissions:
      actions: read
      contents: read
      id-token: write
