name: CI metrics

# Posts one comment a week to the "Weekly CI metrics" issue: main CI's time to
# a Required CI answer, job minutes per run (Linux and macOS), merge-queue
# runs per merged pull request, main pushes that reused the queue's result,
# peak concurrency, failure rates and flaky jobs, each compared with last
# week (owner decision, 15 Nov 2026). Report-only: it reads Actions and
# writes issues, nothing else. Logic and tests: tool/ci/ci_metrics.mjs.
# Operator guide: docs/release_operations.md, "Weekly CI metrics".

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-metrics
  cancel-in-progress: false

jobs:
  report:
    name: Post the weekly CI metrics
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            tool/ci
            .github/actions/load-toolchain
      - id: toolchain
        uses: ./.github/actions/load-toolchain
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
      - name: Measure the last seven days and post the report
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tool/ci/ci_metrics.mjs --days 7
