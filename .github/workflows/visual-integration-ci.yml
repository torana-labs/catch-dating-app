name: Flutter Visual & Integration CI

on:
  workflow_call:
  workflow_dispatch:

jobs:
  headless-journeys:
    name: Headless app journeys
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get
      - name: Deterministic app-shell integration suites
        run: bash tool/test_app_shell_integration.sh

  goldens:
    name: macOS goldens & Widgetbook determinism
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6

      - id: toolchain
        uses: ./.github/actions/load-toolchain

      - uses: ./.github/actions/setup-flutter

      - run: flutter config --enable-macos-desktop

      - run: flutter pub get

      - name: Generate matching Flutter source outputs
        id: provider-codegen
        run: |
          dart run build_runner build \
            --build-filter=lib/hosts/presentation/event_management/create/create_event_controller.g.dart \
            --build-filter=lib/hosts/presentation/event_management/create/create_event_photo_recovery_controller.g.dart \
            --build-filter=lib/contexts/live/data/event_assignment_feature_choice_repository.g.dart \
            --build-filter=lib/contexts/events/domain/event_draft.freezed.dart \
            --build-filter=lib/contexts/events/domain/event_draft.g.dart \
            --build-filter=lib/contexts/organizers/domain/club_host_defaults.freezed.dart \
            --build-filter=lib/contexts/organizers/domain/club_host_defaults.g.dart \
            --build-filter=lib/hosts/presentation/forms/host_forms_controller.g.dart \
            --build-filter=lib/hosts/presentation/forms/host_form_operations_controller.g.dart \
            --build-filter=lib/contexts/audience/data/crm/host_saved_audience_repository.g.dart \
            --build-filter=lib/hosts/today/presentation/host_today_feed_controller.g.dart \
            --build-filter=lib/onboarding/presentation/onboarding_controller.g.dart \
            --build-filter=lib/dashboard/presentation/dashboard_full_view_model.g.dart \
            --build-filter=lib/contexts/payments/data/payment_repository.g.dart \
            --build-filter=lib/events/presentation/event_booking_controller.g.dart
          # A clean filtered build deletes tracked outputs outside its filter.
          # Restore those unchanged outputs before downstream package analysis.
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          targets = {
              'lib/hosts/presentation/event_management/create/create_event_controller.g.dart',
              'lib/hosts/presentation/event_management/create/create_event_photo_recovery_controller.g.dart',
              'lib/contexts/live/data/event_assignment_feature_choice_repository.g.dart',
              'lib/contexts/events/domain/event_draft.freezed.dart',
              'lib/contexts/events/domain/event_draft.g.dart',
              'lib/contexts/organizers/domain/club_host_defaults.freezed.dart',
              'lib/contexts/organizers/domain/club_host_defaults.g.dart',
              'lib/hosts/presentation/forms/host_forms_controller.g.dart',
              'lib/hosts/presentation/forms/host_form_operations_controller.g.dart',
              'lib/contexts/audience/data/crm/host_saved_audience_repository.g.dart',
              'lib/hosts/today/presentation/host_today_feed_controller.g.dart',
              'lib/onboarding/presentation/onboarding_controller.g.dart',
              'lib/dashboard/presentation/dashboard_full_view_model.g.dart',
              'lib/contexts/payments/data/payment_repository.g.dart',
              'lib/events/presentation/event_booking_controller.g.dart',
          }
          for target in targets:
              if not Path(target).is_file():
                  raise SystemExit(f'Flutter generation did not emit {target}; refusing restoration')
          deleted = subprocess.check_output([
              'git', 'diff', '--name-only', '--diff-filter=D', '-z', '--',
              '*.g.dart', '*.freezed.dart',
          ]).decode().split('\0')
          deleted = [path for path in deleted if path and path not in targets]
          if deleted:
              subprocess.run(['git', 'restore', '--worktree', '--', *deleted], check=True)
          print(f'Restored {len(deleted)} unchanged generated files outside the target filter')
          PY

      - name: Resolve Widgetbook dependencies
        run: (cd widgetbook && flutter pub get)

      - name: Generate Widgetbook directories
        id: widgetbook-codegen
        run: (cd widgetbook && dart run build_runner build)

      - name: Package generated Flutter outputs
        id: package-codegen
        if: ${{ always() && (steps.provider-codegen.outcome == 'success' || steps.widgetbook-codegen.outcome == 'success') }}
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          PROVIDER_CODEGEN: ${{ steps.provider-codegen.outcome }}
          WIDGETBOOK_CODEGEN: ${{ steps.widgetbook-codegen.outcome }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import shutil
          import subprocess

          source_sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if source_sha != os.environ['SOURCE_SHA']:
              raise SystemExit('Checkout does not match the workflow source SHA')
          output = pathlib.Path('build/ci/generated-flutter-codegen')
          output.mkdir(parents=True, exist_ok=True)
          generated = []
          if os.environ['PROVIDER_CODEGEN'] == 'success':
              generated.extend([
                  pathlib.Path('lib/hosts/presentation/event_management/create/create_event_controller.g.dart'),
                  pathlib.Path('lib/hosts/presentation/event_management/create/create_event_photo_recovery_controller.g.dart'),
                  pathlib.Path('lib/contexts/live/data/event_assignment_feature_choice_repository.g.dart'),
                  pathlib.Path('lib/contexts/events/domain/event_draft.freezed.dart'),
                  pathlib.Path('lib/contexts/events/domain/event_draft.g.dart'),
                  pathlib.Path('lib/contexts/organizers/domain/club_host_defaults.freezed.dart'),
                  pathlib.Path('lib/contexts/organizers/domain/club_host_defaults.g.dart'),
                  pathlib.Path('lib/hosts/presentation/forms/host_forms_controller.g.dart'),
                  pathlib.Path('lib/hosts/presentation/forms/host_form_operations_controller.g.dart'),
                  pathlib.Path('lib/contexts/audience/data/crm/host_saved_audience_repository.g.dart'),
                  pathlib.Path('lib/hosts/today/presentation/host_today_feed_controller.g.dart'),
                  pathlib.Path('lib/onboarding/presentation/onboarding_controller.g.dart'),
                  pathlib.Path('lib/dashboard/presentation/dashboard_full_view_model.g.dart'),
                  pathlib.Path('lib/contexts/payments/data/payment_repository.g.dart'),
                  pathlib.Path('lib/events/presentation/event_booking_controller.g.dart'),
              ])
          if os.environ['WIDGETBOOK_CODEGEN'] == 'success':
              generated.append(pathlib.Path('widgetbook/lib/main.directories.g.dart'))
          sources = [pathlib.Path('lib/hosts/presentation/event_management/create/create_event_controller.dart'),
                     pathlib.Path('lib/hosts/presentation/event_management/create/create_event_photo_recovery_controller.dart'),
                     pathlib.Path('widgetbook/pubspec.yaml'), pathlib.Path('widgetbook/pubspec.lock'),
                     pathlib.Path('pubspec.yaml'), pathlib.Path('pubspec.lock'),
                     pathlib.Path('lib/contexts/live/data/event_assignment_feature_choice_repository.dart'),
                     pathlib.Path('lib/contexts/events/domain/event_draft.dart'),
                     pathlib.Path('lib/contexts/organizers/domain/club_host_defaults.dart'),
                     pathlib.Path('lib/hosts/presentation/forms/host_forms_controller.dart'),
                     pathlib.Path('lib/hosts/presentation/forms/host_form_operations_controller.dart'),
                     pathlib.Path('lib/contexts/audience/data/crm/host_saved_audience_repository.dart'),
                     pathlib.Path('lib/hosts/today/presentation/host_today_feed_controller.dart'),
                     pathlib.Path('lib/hosts/presentation/forms/host_form_target_controller.dart'),
                     pathlib.Path('lib/onboarding/presentation/onboarding_controller.dart'),
                     pathlib.Path('lib/dashboard/presentation/dashboard_full_view_model.dart'),
                     pathlib.Path('lib/contexts/payments/data/payment_repository.dart'),
                     pathlib.Path('lib/events/presentation/event_booking_controller.dart')]
          sources += sorted(path for path in pathlib.Path('widgetbook/lib').rglob('*.dart')
                            if not path.name.endswith('.g.dart'))
          digest = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
          for path in generated:
              shutil.copy2(path, output / path.name)
          manifest = {
              'sourceSha': source_sha,
              'runId': os.environ['RUN_ID'],
              'runAttempt': os.environ['RUN_ATTEMPT'],
              'sourceHashes': {str(path): digest(path) for path in sources},
              'generatedHashes': {str(path): digest(path) for path in generated},
              'generationOutcomes': {'provider': os.environ['PROVIDER_CODEGEN'],
                                     'widgetbook': os.environ['WIDGETBOOK_CODEGEN']},
              'kind': 'generated matching Flutter source and Widgetbook directory; source artifacts, not visual proof',
          }
          (output / 'manifest.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          PY

      - name: Upload generated Flutter outputs
        if: ${{ always() && steps.package-codegen.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: generated-flutter-codegen-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: build/ci/generated-flutter-codegen/
          if-no-files-found: error
          retention-days: 7

      - name: Verify committed Flutter outputs are current
        run: |
          git ls-files --error-unmatch -- lib/hosts/presentation/event_management/create/create_event_controller.g.dart lib/hosts/presentation/event_management/create/create_event_photo_recovery_controller.g.dart > /dev/null
          git diff --exit-code -- lib/hosts/presentation/event_management/create/create_event_controller.g.dart lib/hosts/presentation/event_management/create/create_event_photo_recovery_controller.g.dart
          git diff --exit-code -- widgetbook/lib/main.directories.g.dart lib/contexts/live/data/event_assignment_feature_choice_repository.g.dart lib/contexts/events/domain/event_draft.freezed.dart lib/contexts/events/domain/event_draft.g.dart lib/contexts/organizers/domain/club_host_defaults.freezed.dart lib/contexts/organizers/domain/club_host_defaults.g.dart lib/hosts/presentation/forms/host_forms_controller.g.dart lib/onboarding/presentation/onboarding_controller.g.dart lib/dashboard/presentation/dashboard_full_view_model.g.dart
          git ls-files --error-unmatch -- lib/contexts/live/data/event_assignment_feature_choice_repository.g.dart > /dev/null
          git diff --exit-code -- lib/hosts/presentation/forms/host_form_operations_controller.g.dart
          git diff --exit-code -- lib/contexts/payments/data/payment_repository.g.dart lib/events/presentation/event_booking_controller.g.dart
          git diff --exit-code -- lib/contexts/audience/data/crm/host_saved_audience_repository.g.dart lib/hosts/today/presentation/host_today_feed_controller.g.dart

      - name: Widgetbook corpus contract gates
        run: >-
          node tool/run.mjs check
          design:widgetbook-use-case-triage
          design:golden-coverage

      # Golden pixel changes are reported, not failed: the app is still
      # changing visually on purpose. CATCH_GOLDEN_REPORT puts the shared
      # comparator in report mode; render errors and every non-golden
      # expectation in these suites still fail the step.
      - name: Flutter goldens (report pixel changes)
        id: flutter-goldens
        env:
          CATCH_GOLDEN_REPORT: ${{ runner.temp }}/catch-golden-report.tsv
        run: flutter test --concurrency=1 test/goldens

      - name: Widgetbook package suites (pass 1)
        env:
          CATCH_GOLDEN_REPORT: ${{ runner.temp }}/catch-golden-report.tsv
        run: >-
          (cd widgetbook &&
          flutter test --concurrency=1 test)

      # Determinism is a property of the whole corpus, not of one change.
      # Pass 1 still renders every golden on each PR; the repeat render runs
      # on the nightly full validation so PRs do not pay for it.
      - name: Widgetbook corpus goldens (pass 2, determinism)
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        env:
          CATCH_GOLDEN_REPORT: ${{ runner.temp }}/catch-golden-report.tsv
        run: >-
          (cd widgetbook &&
          flutter test --concurrency=1 test/primitive_goldens_test.dart)

      - name: Report golden pixel changes
        id: golden-report
        if: ${{ always() && steps.flutter-goldens.outcome != 'skipped' }}
        env:
          REPORT: ${{ runner.temp }}/catch-golden-report.tsv
        run: |
          {
            echo "### Flutter golden changes"
            echo
            if [[ -s "$REPORT" ]]; then
              echo "$(sort -u "$REPORT" | wc -l | tr -d ' ') golden(s) differ from their baselines. Report only: nothing here blocks the merge. Images are in this run's flutter-golden-failures artifact."
              echo
              echo "| Golden | Change | Allowed |"
              echo "|---|---|---|"
              sort -u "$REPORT" | while IFS=$'\t' read -r golden change allowed; do
                echo "| \`$golden\` | $change | $allowed |"
              done
            else
              echo "No golden pixel changes."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ -s "$REPORT" ]]; then echo "has_changes=true" >> "$GITHUB_OUTPUT"; fi

      - name: Retain golden failure diffs
        if: ${{ failure() || steps.golden-report.outputs.has_changes == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: flutter-golden-failures-${{ github.run_id }}
          path: test/goldens/failures/
          if-no-files-found: ignore
          retention-days: 14

  native-smoke:
    name: macOS native app-shell smoke
    runs-on: macos-26
    timeout-minutes: 30
    # Independent runners use the same immutable checkout. Committed codegen
    # freshness remains required in goldens; neither result can replace it.
    steps:
      - uses: actions/checkout@v6
      - id: toolchain
        uses: ./.github/actions/load-toolchain
      - uses: ./.github/actions/setup-flutter
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get

      - name: Restore CocoaPods downloads
        uses: ./.github/actions/cache-cocoapods
        with:
          cocoapods-version: ${{ steps.toolchain.outputs.cocoapods-version }}
          lockfiles: apps/consumer/macos/Podfile.lock

      # The macOS runner lives in the Consumer project, and Flutter only runs
      # device tests from that project's own integration_test/ directory.
      - name: Hosted native app-shell smoke
        working-directory: apps/consumer
        run: bash ../../tool/test_app_shell_integration.sh macos smoke
