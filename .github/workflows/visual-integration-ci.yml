name: Flutter Visual & Integration CI

on:
  workflow_call:
    inputs:
      macos_only:
        description: Run only the macOS goldens (a main push the merge queue already validated).
        required: false
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless-journeys:
    name: Headless app journeys
    # The merge queue already ran these for a main push it validated.
    if: ${{ !inputs.macos_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/generate-contracts-cached
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get
      - name: Deterministic app-shell integration suites
        run: bash tool/test_app_shell_integration.sh

  goldens:
    name: macOS goldens & Widgetbook determinism
    # Out of the merge queue (owner decision, 22 Nov 2026): the 5 macOS
    # runners held queue groups past their timeout. Main pushes whose inputs
    # select this lane and the nightly run it, and a failure there reports to
    # the main-red issue. A called workflow sees the caller's event.
    if: ${{ github.event_name != 'merge_group' }}
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/generate-contracts-cached
      - id: toolchain
        uses: ./.github/actions/load-toolchain

      - uses: ./.github/actions/setup-flutter

      - run: flutter config --enable-macos-desktop

      - run: flutter pub get

      # The sqlite3 build hook downloads its native library during flutter test
      # with one attempt (main run 43716269314 failed on a DNS error). This
      # fetches it with retries into the hook's verified cache first.
      - name: Prefetch the sqlite3 native library
        run: node tool/ci/prefetch_sqlite3_asset.mjs

      # A full build in every package that runs build_runner. A filtered build
      # deletes tracked outputs outside its filter, so it is never used.
      - name: Generate Flutter source outputs
        run: |
          dart run build_runner build --delete-conflicting-outputs
          (cd apps/host && dart run build_runner build --delete-conflicting-outputs)
          (cd apps/consumer && dart run build_runner build --delete-conflicting-outputs)

      - name: Resolve Widgetbook dependencies
        run: (cd widgetbook && flutter pub get)

      - name: Generate Widgetbook directories
        id: widgetbook-codegen
        run: (cd widgetbook && dart run build_runner build)

      - name: Verify committed Flutter outputs are current
        id: codegen-current
        run: |
          git diff --exit-code -- '*.g.dart' '*.freezed.dart'
          untracked="$(git status --porcelain --untracked-files=all -- '*.g.dart' '*.freezed.dart')"
          if [[ -n "$untracked" ]]; then
            printf 'Generated outputs are not committed:\n%s\n' "$untracked" >&2
            exit 1
          fi

      # The regenerated outputs that differ, as a patch to read or apply.
      - name: Retain generated output drift
        if: ${{ failure() && steps.codegen-current.outcome == 'failure' }}
        run: |
          mkdir -p build/ci
          git add --intent-to-add -- '*.g.dart' '*.freezed.dart'
          git diff -- '*.g.dart' '*.freezed.dart' > build/ci/generated-flutter-drift.patch

      - name: Upload generated output drift
        if: ${{ failure() && steps.codegen-current.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-flutter-drift-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci/generated-flutter-drift.patch
          if-no-files-found: ignore
          retention-days: 7

      # Golden pixel changes are reported, not failed: the app is still
      # changing visually on purpose. CATCH_GOLDEN_REPORT puts the shared
      # comparator in report mode; render errors and every non-golden
      # expectation in these suites still fail the step.
      - name: Flutter goldens (report pixel changes)
        id: flutter-goldens
        env:
          CATCH_GOLDEN_REPORT: ${{ runner.temp }}/catch-golden-report-app.tsv
        run: flutter test --concurrency=1 test/goldens

      # The library's own golden families (packages/catch_ui/test/goldens,
      # tagged golden), reported through the same comparator and report.
      - name: Catch UI package goldens (report pixel changes)
        env:
          CATCH_GOLDEN_REPORT: ${{ runner.temp }}/catch-golden-report-package.tsv
        run: >-
          (cd packages/catch_ui &&
          flutter test --concurrency=1 --tags=golden)

      # Each app package's golden families (apps/<app>/test/goldens), run from
      # its package directory. They join the app report: like test/goldens,
      # they have no baseline workflow.
      - name: App package goldens (report pixel changes)
        env:
          CATCH_GOLDEN_REPORT: ${{ runner.temp }}/catch-golden-report-app.tsv
        run: |
          status=0
          for app in apps/*/; do
            if [[ -d "${app}test/goldens" ]]; then
              (cd "$app" && flutter test --concurrency=1 test/goldens) || status=$?
            fi
          done
          exit "$status"

      - name: Widgetbook package suites (pass 1)
        env:
          CATCH_GOLDEN_REPORT: ${{ runner.temp }}/catch-golden-report-widgetbook.tsv
        run: >-
          (cd widgetbook &&
          flutter test --concurrency=1 test)

      # Determinism is a property of the whole corpus, not of one change.
      # Pass 1 still renders every golden on each PR; the repeat render runs
      # on the nightly full validation so PRs do not pay for it.
      - name: Widgetbook corpus goldens (pass 2, determinism)
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        env:
          CATCH_GOLDEN_REPORT: ${{ runner.temp }}/catch-golden-report-widgetbook.tsv
        run: >-
          (cd widgetbook &&
          flutter test --concurrency=1 test/primitive_goldens_test.dart)

      # One report per suite (app, catch_ui package, Widgetbook), so the Main
      # CI alert can dispatch the matching baseline workflow on drift.
      - name: Report golden pixel changes
        id: golden-report
        if: ${{ always() && steps.flutter-goldens.outcome != 'skipped' }}
        env:
          REPORT: ${{ runner.temp }}/catch-golden-report.tsv
          REPORT_DIR: ${{ runner.temp }}
        run: |
          cat "$REPORT_DIR"/catch-golden-report-{app,package,widgetbook}.tsv 2>/dev/null > "$REPORT" || true
          {
            echo "### Flutter golden changes"
            echo
            if [[ -s "$REPORT" ]]; then
              echo "$(sort -u "$REPORT" | wc -l | tr -d ' ') golden(s) differ from their baselines. Report only: nothing here blocks the merge. Images are in this run's flutter-golden-failures artifact."
              echo
              echo "| Golden | Change | Allowed |"
              echo "|---|---|---|"
              sort -u "$REPORT" | while IFS=$'\t' read -r golden change allowed; do
                echo "| \`$golden\` | $change | $allowed |"
              done
            else
              echo "No golden pixel changes."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ -s "$REPORT" ]]; then echo "has_changes=true" >> "$GITHUB_OUTPUT"; fi

      - name: Retain golden failure diffs
        if: ${{ failure() || steps.golden-report.outputs.has_changes == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: flutter-golden-failures-${{ github.run_id }}
          path: |
            test/goldens/failures/
            packages/catch_ui/test/goldens/failures/
            apps/*/test/goldens/failures/
          if-no-files-found: ignore
          retention-days: 14

      # The per-suite drift reports the Main CI alert reads on main and the
      # nightly (tool/ci/golden_policy.mjs); a few lines of text each.
      - name: Retain golden drift reports
        if: ${{ always() && steps.golden-report.outputs.has_changes == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-drift-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/catch-golden-report-app.tsv
            ${{ runner.temp }}/catch-golden-report-package.tsv
            ${{ runner.temp }}/catch-golden-report-widgetbook.tsv
          if-no-files-found: ignore
          retention-days: 14

  native-smoke:
    name: macOS native app-shell smoke
    # Nightly-only (owner decision, 15 Nov 2026): in 30 days of history it
    # caught nothing the Headless journeys, goldens or analysis did not, and
    # one runner cancellation failed a queue group. A called workflow sees the
    # caller's event, so this skips pull requests, the merge queue and main
    # pushes, and runs on the nightly schedule and on manual dispatch. A
    # skipped job leaves the caller's visual-integration result green.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-26
    timeout-minutes: 30
    # Independent runners use the same immutable checkout. Committed codegen
    # freshness remains required in goldens; neither result can replace it.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/generate-contracts-cached
      - id: toolchain
        uses: ./.github/actions/load-toolchain
      - uses: ./.github/actions/setup-flutter
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get

      - name: Restore CocoaPods downloads
        uses: ./.github/actions/cache-cocoapods
        with:
          cocoapods-version: ${{ steps.toolchain.outputs.cocoapods-version }}
          lockfiles: apps/consumer/macos/Podfile.lock

      # The macOS runner lives in the Consumer project, and Flutter only runs
      # device tests from that project's own integration_test/ directory.
      - name: Hosted native app-shell smoke
        working-directory: apps/consumer
        run: bash ../../tool/test_app_shell_integration.sh macos smoke
