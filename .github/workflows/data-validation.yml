name: Firestore Data Validation

on:
  schedule:
    - cron: '30 20 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: Firebase environment alias to validate.
        required: true
        default: prod
        type: choice
        options:
          - dev
          - staging
          - prod
      max_docs:
        description: Per-collection document cap.
        required: true
        default: '5000'
        type: string
      fail_on_warning:
        description: Treat warnings as CI failures.
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    name: Validate ${{ github.event.inputs.environment || 'prod' }} Firestore data
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'prod' }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - id: toolchain
        uses: ./.github/actions/load-toolchain

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - run: npm --prefix functions ci

      - name: Test report capture offline
        run: node --test tool/data/validate_firestore_data.test.mjs

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Validate Firestore data
        shell: bash
        env:
          TARGET_ENV: ${{ github.event.inputs.environment || 'prod' }}
          MAX_DOCS: ${{ github.event.inputs.max_docs || '5000' }}
          FAIL_ON_WARNING: ${{ github.event.inputs.fail_on_warning || false }}
        run: |
          set -euo pipefail
          args=(--env "$TARGET_ENV" --json --max-docs "$MAX_DOCS" --output firestore-data-validation.json)
          if [[ "$FAIL_ON_WARNING" == "true" ]]; then
            args+=(--fail-on-warning)
          fi

          node tool/data/validate_firestore_data.mjs "${args[@]}"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: firestore-data-validation-${{ github.event.inputs.environment || 'prod' }}
          path: firestore-data-validation.json
