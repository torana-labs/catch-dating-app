name: Host Website

# CI is switched off for the redesign sprint (owner, 8 Nov 2026): nothing runs on
# pull requests or pushes; the full run happens once a night on main.
on:
  schedule:
    - cron: '20 22 * * *' # once a night, main
  workflow_dispatch:
    inputs:
      recovery_artifact_digest:
        description: Exact sha256 digest from a failed source run's Web Hosting artifact
        required: false
        type: string
      recovery_artifact_id:
        description: Exact artifact id from a failed source run (leave empty for validation-only dispatch)
        required: false
        type: string
      recovery_reason:
        description: Operator reason required for exact-artifact recovery
        required: false
        type: string
      recovery_source_run_attempt:
        description: Producing failed workflow run attempt
        required: false
        type: string
      recovery_source_run_id:
        description: Producing failed workflow run id
        required: false
        type: string
      recovery_source_sha:
        description: Exact 40-character source SHA from the failed run
        required: false
        type: string

permissions:
  contents: read

jobs:
  queue-validation:
    name: Find merge queue validation
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      validated: ${{ steps.queue.outputs.validated }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - id: queue
        uses: ./.github/actions/find-queue-validation
        with:
          jobs: |
            flutter / Flutter analysis and gates
            flutter / Catch UI, Consumer & Host package tests

  validate:
    name: Validate standalone Host web
    needs: queue-validation
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.recovery_artifact_id == '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/generate-contracts
      - id: toolchain
        uses: ./.github/actions/load-toolchain

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}

      # The queue selects these two only for some changes, so a release always runs them.
      - name: Validate Host target contracts
        run: node tool/run.mjs check platform:app-targets platform:app-package-graphs

      - uses: ./.github/actions/setup-flutter
        if: ${{ needs.queue-validation.outputs.validated != 'true' }}

      - run: flutter pub get
        if: ${{ needs.queue-validation.outputs.validated != 'true' }}

      - name: Analyze Host-owned Flutter surfaces
        if: ${{ needs.queue-validation.outputs.validated != 'true' }}
        run: flutter analyze --no-fatal-infos apps/host lib/hosts lib/events

      - name: Test standalone Host roster behavior
        if: ${{ needs.queue-validation.outputs.validated != 'true' }}
        run: flutter test --concurrency=1 test/hosts

  package:
    name: Package exact Host Hosting bytes
    needs: validate
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.validate.result == 'success' }}
    uses: ./.github/workflows/_web-hosting-build.yml
    with:
      surface: host
    permissions:
      actions: read
      contents: read
      id-token: write

  promote:
    name: Promote exact Host Hosting bytes
    needs: package
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.package.result == 'success' }}
    uses: ./.github/workflows/_web-hosting-promote.yml
    with:
      artifact_digest: ${{ needs.package.outputs.artifact_digest }}
      artifact_id: ${{ needs.package.outputs.artifact_id }}
      source_ci_run_attempt: ${{ needs.package.outputs.source_ci_run_attempt }}
      source_ci_run_id: ${{ needs.package.outputs.source_ci_run_id }}
      source_sha: ${{ needs.package.outputs.source_sha }}
      surface: host
    permissions:
      actions: read
      contents: read
      id-token: write

  recover:
    name: Recover exact Host Hosting bytes
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.recovery_artifact_id != '' }}
    uses: ./.github/workflows/_web-hosting-promote.yml
    with:
      artifact_digest: ${{ inputs.recovery_artifact_digest }}
      artifact_id: ${{ inputs.recovery_artifact_id }}
      recovery: true
      recovery_reason: ${{ inputs.recovery_reason }}
      source_ci_run_attempt: ${{ inputs.recovery_source_run_attempt }}
      source_ci_run_id: ${{ inputs.recovery_source_run_id }}
      source_sha: ${{ inputs.recovery_source_sha }}
      surface: host
    permissions:
      actions: read
      contents: read
      id-token: write
