name: Brand config publish (one environment)

# Publishes packages/brand/brand.json to the public Firestore document
# config/brand in one Firebase environment, then reads it back. The apps read
# that document at run time (catch_platform LiveBrand); everything else reads
# the reviewed generated copies. It runs as the environment's deploy identity
# through Workload Identity (no keys), the same identity the backend deploy and
# the seed workflow use. The writer replaces the whole document with the
# record, so a run is idempotent and a retry is safe. A run publishes only the
# brand.json that is current on main, so a late or retried run cannot put older
# values back. Operator guide: packages/brand/README.md, "Live config in the apps".

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish config/brand to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    # One publish per environment at a time. A newer run waits; GitHub keeps
    # only the newest waiting run.
    concurrency:
      group: brand-config-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      # Full history so origin/main is present for the freshness check.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: current
        name: Publish only the brand record that is current on main
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::config/brand publishes only from main, not $GITHUB_REF."
            exit 1
          fi
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          if git diff --quiet "$GITHUB_SHA" "$main_sha" -- packages/brand/brand.json; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main ($main_sha) has a newer packages/brand/brand.json than $GITHUB_SHA; that commit's run publishes it."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - id: toolchain
        if: ${{ steps.current.outputs.publish == 'true' }}
        uses: ./.github/actions/load-toolchain

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        if: ${{ steps.current.outputs.publish == 'true' }}
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      # The writer imports @catch/brand (root workspace) and firebase-admin
      # (functions), so install exactly those two dependency families.
      - name: Install the root and Functions dependencies
        if: ${{ steps.current.outputs.publish == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          bash tool/git/bootstrap_worktree.sh --target root
          bash tool/git/bootstrap_worktree.sh --target functions

      - name: Show the document this run publishes
        if: ${{ steps.current.outputs.publish == 'true' }}
        shell: bash
        env:
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          node tool/firebase/create_config_brand.mjs --env "$TARGET_ENV" --json | tee brand-plan.json
          {
            echo "## config/brand · ${TARGET_ENV}"
            echo
            echo '```json'
            cat brand-plan.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Authenticate to Google Cloud
        if: ${{ steps.current.outputs.publish == 'true' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Publish config/brand
        if: ${{ steps.current.outputs.publish == 'true' }}
        shell: bash
        env:
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          args=(--env "$TARGET_ENV" --apply)
          if [[ "$TARGET_ENV" == "prod" ]]; then args+=(--allow-prod); fi
          node tool/firebase/create_config_brand.mjs "${args[@]}"

      - name: Verify config/brand matches brand.json
        if: ${{ steps.current.outputs.publish == 'true' }}
        shell: bash
        env:
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          node tool/firebase/create_config_brand.mjs --env "$TARGET_ENV" --verify | tee brand-verify.txt
          {
            echo
            echo '```'
            cat brand-verify.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
