name: UI capture render
run-name: UI captures for ${{ inputs.ref }} (${{ inputs.ids }})

# Catalog captures are rendered locally on whatever machine runs them, so a
# reviewer without a Mac cannot see a capture as the macOS goldens lane draws
# it. This manual job renders the selected catalog capture ids, at a given ref,
# on the same macOS runner image as the goldens lane and uploads the PNGs as an
# artifact for a person to review. It never pushes, opens a pull request or
# changes anything in the repository.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or full commit SHA in this repository to render
        required: true
        type: string
      ids:
        description: >-
          Comma-separated capture ids from test/ui_captures/catalog (for example
          `host_home_events_list,host_events_desktop`)
        required: true
        type: string
      text_scale:
        description: Optional MediaQuery text scale, for example `2.0`
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ui-capture-render-${{ inputs.ref }}-${{ inputs.ids }}
  cancel-in-progress: false

jobs:
  render:
    name: Render UI captures on macOS
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Validate inputs
        env:
          IDS: ${{ inputs.ids }}
          TEXT_SCALE: ${{ inputs.text_scale }}
        run: |
          set -euo pipefail
          if [[ ! "$IDS" =~ ^[a-z0-9_]+(,[a-z0-9_]+)*$ ]]; then
            echo "::error::ids must be comma-separated catalog ids (lowercase letters, digits and underscores)."
            exit 1
          fi
          if [[ -n "$TEXT_SCALE" && ! "$TEXT_SCALE" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::text_scale must be a number such as 1.5 or 2.0."
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: ./.github/actions/generate-contracts

      - uses: ./.github/actions/setup-flutter

      - run: flutter pub get

      - name: Render the selected captures
        env:
          IDS: ${{ inputs.ids }}
          TEXT_SCALE: ${{ inputs.text_scale }}
        run: |
          set -euo pipefail
          args=(--ids "$IDS" --output-dir build/ui-captures)
          if [[ -n "$TEXT_SCALE" ]]; then args+=(--text-scale "$TEXT_SCALE"); fi
          node tool/ui_capture/run_captures.mjs "${args[@]}"

      - name: Summarise the rendered captures
        run: |
          set -euo pipefail
          (cd build/ui-captures && find . -name '*.png' | sed 's#^\./##' | sort) > build/ui-captures.txt
          count="$(wc -l < build/ui-captures.txt | tr -d ' ')"
          if [[ "$count" == "0" ]]; then
            echo "::error::No capture PNGs were rendered."
            exit 1
          fi
          {
            echo "### UI captures rendered on macOS"
            echo
            echo "Source: \`$(git rev-parse HEAD)\`; images: $count."
            echo
            sed "s/^/- \`/; s/\$/\`/" build/ui-captures.txt
            echo
            echo "Download the artifact and review the images."
          } >> "$GITHUB_STEP_SUMMARY"
          cp build/ui-captures.txt build/ui-captures/RENDERED.txt

      - name: Upload captures for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-captures-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ui-captures
          if-no-files-found: error
          retention-days: 14
