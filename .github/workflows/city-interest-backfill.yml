name: City interest backfill

# Runs tool/data/backfill_city_interest.mjs against one Firebase environment
# with that environment's deploy identity, so the backfill is a logged,
# repeatable run rather than a command on someone's laptop. It gives existing
# website launch-notice rows (launchWaitlist) the catalog cityId their
# free-text city names when exactly one catalog city matches, and counts each
# person once per city in cityInterest. The default is a dry run, which only
# reads and writes the plan to the job summary: rows matched, people per city
# key and the free-text cities nothing matched, never a contact. `apply`
# writes; markers make a rerun count nobody twice. Dispatch only, from main
# only. Operator guide: docs/release_operations.md, "City interest backfill".

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Firebase environment to backfill.
        required: true
        type: choice
        options: [dev, prod]
        default: dev
      mode:
        description: dry-run reads and reports; apply writes.
        required: true
        type: choice
        options: [dry-run, apply]
        default: dry-run

permissions:
  contents: read

jobs:
  backfill:
    name: Backfill city interest in ${{ inputs.environment }} (${{ inputs.mode }})
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    # One backfill per environment at a time; a second waits.
    concurrency:
      group: city-interest-backfill-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Run only from main
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::The city interest backfill runs only from main, not $GITHUB_REF."
            exit 1
          fi

      - id: toolchain
        uses: ./.github/actions/load-toolchain

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      # The tool reads the catalog through tool/lib (root) and Firestore through
      # firebase-admin (functions), so install exactly those two families.
      - name: Install the root and Functions dependencies
        shell: bash
        run: |
          set -euo pipefail
          bash tool/git/bootstrap_worktree.sh --target root
          bash tool/git/bootstrap_worktree.sh --target functions

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Run the backfill
        shell: bash
        env:
          TARGET_ENV: ${{ inputs.environment }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          args=(--env "$TARGET_ENV" --markdown)
          case "$MODE" in
            dry-run) ;;
            apply)
              args+=(--apply)
              if [[ "$TARGET_ENV" == "prod" ]]; then args+=(--allow-prod); fi
              ;;
            *)
              echo "::error::Unknown mode '$MODE'."
              exit 1
              ;;
          esac
          node tool/data/backfill_city_interest.mjs "${args[@]}" | tee backfill-report.md
          cat backfill-report.md >> "$GITHUB_STEP_SUMMARY"
