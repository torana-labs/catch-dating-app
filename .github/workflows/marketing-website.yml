name: Marketing Website

on:
  push:
    branches: [main]
    paths:
      - ".github/actions/**"
      - ".github/workflows/_web-hosting-build.yml"
      - ".github/workflows/_web-hosting-promote.yml"
      - ".github/workflows/marketing-website.yml"
      - ".github/workflows/react-surface-validation.yml"
      - ".firebaserc"
      - "firebase.json"
      - "package.json"
      - "package-lock.json"
      - "functions/package.json"
      - "functions/package-lock.json"
      - "website/**"
      # Source capture inputs publish freshly rendered website media as well.
      - "lib/**"
      - "apps/*/lib/**"
      - "packages/*/lib/**"
      - "packages/*/assets/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "packages/*/pubspec.yaml"
      - "packages/*/pubspec.lock"
      - "apps/*/pubspec.yaml"
      - "apps/*/pubspec.lock"
      - "tool/ui_capture/**"
      - ".github/workflows/capture-freshness-ci.yml"
      - ".github/workflows/marketing-captures.yml"
      - "assets/**"
      - "artifacts/marketing/app-screenshots/**"
      - "packages/web-config/**"
      - "packages/web-ui/**"
      - "design/tokens/**"
      - "design/components/**"
      - "design/public_surface_behavior.json"
      - "design/public_surface_behavior.schema.json"
      - "design/admin/**"
      - "design/website/**"
      - "contracts/public/website_host_listing_projection.schema.json"
      - "tool/ci/toolchain.env"
      - "tool/ci/delivery_core.mjs"
      - "tool/ci/package_web_hosting.mjs"
      - "tool/ci/wait_main_marketing_validation.mjs"
      - "tool/contracts/generated/schema_contract_validators.mjs"
      - "tool/contracts/generated/schema_contract_registry.mjs"
      - "tool/demo/demo_seed/scenarios/**"
      - "tool/demo/demo_seed/personas/**"
      - "tool/design_tokens.dart"
      - "tool/design/check_component_lexicon.mjs"
      - "tool/design/check_public_surface_behavior.mjs"
      - "tool/web/check_shared_web_ui_adoption.mjs"
      - "tool/web/lib/**"
      - "tool/web/check_storybook_visuals.mjs"
      - "tool/web/check_react_controller_test_targets.mjs"
      - "tool/web/react_dependency_graph.mjs"
      - "tool/env/check_web_hosting_env.mjs"
      - "tool/firebase_with_env.sh"
      - "tool/marketing/**"
      - "tool/lib/repo_paths.mjs"
  workflow_dispatch:
    inputs:
      update_visual_baselines:
        description: Capture Ubuntu visual baselines and upload them for review
        required: false
        type: boolean
        default: false
      recovery_artifact_digest:
        description: Exact sha256 digest from a failed source run's Web Hosting artifact
        required: false
        type: string
      recovery_artifact_id:
        description: Exact artifact id from a failed source run (leave empty for validation-only dispatch)
        required: false
        type: string
      recovery_reason:
        description: Operator reason required for exact-artifact recovery
        required: false
        type: string
      recovery_source_run_attempt:
        description: Producing failed workflow run attempt
        required: false
        type: string
      recovery_source_run_id:
        description: Producing failed workflow run id
        required: false
        type: string
      recovery_source_sha:
        description: Exact 40-character source SHA from the failed run
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  ci-validation:
    name: Resolve exact-main Marketing validation
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    permissions:
      actions: read
      contents: read
    outputs:
      validated: ${{ steps.validation.outputs.validated }}
      capture_binding: ${{ steps.validation.outputs.capture_binding }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - id: toolchain
        uses: ./.github/actions/load-toolchain
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
      - name: Wait for successful same-source Marketing and capture jobs
        id: validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tool/ci/wait_main_marketing_validation.mjs > marketing-validation.json
      - name: Save exact-source validation identity
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: marketing-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: marketing-validation.json
          if-no-files-found: error
          retention-days: 7

  captures:
    name: Produce standalone marketing captures
    needs: ci-validation
    if: >-
      ${{ !cancelled() &&
          ((github.event_name == 'workflow_dispatch' && inputs.recovery_artifact_id == '') ||
           (github.event_name == 'push' && needs.ci-validation.result == 'success' &&
            needs.ci-validation.outputs.validated == 'false' &&
            needs.ci-validation.outputs.capture_binding == '')) }}
    uses: ./.github/workflows/marketing-captures.yml
    with:
      automatic_source_sha: ${{ github.sha }}

  validate:
    name: Validate marketing website
    needs: [ci-validation, captures]
    if: >-
      ${{ !cancelled() &&
          (needs.captures.result == 'success' ||
           (needs.captures.result == 'skipped' && needs.ci-validation.outputs.capture_binding != '')) &&
          ((github.event_name == 'workflow_dispatch' && inputs.recovery_artifact_id == '') ||
           (github.event_name == 'push' && needs.ci-validation.result == 'success' &&
            needs.ci-validation.outputs.validated == 'false')) }}
    uses: ./.github/workflows/react-surface-validation.yml
    with:
      surface: marketing
      capture_binding: ${{ needs.ci-validation.outputs.capture_binding || needs.captures.outputs.capture_binding }}
      update_visual_baselines: ${{ github.event_name == 'workflow_dispatch' && inputs.update_visual_baselines }}
      skip_deployable_build: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  package:
    name: Package exact marketing Hosting bytes
    needs: [ci-validation, captures, validate]
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          needs.ci-validation.result == 'success' &&
          ((needs.ci-validation.outputs.validated == 'true' && needs.validate.result == 'skipped') ||
           (needs.ci-validation.outputs.validated == 'false' && needs.validate.result == 'success')) }}
    uses: ./.github/workflows/_web-hosting-build.yml
    with:
      surface: marketing
      capture_binding: ${{ needs.ci-validation.outputs.capture_binding || needs.captures.outputs.capture_binding }}
    permissions:
      actions: read
      contents: read
      id-token: write

  promote:
    name: Promote exact marketing Hosting bytes
    needs: package
    # Validation reuse intentionally skips an ancestor; override implicit success().
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.package.result == 'success' }}
    uses: ./.github/workflows/_web-hosting-promote.yml
    with:
      artifact_digest: ${{ needs.package.outputs.artifact_digest }}
      artifact_id: ${{ needs.package.outputs.artifact_id }}
      source_ci_run_attempt: ${{ needs.package.outputs.source_ci_run_attempt }}
      source_ci_run_id: ${{ needs.package.outputs.source_ci_run_id }}
      source_sha: ${{ needs.package.outputs.source_sha }}
      surface: marketing
    permissions:
      actions: read
      contents: read
      id-token: write

  recover:
    name: Recover exact marketing Hosting bytes
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.recovery_artifact_id != '' }}
    uses: ./.github/workflows/_web-hosting-promote.yml
    with:
      artifact_digest: ${{ inputs.recovery_artifact_digest }}
      artifact_id: ${{ inputs.recovery_artifact_id }}
      recovery: true
      recovery_reason: ${{ inputs.recovery_reason }}
      source_ci_run_attempt: ${{ inputs.recovery_source_run_attempt }}
      source_ci_run_id: ${{ inputs.recovery_source_run_id }}
      source_sha: ${{ inputs.recovery_source_sha }}
      surface: marketing
    permissions:
      actions: read
      contents: read
      id-token: write
