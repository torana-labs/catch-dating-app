name: CI
run-name: >-
  ${{ github.event_name == 'pull_request' && format('CI PR #{0}', github.event.pull_request.number) || 'CI' }}

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  merge_group:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: Run every validation lane regardless of changed paths.
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: read
  pull-requests: read
  issues: read

concurrency:
  # Every ready PR validates in parallel; a newer push or draft conversion
  # cancels that PR's older run. The merge queue validates the exact combined
  # source before anything reaches main, so a PR result never needs to stay
  # current with main. Merge-queue groups key on their exact head. Main pushes
  # share one group, so a newer merge cancels the older main run instead of
  # competing with the queue for runners. Delivery still covers the cancelled
  # commits: the next run's window starts at the last successful main run
  # (tool/ci/main_ci_baseline.mjs). Marketing Website reuses the cancelled
  # run's capture and validation jobs that already succeeded, and otherwise
  # captures and validates its exact source itself.
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'push' && github.ref || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  plan:
    # Drafts are not ready for review; marking one ready starts its validation.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    name: Plan affected targets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      admin: ${{ steps.plan.outputs.admin }}
      app_roles: ${{ steps.plan.outputs.app_roles }}
      capture_freshness: ${{ steps.plan.outputs.capture_freshness }}
      contracts: ${{ steps.plan.outputs.contracts }}
      preflight_functions_dependencies: ${{ steps.plan.outputs.preflight_functions_dependencies }}
      docs: ${{ steps.plan.outputs.docs }}
      docs_checkout: ${{ steps.plan.outputs.docs_checkout }}
      firestore_rules: ${{ steps.plan.outputs.firestore_rules }}
      flutter: ${{ steps.plan.outputs.flutter }}
      flutter_build_android: ${{ steps.plan.outputs.flutter_build_android }}
      flutter_build_ios: ${{ steps.plan.outputs.flutter_build_ios }}
      flutter_build_web: ${{ steps.plan.outputs.flutter_build_web }}
      flutter_web_smoke: ${{ steps.plan.outputs.flutter_web_smoke }}
      functions: ${{ steps.plan.outputs.functions }}
      marketing: ${{ steps.plan.outputs.marketing }}
      operations: ${{ steps.plan.outputs.operations }}
      policy_docs: ${{ steps.plan.outputs.policy_docs }}
      tools: ${{ steps.plan.outputs.tools }}
      visual_integration: ${{ steps.plan.outputs.visual_integration }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      producer_attempt: ${{ steps.plan.outputs.producer_attempt }}
      deploy_groups: ${{ steps.plan.outputs.deploy_groups }}
      deploy_required: ${{ steps.plan.outputs.deploy_required }}
      mode: ${{ steps.plan.outputs.mode }}
      full: ${{ steps.plan.outputs.full }}
      commit_window: ${{ steps.plan.outputs.commit_window }}
      tools_owns_ui_lint_smoke: ${{ steps.plan.outputs.tools_owns_ui_lint_smoke }}
      tools_owns_design_parity: ${{ steps.plan.outputs.tools_owns_design_parity }}
      tools_owns_design_handoff: ${{ steps.plan.outputs.tools_owns_design_handoff }}
      queue_verified_run: ${{ steps.queue.outputs.run_id }}

    steps:
      - name: Checkout planner closure
        uses: actions/checkout@v6
        timeout-minutes: 3
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tool/harness.mjs
            /tool/harness/verify_local.mjs
            /tool/harness/compare_selectors.mjs
            /tool/ci/main_ci_baseline.mjs
            /tool/ci/toolchain.env
            /tool/harness/component_graph.json
            /tool/harness/lib/component_graph.mjs
            /tool/harness/lib/git_changes.mjs
            /tool/harness/lib/workflow_steps.mjs
            /tool/lib/path_glob.mjs
            /tool/lib/repo_paths.mjs
            /tool/lib/repository_snapshot.mjs
            /tool/lib/tool_impact.mjs
            /tool/lib/tool_platform.mjs
            /tool/run.mjs
            /tool/tools_manifest.json
            /.github/actions/load-toolchain/action.yml
            /tool/design/build_host_feature_responsibilities.mjs
            /design/features/host_feature_responsibilities.json

      - id: toolchain
        uses: ./.github/actions/load-toolchain
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}

      - id: plan
        name: Resolve fail-closed impact plan
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REQUEST_FULL: ${{ github.event_name == 'schedule' || inputs.full }}
        run: |
          set -euo pipefail
          event_mode="pr"
          base_sha=""
          full_flag=()
          window_flag=()
          case "$EVENT_NAME" in
            pull_request)
              base_sha="$PR_BASE_SHA"
              ;;
            merge_group)
              event_mode="merge_group"
              base_sha="$MERGE_GROUP_BASE_SHA"
              ;;
            push)
              event_mode="main"
              baseline="$(node tool/ci/main_ci_baseline.mjs \
                --repository "$GITHUB_REPOSITORY" \
                --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
                --source-sha "$HEAD_SHA" --fallback-base "$BEFORE_SHA")"
              base_sha="$(jq -er '.baseSha' <<< "$baseline")"
              window_flag=(--commit-window)
              ;;
            schedule)
              event_mode="nightly"
              base_sha="${HEAD_SHA}^"
              full_flag=(--full)
              ;;
            workflow_dispatch)
              event_mode="nightly"
              base_sha="${HEAD_SHA}^"
              if [[ "$REQUEST_FULL" == "true" ]]; then
                full_flag=(--full)
              fi
              ;;
            *)
              echo "Unsupported CI event: $EVENT_NAME"
              exit 64
              ;;
          esac

          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            echo "Missing usable base SHA for $EVENT_NAME; refusing to broaden a non-nightly plan."
            exit 64
          fi
          # Scheduled/manual bases start as revision expressions. Bind every
          # downstream lane and artifact to the same immutable commit object.
          base_sha="$(git rev-parse --verify --end-of-options "${base_sha}^{commit}")"
          [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$event_mode" == "main" ]]; then
            git merge-base --is-ancestor "$base_sha" "$HEAD_SHA"
          fi

          mkdir -p build/ci
          node tool/harness/compare_selectors.mjs --base "$base_sha" --head "$HEAD_SHA" \
            --mode "$event_mode" > build/ci/selector-comparison.json

          node tool/harness/verify_local.mjs --preflight --allow-deferred \
            --base "$base_sha" --head "$HEAD_SHA" --mode "$event_mode" \
            "${full_flag[@]}" "${window_flag[@]}"

          mkdir -p build/ci
          node tool/harness.mjs plan \
            --base "$base_sha" \
            --head "$HEAD_SHA" \
            "${full_flag[@]}" "${window_flag[@]}" \
            --mode "$event_mode" \
            --github-output "$GITHUB_OUTPUT" \
            --json > build/ci/impact-plan.unbound.json
          jq \
            --arg baseSha "$base_sha" \
            --arg sourceSha "$HEAD_SHA" \
            --arg sourceCiRunId "$GITHUB_RUN_ID" \
            --arg sourceCiRunAttempt "$GITHUB_RUN_ATTEMPT" \
            '. + {
              baseSha: $baseSha,
              sourceSha: $sourceSha,
              sourceCiRunId: $sourceCiRunId,
              sourceCiRunAttempt: $sourceCiRunAttempt
            }' \
            build/ci/impact-plan.unbound.json > build/ci/impact-plan.json
          rm build/ci/impact-plan.unbound.json
          node tool/harness/compare_selectors.mjs --verify-plan build/ci/impact-plan.json \
            --comparison build/ci/selector-comparison.json --github-output "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "source_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "producer_attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {toolsOwnUiLintSmoke, toolsOwnDesignChecks} from './tool/lib/tool_impact.mjs';
          const read = (file) => JSON.parse(fs.readFileSync(file, 'utf8'));
          const owned = toolsOwnUiLintSmoke({
            plan: read('build/ci/impact-plan.json'),
            manifest: read('tool/tools_manifest.json'),
            componentGraph: read('tool/harness/component_graph.json'),
          });
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tools_owns_ui_lint_smoke=${owned}\n`);
          const design = toolsOwnDesignChecks({
            plan: read('build/ci/impact-plan.json'), manifest: read('tool/tools_manifest.json'),
            componentGraph: read('tool/harness/component_graph.json'),
          });
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            `tools_owns_design_parity=${design.parity}\ntools_owns_design_handoff=${design.handoff}\n`);
          NODE

      - id: queue
        name: Find the merge-queue validation of this exact source
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          # The merge queue validated this exact commit before main moved to
          # it. Reuse covers only pure-validation lanes; every delivery
          # producer still runs. Any lookup failure keeps the full run.
          run_id=""
          if runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=merge_group&head_sha=$SOURCE_SHA&per_page=20")"; then
            run_id="$(jq -r --arg sha "$SOURCE_SHA" '[.workflow_runs[]? | select(.event == "merge_group" and
              .head_sha == $sha and .conclusion == "success" and .path == ".github/workflows/ci.yml")] |
              max_by(.id) | .id // empty' <<< "$runs" || true)"
          fi
          if [[ -n "$run_id" ]]; then
            jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" || echo '{}')"
            jq -e '[.jobs[]? | select(.name == "Required CI" and .conclusion == "success")] | length == 1' \
              <<< "$jobs" > /dev/null || run_id=""
          fi
          [[ -z "$run_id" || "$run_id" =~ ^[1-9][0-9]*$ ]] || run_id=""
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Merge-queue validation reused: ${run_id:-none}" >> "$GITHUB_STEP_SUMMARY"

      - name: Report Audience documentation impact
        env:
          BASE_SHA: ${{ steps.plan.outputs.base_sha }}
        run: |
          node tool/design/build_host_feature_responsibilities.mjs \
            --affected audience --base "$BASE_SHA" --json \
            > build/ci/audience-doc-impact.json
          {
            echo "## Audience documentation review"
            jq -r '.coverage,
              (.sections[] | "- " + .anchor + ": " + .status +
                "; changed sources: " + (.changedSources | join(", "))),
              (.changedReferenceSources[] | "- Regenerate schema reference: " + .),
              (if .referenceDefinitionChanged then "- Schema reference selection changed." else empty end),
              (if (.sections | length) == 0 then "No affected explanations in declared dependencies." else empty end)
            ' build/ci/audience-doc-impact.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Audience documentation advice
        uses: actions/upload-artifact@v7
        with:
          name: audience-doc-impact-${{ github.run_number }}-${{ github.run_id }}-${{ steps.plan.outputs.source_sha }}-${{ github.run_attempt }}
          path: build/ci/audience-doc-impact.json
          if-no-files-found: error
          retention-days: 7

      - name: Publish impact summary
        run: |
          {
            echo "## Harness v2 affected plan"
            echo
            echo '```json'
            jq . build/ci/impact-plan.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload planner evidence
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event_name == 'push' && 'harness-validation-plan' || 'harness-plan' }}-${{ github.run_number }}-${{ github.run_id }}-${{ steps.plan.outputs.source_sha }}-${{ github.run_attempt }}
          path: build/ci/impact-plan.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload selector comparison
        uses: actions/upload-artifact@v7
        with:
          name: selector-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci/selector-comparison.json
          if-no-files-found: error
          retention-days: 7

  source-preflight:
    name: Complete source preflight
    needs: plan
    if: ${{ needs.plan.outputs.producer_attempt == format('{0}', github.run_attempt) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: toolchain
        uses: ./.github/actions/load-toolchain
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
      - name: Derive exact-source route and widget inventories
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        run: node tool/ci/generated_inventories.mjs --source-sha "$SOURCE_SHA"
      - run: npm ci
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      - name: Install selected contract generator dependencies
        if: ${{ needs.plan.outputs.preflight_functions_dependencies == 'true' }}
        run: npm --prefix functions ci --ignore-scripts
      - name: Execute complete source and generation preflight
        env:
          BASE_SHA: ${{ needs.plan.outputs.base_sha }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          MODE: ${{ needs.plan.outputs.mode }}
          FULL: ${{ needs.plan.outputs.full }}
          COMMIT_WINDOW: ${{ needs.plan.outputs.commit_window }}
        run: |
          set -euo pipefail
          args=(--preflight --base "$BASE_SHA" --head "$SOURCE_SHA" --mode "$MODE" --json)
          [[ "$FULL" != true ]] || args+=(--full)
          [[ "$COMMIT_WINDOW" != true ]] || args+=(--commit-window)
          mkdir -p build/ci
          node tool/harness/verify_local.mjs "${args[@]}" > build/ci/source-preflight.json
      - name: Retain preflight findings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: source-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci/source-preflight.json
          if-no-files-found: error
          retention-days: 7

  tools:
    needs: [plan, source-preflight, capture-freshness]
    if: >-
      ${{ !cancelled() && needs.source-preflight.result == 'success' &&
          needs.plan.outputs.producer_attempt == format('{0}', github.run_attempt) &&
          needs.plan.outputs.tools == 'true' && !needs.plan.outputs.queue_verified_run &&
          (needs.capture-freshness.result == 'success' || needs.capture-freshness.result == 'skipped') }}
    uses: ./.github/workflows/tools-ci.yml
    with:
      base_sha: ${{ needs.plan.outputs.base_sha }}
      mode: ${{ needs.plan.outputs.mode }}
      full: ${{ needs.plan.outputs.full == 'true' }}
      commit_window: ${{ needs.plan.outputs.commit_window == 'true' }}
      marketing_checks_in_react: ${{ needs.plan.outputs.marketing == 'true' }}
      capture_binding: ${{ needs.capture-freshness.outputs.capture_binding }}
    secrets: inherit

  contracts:
    needs: [plan, source-preflight]
    if: ${{ needs.plan.outputs.producer_attempt == format('{0}', github.run_attempt) && needs.plan.outputs.contracts == 'true' }}
    uses: ./.github/workflows/contracts-ci.yml
    secrets: inherit

  functions:
    needs: [plan, source-preflight]
    if: ${{ needs.plan.outputs.producer_attempt == format('{0}', github.run_attempt) && needs.plan.outputs.functions == 'true' }}
    uses: ./.github/workflows/functions-ci.yml
    secrets: inherit

  firestore-rules:
    needs: [plan, source-preflight]
    if: >-
      !cancelled() && !failure() &&
      !(github.event_name == 'pull_request' && github.event.pull_request.draft) &&
      needs.plan.result != 'failure' && needs.plan.result != 'cancelled' &&
      needs.source-preflight.result != 'failure' && needs.source-preflight.result != 'cancelled' &&
      (needs.plan.outputs.producer_attempt != format('{0}', github.run_attempt) ||
       needs.plan.outputs.source_sha != github.sha ||
       (needs.plan.result == 'success' &&
        needs.source-preflight.result == 'success' &&
        needs.plan.outputs.firestore_rules == 'true'))
    uses: ./.github/workflows/firestore-rules-ci.yml
    with:
      ci_plan_attempt: ${{ needs.plan.outputs.producer_attempt }}
      ci_plan_source_sha: ${{ needs.plan.outputs.source_sha }}
      base_sha: ${{ needs.plan.outputs.base_sha }}
      mode: ${{ needs.plan.outputs.mode }}
    secrets: inherit

  flutter:
    needs: [plan, source-preflight]
    if: ${{ needs.plan.outputs.producer_attempt == format('{0}', github.run_attempt) && needs.plan.outputs.flutter == 'true' && !needs.plan.outputs.queue_verified_run }}
    uses: ./.github/workflows/flutter-ci.yml
    with:
      base_sha: ${{ needs.plan.outputs.base_sha }}
      full: ${{ needs.plan.outputs.full == 'true' }}
      commit_window: ${{ needs.plan.outputs.commit_window == 'true' }}
      ui_lint_smoke_in_tools: ${{ needs.plan.outputs.tools_owns_ui_lint_smoke == 'true' }}
      design_parity_in_tools: ${{ needs.plan.outputs.tools_owns_design_parity == 'true' }}
      design_handoff_in_tools: ${{ needs.plan.outputs.tools_owns_design_handoff == 'true' }}
    secrets: inherit

  visual-integration:
    needs: [plan, source-preflight]
    if: ${{ needs.plan.outputs.producer_attempt == format('{0}', github.run_attempt) && needs.plan.outputs.visual_integration == 'true' && !needs.plan.outputs.queue_verified_run }}
    uses: ./.github/workflows/visual-integration-ci.yml
    secrets: inherit

  admin:
    needs: [plan, source-preflight]
    if: ${{ needs.plan.outputs.producer_attempt == format('{0}', github.run_attempt) && needs.plan.outputs.admin == 'true' && !needs.plan.outputs.queue_verified_run }}
    uses: ./.github/workflows/react-surface-validation.yml
    with:
      surface: admin
    secrets: inherit

  marketing:
    needs: [plan, source-preflight, capture-freshness]
    if: ${{ needs.plan.outputs.producer_attempt == format('{0}', github.run_attempt) && needs.plan.outputs.marketing == 'true' }}
    uses: ./.github/workflows/react-surface-validation.yml
    with:
      surface: marketing
      capture_binding: ${{ needs.capture-freshness.outputs.capture_binding }}
    secrets: inherit

  capture-freshness:
    needs: [plan, source-preflight]
    if: ${{ needs.plan.outputs.producer_attempt == format('{0}', github.run_attempt) && (needs.plan.outputs.capture_freshness == 'true' || needs.plan.outputs.marketing == 'true') }}
    uses: ./.github/workflows/marketing-captures.yml
    with:
      automatic_source_sha: ${{ needs.plan.outputs.source_sha }}

  operations:
    needs: [plan, source-preflight]
    if: ${{ needs.plan.outputs.producer_attempt == format('{0}', github.run_attempt) && needs.plan.outputs.operations == 'true' && !needs.plan.outputs.queue_verified_run }}
    uses: ./.github/workflows/operations-ci.yml
    secrets: inherit

  docs-policy:
    needs: [plan, source-preflight]
    if: >-
      needs.plan.outputs.producer_attempt == format('{0}', github.run_attempt) &&
      (needs.plan.outputs.docs == 'true' ||
       needs.plan.outputs.policy_docs == 'true') &&
      !needs.plan.outputs.queue_verified_run
    runs-on: ubuntu-latest
    # A policy-doc change needs the complete history for Git-backed metadata
    # validation. Full checkout is normally fast, but a three-minute action
    # budget caused an otherwise healthy PR to fail before either policy check
    # began. Keep the lane bounded while leaving time for its actual checks.
    timeout-minutes: 20
    steps:
      - name: Decode graph-projected docs checkout
        id: docs-checkout
        if: >-
          needs.plan.outputs.docs == 'true' &&
          needs.plan.outputs.policy_docs != 'true' &&
          fromJSON(needs.plan.outputs.docs_checkout).mode == 'sparse'
        env:
          DOCS_CHECKOUT: ${{ needs.plan.outputs.docs_checkout }}
        run: |
          set -euo pipefail
          jq -e '
            .mode == "sparse" and
            (.fetchDepth | type == "number") and
            (.coneMode | type == "boolean") and
            (.timeoutMinutes | type == "number") and
            (.paths | type == "array") and
            (.paths | length > 0)
          ' <<< "$DOCS_CHECKOUT" > /dev/null
          delimiter="__CATCH_DOC_CHECKOUT_PATHS__"
          if jq -e --arg delimiter "$delimiter" 'any(.paths[]; . == $delimiter)' \
            <<< "$DOCS_CHECKOUT" > /dev/null; then
            echo "Checkout path collides with the output delimiter."
            exit 64
          fi
          {
            echo "paths<<$delimiter"
            jq -er '.paths[]' <<< "$DOCS_CHECKOUT"
            echo "$delimiter"
            echo "fetch_depth=$(jq -er '.fetchDepth' <<< "$DOCS_CHECKOUT")"
            echo "cone_mode=$(jq -r '.coneMode | tostring' <<< "$DOCS_CHECKOUT")"
            echo "timeout_minutes=$(jq -er '.timeoutMinutes' <<< "$DOCS_CHECKOUT")"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout ordinary-doc closure
        if: ${{ steps.docs-checkout.outcome == 'success' }}
        uses: actions/checkout@v6
        # Supplying sparse-checkout to checkout also enables blob:none. The
        # offline metadata scanner needs current and historical document blobs.
        timeout-minutes: 10
        with:
          fetch-depth: ${{ steps.docs-checkout.outputs.fetch_depth }}

      - name: Apply ordinary-doc working-tree closure
        if: ${{ steps.docs-checkout.outcome == 'success' }}
        env:
          DOCS_CHECKOUT_PATHS: ${{ steps.docs-checkout.outputs.paths }}
          DOCS_CHECKOUT_CONE_MODE: ${{ steps.docs-checkout.outputs.cone_mode }}
        run: |
          set -euo pipefail
          case "$DOCS_CHECKOUT_CONE_MODE" in
            true) cone_flag=--cone ;;
            false) cone_flag=--no-cone ;;
            *) echo "Invalid docs checkout cone mode."; exit 64 ;;
          esac
          printf '%s\n' "$DOCS_CHECKOUT_PATHS" | git sparse-checkout set "$cone_flag" --stdin

      - name: Checkout full policy closure
        if: >-
          needs.plan.outputs.policy_docs == 'true' ||
          fromJSON(needs.plan.outputs.docs_checkout).mode == 'full'
        uses: actions/checkout@v6
        timeout-minutes: 10
        with:
          fetch-depth: 0
      - name: Load Harness toolchain
        if: ${{ needs.plan.outputs.policy_docs == 'true' && needs.plan.outputs.tools != 'true' }}
        id: policy-toolchain
        uses: ./.github/actions/load-toolchain
      - name: Set up Harness Node.js
        if: ${{ needs.plan.outputs.policy_docs == 'true' && needs.plan.outputs.tools != 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.policy-toolchain.outputs.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Harness test dependencies
        if: ${{ needs.plan.outputs.policy_docs == 'true' && needs.plan.outputs.tools != 'true' }}
        run: npm ci --ignore-scripts --workspaces=false
      - name: Check source-owned document metadata
        env:
          BASE_SHA: ${{ needs.plan.outputs.base_sha }}
        run: node tool/docs/check_doc_metadata.mjs --base "$BASE_SHA"
      - name: Check agent policy enforcement
        if: ${{ needs.plan.outputs.policy_docs == 'true' }}
        run: node tool/run.mjs check meta:enforcement-integrity
      - name: Validate CI wiring in the policy lane
        if: ${{ needs.plan.outputs.policy_docs == 'true' && needs.plan.outputs.tools != 'true' }}
        run: node tool/run.mjs check agent:harness-v2

  app-builds:
    needs: [plan, source-preflight]
    if: >-
      needs.plan.outputs.producer_attempt == format('{0}', github.run_attempt) &&
      (needs.plan.outputs.flutter_build_android == 'true' ||
       needs.plan.outputs.flutter_build_ios == 'true' ||
       needs.plan.outputs.flutter_build_web == 'true' ||
       needs.plan.outputs.flutter_web_smoke == 'true')
    uses: ./.github/workflows/app-build-matrix.yml
    with:
      app_roles: ${{ needs.plan.outputs.app_roles }}
      build_android: ${{ needs.plan.outputs.flutter_build_android == 'true' }}
      build_ios: ${{ needs.plan.outputs.flutter_build_ios == 'true' }}
      build_web: ${{ needs.plan.outputs.flutter_build_web == 'true' }}
      web_smoke: ${{ needs.plan.outputs.flutter_web_smoke == 'true' }}
    secrets: inherit

  finalize-plan:
    name: Finalize the ordered delivery plan
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.plan.result == 'success' &&
      needs.plan.outputs.producer_attempt == format('{0}', github.run_attempt) &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    needs:
      - plan
      - source-preflight
      - tools
      - contracts
      - functions
      - firestore-rules
      - flutter
      - visual-integration
      - admin
      - marketing
      - capture-freshness
      - operations
      - docs-policy
      - app-builds
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      base_sha: ${{ steps.finalize.outputs.base_sha }}
      deploy_groups: ${{ steps.finalize.outputs.deploy_groups }}
      deploy_required: ${{ steps.finalize.outputs.deploy_required }}
    steps:
      - name: Checkout the validated source and history
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
      - id: toolchain
        uses: ./.github/actions/load-toolchain
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
      - name: Download this attempt's validation plan
        uses: actions/download-artifact@v7
        with:
          name: harness-validation-plan-${{ github.run_number }}-${{ github.run_id }}-${{ needs.plan.outputs.source_sha }}-${{ github.run_attempt }}
          path: build/ci/validation
      - id: finalize
        name: Prove validation coverage before ordered publication
        env:
          BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          FLUTTER_SELECTED: ${{ needs.plan.outputs.flutter }}
          QUEUE_RUN: ${{ needs.plan.outputs.queue_verified_run }}
        run: |
          set -euo pipefail
          printf '%s\n' "$NEEDS_JSON" > build/ci/validation-needs.json
          proof_args=(
            --validation-plan build/ci/validation/impact-plan.json
            --needs-json build/ci/validation-needs.json
            --source-sha "$SOURCE_SHA"
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          )
          [[ -z "${QUEUE_RUN:-}" ]] || proof_args+=(--queue-verified-run "$QUEUE_RUN")
          # Fail before waiting when a selected lane or this attempt's proof is missing.
          node tool/ci/finalize_ci_plan.mjs validate "${proof_args[@]}"
          validation_base_sha="$(jq -er '.baseSha' build/ci/validation/impact-plan.json)"
          baseline="$(node tool/ci/main_ci_baseline.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --source-sha "$SOURCE_SHA" --minimum-base-sha "$validation_base_sha" \
            --fallback-base "$BEFORE_SHA" --wait)"
          base_sha="$(jq -er '.baseSha' <<< "$baseline")"
          node tool/ci/finalize_ci_plan.mjs finalize "${proof_args[@]}" \
            --base-sha "$base_sha" --output build/ci/impact-plan.json \
            --github-output "$GITHUB_OUTPUT"
          # Removal/reintroduction can change these directional gates even
          # though the union of tested files and dependency closures is covered.
          node tool/docs/check_doc_metadata.mjs --base "$base_sha"
          if [[ "$FLUTTER_SELECTED" == "true" ]]; then
            node tool/design/check_new_widget_inventory.mjs --base "$base_sha" --check --no-write
          fi
      - name: Upload finalized planner evidence
        uses: actions/upload-artifact@v7
        with:
          name: harness-plan-${{ github.run_number }}-${{ github.run_id }}-${{ needs.plan.outputs.source_sha }}-${{ github.run_attempt }}
          path: build/ci/impact-plan.json
          if-no-files-found: error
          retention-days: 90

  package-firebase:
    name: Package approved Firebase backend
    if: >-
      !cancelled() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.plan.result == 'success' &&
      needs.plan.outputs.producer_attempt == format('{0}', github.run_attempt) &&
      needs.finalize-plan.result == 'success' &&
      needs.finalize-plan.outputs.deploy_required == 'true'
    needs:
      - plan
      - source-preflight
      - finalize-plan
      - tools
      - contracts
      - functions
      - firestore-rules
      - flutter
      - visual-integration
      - admin
      - marketing
      - capture-freshness
      - operations
      - docs-policy
      - app-builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require every selected validation lane
        env:
          DEPLOY_GROUPS: ${{ needs.finalize-plan.outputs.deploy_groups }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          failures="$(
            echo "$NEEDS_JSON" |
              jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"'
          )"
          if [[ -n "$failures" ]]; then
            echo "Selected CI lanes did not pass:"
            echo "$failures"
            exit 1
          fi

          jq -e '
            type == "array" and
            length > 0 and
            all(.[]; . == "functions" or
              . == "firestore-indexes" or
              . == "firestore-rules" or
              . == "storage-rules")
          ' <<< "$DEPLOY_GROUPS" > /dev/null
          while IFS=$'\t' read -r deploy_group validation_job; do
            result="$(jq -er --arg job "$validation_job" '.[$job].result' <<< "$NEEDS_JSON")"
            if [[ "$result" != "success" ]]; then
              echo "Deploy group $deploy_group requires $validation_job=success; got $result."
              exit 1
            fi
          done < <(
            jq -r '.[] |
              if . == "functions" then [. , "functions"]
              elif . == "firestore-indexes" then [. , "contracts"]
              elif . == "firestore-rules" or . == "storage-rules" then [. , "firestore-rules"]
              else error("unsupported Firebase deploy group")
              end | @tsv' <<< "$DEPLOY_GROUPS"
          )

      - name: Checkout the exact approved source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.source_sha }}

      - id: toolchain
        uses: ./.github/actions/load-toolchain

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Download the exact CI impact plan
        uses: actions/download-artifact@v7
        with:
          name: harness-plan-${{ github.run_number }}-${{ github.run_id }}-${{ needs.plan.outputs.source_sha }}-${{ github.run_attempt }}
          path: build/ci

      - name: Download the exact tested Functions build
        if: contains(fromJSON(needs.finalize-plan.outputs.deploy_groups), 'functions')
        uses: actions/download-artifact@v7
        with:
          name: functions-lib-${{ needs.plan.outputs.source_sha }}-${{ github.run_attempt }}
          path: build/ci/tested-functions-lib

      - id: package
        name: Package the exact CI plan and bounded Firebase backend
        env:
          BASE_SHA: ${{ needs.finalize-plan.outputs.base_sha }}
          CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          CI_RUN_ID: ${{ github.run_id }}
          DEPLOY_GROUPS: ${{ needs.finalize-plan.outputs.deploy_groups }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        run: |
          set -euo pipefail
          mkdir -p build/ci/firebase-delivery
          package_args=(
            prepare
            --impact-plan build/ci/impact-plan.json
            --source-sha "$SOURCE_SHA"
            --base-sha "$BASE_SHA"
            --ci-run-id "$CI_RUN_ID"
            --ci-run-attempt "$CI_RUN_ATTEMPT"
            --stage-dir build/ci/firebase-package
          )
          if jq -e 'index("functions") != null' <<< "$DEPLOY_GROUPS" > /dev/null; then
            package_args+=(--functions-lib-dir build/ci/tested-functions-lib)
          fi
          result="$(node tool/ci/package_firebase_delivery.mjs "${package_args[@]}")"
          stages="$(jq -er '.stages | join(",")' <<< "$result")"
          tar --sort=name --mtime='UTC 1970-01-01' \
            --owner=0 --group=0 --numeric-owner \
            -C build/ci/firebase-package \
            -czf build/ci/firebase-delivery/firebase-backend.tar.gz .
          node tool/ci/delivery_core.mjs manifest \
            --artifact build/ci/firebase-delivery/firebase-backend.tar.gz \
            --source-sha "$SOURCE_SHA" \
            --ci-run-id "$CI_RUN_ID" \
            --ci-run-attempt "$CI_RUN_ATTEMPT" \
            --stages "$stages" \
            --out build/ci/firebase-delivery/firebase-provenance.json

      - name: Upload immutable Firebase delivery package
        uses: actions/upload-artifact@v7
        with:
          name: firebase-delivery-${{ needs.plan.outputs.source_sha }}-${{ github.run_attempt }}
          path: build/ci/firebase-delivery
          if-no-files-found: error
          retention-days: 90

  required:
    name: Required CI
    # A draft cannot merge or enter the merge queue; it validates once ready.
    if: ${{ !cancelled() && !(github.event_name == 'pull_request' && github.event.pull_request.draft) }}
    needs:
      - plan
      - source-preflight
      - finalize-plan
      - tools
      - contracts
      - functions
      - firestore-rules
      - flutter
      - visual-integration
      - admin
      - marketing
      - capture-freshness
      - operations
      - docs-policy
      - app-builds
      - package-firebase
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require this attempt's planner
        env:
          PRODUCER_ATTEMPT: ${{ needs.plan.outputs.producer_attempt }}
        run: |
          set -euo pipefail
          if [[ ! "${PRODUCER_ATTEMPT:-}" =~ ^[1-9][0-9]*$ ||
                ! "${GITHUB_RUN_ATTEMPT:-}" =~ ^[1-9][0-9]*$ ||
                "$PRODUCER_ATTEMPT" != "$GITHUB_RUN_ATTEMPT" ]]; then
            echo 'This CI attempt has no matching planner execution. Use Re-run all jobs; partial retries cannot reuse an older plan.'
            exit 64
          fi
      - id: artifact_guard
        name: Require every selected lane
        env:
          DEPLOY_REQUIRED: ${{ needs.finalize-plan.outputs.deploy_required || needs.plan.outputs.deploy_required }}
          EVENT_NAME: ${{ github.event_name }}
          QUEUE_RUN: ${{ needs.plan.outputs.queue_verified_run }}
          GH_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        run: |
          set -euo pipefail
          failures="$(
            echo "$NEEDS_JSON" |
              jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"'
          )"
          if [[ -n "$failures" ]]; then
            echo "Selected CI lanes did not pass:"
            echo "$failures"
            exit 1
          fi
          test "$(jq -er '.plan.result' <<< "$NEEDS_JSON")" = success
          test "$(jq -er '.["source-preflight"].result' <<< "$NEEDS_JSON")" = success
          # Selection only counts when its owning job actually succeeded.
          jq -e --arg queue "${QUEUE_RUN:-}" '
            . as $needs |
            # Pure-validation lanes the merge queue proved on this exact source.
            ["admin", "docs", "flutter", "operations", "policy_docs", "tools", "visual_integration"] as $reusable |
            {admin: "admin", capture_freshness: "capture-freshness", contracts: "contracts",
             docs: "docs-policy", policy_docs: "docs-policy", firestore_rules: "firestore-rules",
             flutter: "flutter", functions: "functions", marketing: "marketing",
             operations: "operations", tools: "tools", visual_integration: "visual-integration",
             flutter_build_android: "app-builds", flutter_build_ios: "app-builds",
             flutter_build_web: "app-builds", flutter_web_smoke: "app-builds"} |
            to_entries | all(.[];
              . as $lane | $needs.plan.outputs[$lane.key] as $selected |
              if $selected == "false" then true
              elif $selected == "true" and $needs[$lane.value].result == "success" then true
              elif $selected == "true" and $queue != "" and ($reusable | index($lane.key)) != null and
                $needs[$lane.value].result == "skipped" then true
              else error("Selected lane " + $lane.key + " lacks successful execution or selection output")
              end)
          ' <<< "$NEEDS_JSON" > /dev/null
          if [[ "$EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            test "$(jq -er '.["finalize-plan"].result' <<< "$NEEDS_JSON")" = success
          fi
          if [[ "$DEPLOY_REQUIRED" == "true" ]]; then
            package_result="$(jq -er '.["package-firebase"].result' <<< "$NEEDS_JSON")"
            if [[ "$package_result" != "success" ]]; then
              echo "Backend delivery was authorized but package-firebase=$package_result."
              exit 1
            fi
          fi
          if [[ "$EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            artifact_pages="$(gh api --paginate --slurp \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100")"
            plan_name="harness-plan-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ID}-${SOURCE_SHA}-${GITHUB_RUN_ATTEMPT}"
            plan_count="$(jq -r --arg name "$plan_name" \
              '[.[].artifacts[] | select(.expired == false and .name == $name)] | length' \
              <<< "$artifact_pages")"
            if [[ "$plan_count" != "1" ]]; then
              echo "This main CI attempt does not own exactly one $plan_name artifact. GitHub reused successful jobs from an older attempt; use Re-run all jobs."
              exit 64
            fi
            plan_artifact="$(jq -c --arg name "$plan_name" \
              '[.[].artifacts[] | select(.expired == false and .name == $name)][0]' \
              <<< "$artifact_pages")"
            plan_artifact_id="$(jq -er '.id' <<< "$plan_artifact")"
            plan_artifact_digest="$(jq -er '.digest' <<< "$plan_artifact")"
            [[ "$plan_artifact_id" =~ ^[1-9][0-9]*$ ]]
            [[ "$plan_artifact_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            echo "plan_artifact_id=$plan_artifact_id" >> "$GITHUB_OUTPUT"
            echo "plan_artifact_digest=$plan_artifact_digest" >> "$GITHUB_OUTPUT"
            if [[ "$DEPLOY_REQUIRED" == "true" ]]; then
              package_name="firebase-delivery-${SOURCE_SHA}-${GITHUB_RUN_ATTEMPT}"
              package_count="$(jq -r --arg name "$package_name" \
                '[.[].artifacts[] | select(.expired == false and .name == $name)] | length' \
                <<< "$artifact_pages")"
              if [[ "$package_count" != "1" ]]; then
                echo "This main CI attempt does not own exactly one $package_name artifact. GitHub reused successful jobs from an older attempt; use Re-run all jobs."
                exit 64
              fi
              package_artifact="$(jq -c --arg name "$package_name" \
                '[.[].artifacts[] | select(.expired == false and .name == $name)][0]' \
                <<< "$artifact_pages")"
              package_artifact_id="$(jq -er '.id' <<< "$package_artifact")"
              package_artifact_digest="$(jq -er '.digest' <<< "$package_artifact")"
              [[ "$package_artifact_id" =~ ^[1-9][0-9]*$ ]]
              [[ "$package_artifact_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
              echo "package_artifact_id=$package_artifact_id" >> "$GITHUB_OUTPUT"
              echo "package_artifact_digest=$package_artifact_digest" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "Every selected CI lane passed; unaffected lanes were explicitly skipped."

      - id: authority
        name: Write the immutable successful-attempt authority
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          DEPLOY_REQUIRED: ${{ needs.finalize-plan.outputs.deploy_required || needs.plan.outputs.deploy_required }}
          GH_TOKEN: ${{ github.token }}
          PACKAGE_ARTIFACT_DIGEST: ${{ steps.artifact_guard.outputs.package_artifact_digest }}
          PACKAGE_ARTIFACT_ID: ${{ steps.artifact_guard.outputs.package_artifact_id }}
          PLAN_ARTIFACT_DIGEST: ${{ steps.artifact_guard.outputs.plan_artifact_digest }}
          PLAN_ARTIFACT_ID: ${{ steps.artifact_guard.outputs.plan_artifact_id }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        run: |
          set -euo pipefail
          mkdir -p build/ci/authority
          current_attempt="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT")"
          source_ci_workflow_id="$(jq -er \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg source_sha "$SOURCE_SHA" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            --argjson run_number "$GITHUB_RUN_NUMBER" '
              select(
                (.id | tostring) == $run_id and
                .run_attempt == $run_attempt and
                .run_number == $run_number and
                .head_sha == $source_sha and
                .name == "CI" and
                (.path | split("@")[0]) == ".github/workflows/ci.yml" and
                .event == "push" and
                .head_branch == "main" and
                .head_repository.full_name == $repository and
                (.workflow_id | type == "number" and . > 0 and floor == .)
              ) |
              .workflow_id
            ' <<< "$current_attempt")"
          [[ "$source_ci_workflow_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$PLAN_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$PLAN_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          plan_artifact="harness-plan-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ID}-${SOURCE_SHA}-${GITHUB_RUN_ATTEMPT}"
          package_artifact_json=null
          if [[ "$DEPLOY_REQUIRED" == "true" ]]; then
            [[ "$PACKAGE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$PACKAGE_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
            package_artifact="firebase-delivery-${SOURCE_SHA}-${GITHUB_RUN_ATTEMPT}"
            package_artifact_json="$(jq -n \
              --arg digest "$PACKAGE_ARTIFACT_DIGEST" \
              --arg name "$package_artifact" \
              --argjson id "$PACKAGE_ARTIFACT_ID" \
              '{id: $id, name: $name, digest: $digest}')"
          fi
          jq -n \
            --arg deployRequired "$DEPLOY_REQUIRED" \
            --arg planArtifactDigest "$PLAN_ARTIFACT_DIGEST" \
            --arg planArtifactName "$plan_artifact" \
            --arg sourceCiRunAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg sourceCiRunId "$GITHUB_RUN_ID" \
            --arg sourceSha "$SOURCE_SHA" \
            --argjson packageArtifact "$package_artifact_json" \
            --argjson planArtifactId "$PLAN_ARTIFACT_ID" \
            --argjson sourceCiWorkflowId "$source_ci_workflow_id" \
            --argjson sourceCiRunNumber "$GITHUB_RUN_NUMBER" '{
              schema: "catch.ci-delivery-authority/v3",
              sourceCiWorkflowId: $sourceCiWorkflowId,
              sourceCiRunNumber: $sourceCiRunNumber,
              sourceCiRunId: $sourceCiRunId,
              sourceCiRunAttempt: $sourceCiRunAttempt,
              sourceSha: $sourceSha,
              deployRequired: ($deployRequired == "true"),
              planArtifact: {
                id: $planArtifactId,
                name: $planArtifactName,
                digest: $planArtifactDigest
              },
              packageArtifact: $packageArtifact
            }' > build/ci/authority/ci-delivery-authority.json
          echo "source_ci_workflow_id=$source_ci_workflow_id" >> "$GITHUB_OUTPUT"

      - name: Upload the immutable successful-attempt authority
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v7
        with:
          name: harness-success-v3-${{ steps.authority.outputs.source_ci_workflow_id }}-${{ github.run_number }}-${{ github.run_id }}-${{ needs.plan.outputs.source_sha }}-${{ github.run_attempt }}
          path: build/ci/authority/ci-delivery-authority.json
          if-no-files-found: error
          retention-days: 90
