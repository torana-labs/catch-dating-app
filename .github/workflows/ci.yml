name: CI
# The nightly is titled "CI nightly": downstream workflows and tools tell it
# apart by that title (tool/ci/ci_nightly.mjs, isNightlyRun).
run-name: >-
  ${{ github.event_name == 'pull_request' && format('CI PR #{0}', github.event.pull_request.number) ||
  github.event_name == 'workflow_dispatch' && inputs.nightly && 'CI nightly' || 'CI' }}

# The nightly is a dispatch with `nightly` set: .github/workflows/ci-nightly.yml
# starts it once per UTC day (owner decision, 26 Nov 2026), and it runs every
# lane in full. Any other manual dispatch plans the head's own change unless
# `full` or `base_sha` is set. With `base_sha` it plans every commit from that ancestor to the head,
# as a main push does: the Website Release train dispatches it from the live
# commit, to validate the head it releases when no commit newer than live has
# website validation, without running lanes nothing since live touched.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
    inputs:
      nightly:
        description: The nightly (ci-nightly.yml sets it once a day); runs every lane in full and the nightly-only reports.
        required: false
        type: boolean
        default: false
      full:
        description: Run every validation lane regardless of changed paths.
        required: false
        type: boolean
        default: false
      base_sha:
        description: Plan every commit from this ancestor of the head (40-character SHA).
        required: false
        type: string
        default: ""

permissions:
  actions: read
  contents: read
  pull-requests: read
  issues: read

concurrency:
  # Every ready PR validates in parallel; a newer push or draft conversion
  # cancels that PR's older run. Merge-queue groups key on their exact head.
  # Main pushes share one group but never cancel a run that has started:
  # GitHub keeps the running main run and one pending run, and a newer merge
  # replaces only the pending one (owner decision, 12 Nov 2026). The run that
  # replaced it plans from the newest earlier main run that ran
  # (tool/ci/main_push_base.mjs), so every commit on main is validated by a
  # finished run and none is skipped. The setting in the newer commit's
  # workflow decides, so turning cancellation off cancels nothing.
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'push' && github.ref || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    # Drafts are not ready for review; marking one ready starts its validation.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    name: Plan affected targets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      admin: ${{ steps.plan.outputs.admin }}
      app_roles: ${{ steps.plan.outputs.app_roles }}
      capture_freshness: ${{ steps.plan.outputs.capture_freshness }}
      contracts: ${{ steps.plan.outputs.contracts }}
      preflight_functions_dependencies: ${{ steps.plan.outputs.preflight_functions_dependencies }}
      docs: ${{ steps.plan.outputs.docs }}
      docs_checkout: ${{ steps.plan.outputs.docs_checkout }}
      firestore_rules: ${{ steps.plan.outputs.firestore_rules }}
      flutter: ${{ steps.plan.outputs.flutter }}
      flutter_build_android: ${{ steps.plan.outputs.flutter_build_android }}
      flutter_build_ios: ${{ steps.plan.outputs.flutter_build_ios }}
      flutter_build_web: ${{ steps.plan.outputs.flutter_build_web }}
      flutter_web_smoke: ${{ steps.plan.outputs.flutter_web_smoke }}
      functions: ${{ steps.plan.outputs.functions }}
      marketing: ${{ steps.plan.outputs.marketing }}
      operations: ${{ steps.plan.outputs.operations }}
      policy_docs: ${{ steps.plan.outputs.policy_docs }}
      tools: ${{ steps.plan.outputs.tools }}
      visual_integration: ${{ steps.plan.outputs.visual_integration }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      producer_attempt: ${{ steps.plan.outputs.producer_attempt }}
      mode: ${{ steps.plan.outputs.mode }}
      full: ${{ steps.plan.outputs.full }}
      commit_window: ${{ steps.plan.outputs.commit_window }}
      tools_owns_ui_lint_smoke: ${{ steps.plan.outputs.tools_owns_ui_lint_smoke }}
      tools_owns_design_parity: ${{ steps.plan.outputs.tools_owns_design_parity }}
      queue_verified_run: ${{ steps.queue.outputs.run_id }}
      main_goldens: ${{ steps.main_macos.outputs.goldens }}
      main_captures: ${{ steps.main_macos.outputs.captures }}

    steps:
      - name: Checkout planner closure
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        timeout-minutes: 3
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tool/harness.mjs
            /tool/harness/verify_local.mjs
            /tool/harness/compare_selectors.mjs
            /tool/nx/select_lanes.mjs
            /tool/nx/shadow_plan.mjs
            /tool/nx/workflow_callers.mjs
            /tool/nx/manifest_diff.mjs
            /tool/ci/toolchain.env
            /tool/ci/main_push_base.mjs
            /tool/ci/main_push_queue_proof.mjs
            /tool/ci/main_macos_selection.mjs
            /tool/ci/ios_build_inputs.mjs
            /tool/harness/component_graph.json
            /tool/harness/lib/component_graph.mjs
            /tool/harness/lib/git_changes.mjs
            /tool/harness/lib/workflow_steps.mjs
            /tool/lib/path_glob.mjs
            /tool/lib/repo_paths.mjs
            /tool/lib/repository_snapshot.mjs
            /tool/lib/tool_impact.mjs
            /tool/lib/tool_manifest_rules.mjs
            /tool/lib/tool_platform.mjs
            /tool/lib/tools_manifest.mjs
            /tool/run.mjs
            /tool/manifest
            /.github/actions/load-toolchain/action.yml
            /tool/design/build_host_feature_responsibilities.mjs
            /design/features/host_feature_responsibilities.json
          persist-credentials: false

      - id: toolchain
        uses: ./.github/actions/load-toolchain
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}

      - id: queue
        name: Find the merge-queue validation of this exact source
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          # The merge queue validated this exact commit before main moved to
          # it, so main re-runs no validation lane: it only plans. The proof is
          # the queue run's Required CI job, not the run's conclusion, which
          # waits on reporting lanes. Any lookup failure keeps the full run.
          run_id="$(node tool/ci/main_push_queue_proof.mjs --sha "$SOURCE_SHA")" || run_id=""
          [[ -z "$run_id" || "$run_id" =~ ^[1-9][0-9]*$ ]] || run_id=""
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Merge-queue validation reused: ${run_id:-none}" >> "$GITHUB_STEP_SUMMARY"

      - id: main_macos
        name: Select main's macOS jobs from the queue's plan
        if: ${{ github.event_name == 'push' && steps.queue.outputs.run_id != '' }}
        env:
          BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
          QUEUE_RUN: ${{ steps.queue.outputs.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          # The merge queue no longer runs the macOS goldens or the capture
          # render (owner decision, 22 Nov 2026), so a main push it validated
          # runs them when a queue plan selected visual integration, or capture
          # freshness or marketing: this commit's, and that of every commit
          # whose own push run was replaced (the range from the same base the
          # plan step uses). Any failure to read one of them runs both; it
          # never skips them.
          if ! selected="$(node tool/ci/main_macos_selection.mjs --head "$SOURCE_SHA" --before "$BEFORE_SHA" \
            --run-id "$GITHUB_RUN_ID" --queue-run "$QUEUE_RUN")" ||
            ! grep -qx 'goldens=\(true\|false\)' <<< "$selected" ||
            ! grep -qx 'captures=\(true\|false\)' <<< "$selected"; then
            selected=$'goldens=true\ncaptures=true\nreason=selection_failed'
          fi
          grep -E '^(goldens|captures)=' <<< "$selected" >> "$GITHUB_OUTPUT"
          echo "macOS jobs on this main push (queue run $QUEUE_RUN): $(tr '\n' ' ' <<< "$selected")" >> "$GITHUB_STEP_SUMMARY"

      # Nx chooses the lanes for pull requests, queue groups and main pushes,
      # and reads the whole tree to do it. A main push the merge queue already
      # validated runs no lane: it keeps the sparse checkout and never installs
      # Nx. A main-mode dispatch (base_sha) plans like a main push.
      - name: Install Nx
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' || (github.event_name == 'push' && !steps.queue.outputs.run_id) || (github.event_name == 'workflow_dispatch' && inputs.base_sha != '') }}
        run: |
          git sparse-checkout disable
          npm ci --ignore-scripts --no-audit --no-fund

      - id: plan
        name: Resolve fail-closed impact plan
        env:
          BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REQUEST_FULL: ${{ inputs.nightly || inputs.full }}
          NIGHTLY: ${{ inputs.nightly || false }}
          DISPATCH_BASE_SHA: ${{ inputs.base_sha }}
          QUEUE_RUN: ${{ steps.queue.outputs.run_id }}
        run: |
          set -euo pipefail
          event_mode="pr"
          base_sha=""
          full_flag=()
          window_flag=()
          case "$EVENT_NAME" in
            pull_request)
              base_sha="$PR_BASE_SHA"
              ;;
            merge_group)
              event_mode="merge_group"
              base_sha="$MERGE_GROUP_BASE_SHA"
              ;;
            push)
              event_mode="main"
              # Plan from the newest earlier main run that ran, so the commits
              # of a replaced pending run are covered; nightly-full when unknown.
              main_base="$(node tool/ci/main_push_base.mjs --head "$HEAD_SHA" \
                --before "$BEFORE_SHA" --run-id "$GITHUB_RUN_ID")"
              base_sha="$(sed -n 's/^base_sha=//p' <<< "$main_base")"
              if [[ "$(sed -n 's/^full=//p' <<< "$main_base")" == "true" ]]; then
                # Full selection is the nightly mode's, as for the nightly.
                event_mode="nightly"
                base_sha="${HEAD_SHA}^"
                full_flag=(--full)
              else
                window_flag=(--commit-window)
              fi
              echo "Main push base: $base_sha ($(sed -n 's/^reason=//p' <<< "$main_base"))" >> "$GITHUB_STEP_SUMMARY"
              ;;
            workflow_dispatch)
              if [[ "$NIGHTLY" == "true" ]]; then
                # The nightly: every lane, in full.
                if [[ -n "${DISPATCH_BASE_SHA:-}" ]]; then
                  echo "nightly cannot combine with base_sha."
                  exit 64
                fi
                event_mode="nightly"
                base_sha="${HEAD_SHA}^"
                full_flag=(--full)
              elif [[ -n "${DISPATCH_BASE_SHA:-}" ]]; then
                # Plan the window from that ancestor, as a main push does.
                if [[ ! "$DISPATCH_BASE_SHA" =~ ^[0-9a-f]{40}$ || "$REQUEST_FULL" == "true" ]]; then
                  echo "base_sha must be a full commit SHA and cannot combine with full."
                  exit 64
                fi
                event_mode="main"
                base_sha="$DISPATCH_BASE_SHA"
                window_flag=(--commit-window)
              else
                event_mode="nightly"
                base_sha="${HEAD_SHA}^"
                if [[ "$REQUEST_FULL" == "true" ]]; then
                  full_flag=(--full)
                fi
              fi
              ;;
            *)
              echo "Unsupported CI event: $EVENT_NAME"
              exit 64
              ;;
          esac

          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            echo "Missing usable base SHA for $EVENT_NAME; refusing to broaden a non-nightly plan."
            exit 64
          fi
          # Scheduled/manual bases start as revision expressions. Bind every
          # downstream lane and artifact to the same immutable commit object.
          base_sha="$(git rev-parse --verify --end-of-options "${base_sha}^{commit}")"
          [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$event_mode" == "main" ]]; then
            git merge-base --is-ancestor "$base_sha" "$HEAD_SHA"
          fi

          mkdir -p build/ci
          node tool/harness/compare_selectors.mjs --base "$base_sha" --head "$HEAD_SHA" \
            --mode "$event_mode" > build/ci/selector-comparison.json

          node tool/harness/verify_local.mjs --preflight --allow-deferred \
            --base "$base_sha" --head "$HEAD_SHA" --mode "$event_mode" \
            "${full_flag[@]}" "${window_flag[@]}"

          mkdir -p build/ci
          node tool/harness.mjs plan \
            --base "$base_sha" \
            --head "$HEAD_SHA" \
            "${full_flag[@]}" "${window_flag[@]}" \
            --mode "$event_mode" \
            --github-output "$GITHUB_OUTPUT" \
            --json > build/ci/impact-plan.unbound.json
          jq \
            --arg baseSha "$base_sha" \
            --arg sourceSha "$HEAD_SHA" \
            --arg sourceCiRunId "$GITHUB_RUN_ID" \
            --arg sourceCiRunAttempt "$GITHUB_RUN_ATTEMPT" \
            '. + {
              baseSha: $baseSha,
              sourceSha: $sourceSha,
              sourceCiRunId: $sourceCiRunId,
              sourceCiRunAttempt: $sourceCiRunAttempt
            }' \
            build/ci/impact-plan.unbound.json > build/ci/impact-plan.json
          rm build/ci/impact-plan.unbound.json
          node tool/harness/compare_selectors.mjs --verify-plan build/ci/impact-plan.json \
            --comparison build/ci/selector-comparison.json --github-output "$GITHUB_OUTPUT"
          queue_flag=()
          if [[ -n "${QUEUE_RUN:-}" ]]; then
            queue_flag=(--queue-verified "$QUEUE_RUN")
          fi
          node tool/nx/select_lanes.mjs --plan build/ci/impact-plan.json --base "$base_sha" --head "$HEAD_SHA" \
            "${queue_flag[@]}" --github-output "$GITHUB_OUTPUT"
          {
            echo "base_sha=$base_sha"
            echo "source_sha=$HEAD_SHA"
            echo "producer_attempt=$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {toolsOwnUiLintSmoke, toolsOwnDesignChecks} from './tool/lib/tool_impact.mjs';
          import {loadToolsManifest} from './tool/lib/tools_manifest.mjs';
          const read = (file) => JSON.parse(fs.readFileSync(file, 'utf8'));
          const manifest = loadToolsManifest();
          const owned = toolsOwnUiLintSmoke({
            plan: read('build/ci/impact-plan.json'),
            manifest,
            componentGraph: read('tool/harness/component_graph.json'),
          });
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tools_owns_ui_lint_smoke=${owned}\n`);
          const design = toolsOwnDesignChecks({
            plan: read('build/ci/impact-plan.json'), manifest,
            componentGraph: read('tool/harness/component_graph.json'),
          });
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            `tools_owns_design_parity=${design.parity}\n`);
          NODE

      - name: Report Audience documentation impact
        env:
          BASE_SHA: ${{ steps.plan.outputs.base_sha }}
        run: |
          node tool/design/build_host_feature_responsibilities.mjs \
            --affected audience --base "$BASE_SHA" --json \
            > build/ci/audience-doc-impact.json
          {
            echo "## Audience documentation review"
            jq -r '.coverage,
              (.sections[] | "- " + .anchor + ": " + .status +
                "; changed sources: " + (.changedSources | join(", "))),
              (.changedReferenceSources[] | "- Regenerate schema reference: " + .),
              (if .referenceDefinitionChanged then "- Schema reference selection changed." else empty end),
              (if (.sections | length) == 0 then "No affected explanations in declared dependencies." else empty end)
            ' build/ci/audience-doc-impact.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Audience documentation advice
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audience-doc-impact-${{ github.run_number }}-${{ github.run_id }}-${{ steps.plan.outputs.source_sha }}-${{ github.run_attempt }}
          path: build/ci/audience-doc-impact.json
          if-no-files-found: error
          retention-days: 7

      - name: Publish impact summary
        run: |
          {
            echo "## Harness v2 affected plan"
            echo
            echo '```json'
            jq . build/ci/impact-plan.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload planner evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harness-plan-${{ github.run_number }}-${{ github.run_id }}-${{ steps.plan.outputs.source_sha }}-${{ github.run_attempt }}
          path: build/ci/impact-plan.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload selector comparison
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selector-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci/selector-comparison.json
          if-no-files-found: error
          retention-days: 7

  source-preflight:
    name: Complete source preflight
    needs: plan
    if: ${{ needs.plan.outputs.producer_attempt == format('{0}', github.run_attempt) && !needs.plan.outputs.queue_verified_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: toolchain
        uses: ./.github/actions/load-toolchain
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
      - name: Derive exact-source route and widget inventories
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        run: node tool/ci/generated_inventories.mjs --source-sha "$SOURCE_SHA"
      - run: npm ci
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      - name: Install selected contract generator dependencies
        if: ${{ needs.plan.outputs.preflight_functions_dependencies == 'true' }}
        run: npm --prefix functions ci --ignore-scripts
      - uses: ./.github/actions/generate-contracts
      - name: Execute complete source and generation preflight
        # Sprint floor: structural and freshness findings report, they do not block.
        continue-on-error: true
        env:
          BASE_SHA: ${{ needs.plan.outputs.base_sha }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          MODE: ${{ needs.plan.outputs.mode }}
          FULL: ${{ needs.plan.outputs.full }}
          COMMIT_WINDOW: ${{ needs.plan.outputs.commit_window }}
        run: |
          set -euo pipefail
          args=(--preflight --base "$BASE_SHA" --head "$SOURCE_SHA" --mode "$MODE" --json)
          [[ "$FULL" != true ]] || args+=(--full)
          [[ "$COMMIT_WINDOW" != true ]] || args+=(--commit-window)
          mkdir -p build/ci
          node tool/harness/verify_local.mjs "${args[@]}" > build/ci/source-preflight.json
      - name: Retain preflight findings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci/source-preflight.json
          if-no-files-found: error
          retention-days: 7

  tools:
    needs: [plan]
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' &&
          needs.plan.outputs.producer_attempt == format('{0}', github.run_attempt) &&
          needs.plan.outputs.tools == 'true' && !needs.plan.outputs.queue_verified_run }}
    uses: ./.github/workflows/tools-ci.yml
    with:
      base_sha: ${{ needs.plan.outputs.base_sha }}
      mode: ${{ needs.plan.outputs.mode }}
      full: ${{ needs.plan.outputs.full == 'true' }}
      commit_window: ${{ needs.plan.outputs.commit_window == 'true' }}
      marketing_checks_in_react: ${{ needs.plan.outputs.marketing == 'true' }}
      visual_report: ${{ github.event_name == 'workflow_dispatch' && (inputs.nightly || inputs.full) }}

  contracts:
    needs: [plan]
    if: ${{ needs.plan.outputs.producer_attempt == format('{0}', github.run_attempt) && needs.plan.outputs.contracts == 'true' && !needs.plan.outputs.queue_verified_run }}
    uses: ./.github/workflows/contracts-ci.yml

  functions:
    needs: [plan]
    if: ${{ needs.plan.outputs.producer_attempt == format('{0}', github.run_attempt) && needs.plan.outputs.functions == 'true' && !needs.plan.outputs.queue_verified_run }}
    uses: ./.github/workflows/functions-ci.yml
    with:
      base_sha: ${{ needs.plan.outputs.base_sha }}
      mode: ${{ needs.plan.outputs.mode }}

  firestore-rules:
    needs: [plan]
    if: >-
      !cancelled() && !failure() &&
      !(github.event_name == 'pull_request' && github.event.pull_request.draft) &&
      needs.plan.result != 'failure' && needs.plan.result != 'cancelled' &&
      (needs.plan.outputs.producer_attempt != format('{0}', github.run_attempt) ||
       needs.plan.outputs.source_sha != github.sha ||
       (needs.plan.result == 'success' &&
        needs.plan.outputs.firestore_rules == 'true' &&
        !needs.plan.outputs.queue_verified_run))
    uses: ./.github/workflows/firestore-rules-ci.yml
    with:
      ci_plan_attempt: ${{ needs.plan.outputs.producer_attempt }}
      ci_plan_source_sha: ${{ needs.plan.outputs.source_sha }}
      base_sha: ${{ needs.plan.outputs.base_sha }}
      mode: ${{ needs.plan.outputs.mode }}

  flutter:
    needs: [plan]
    if: ${{ needs.plan.outputs.producer_attempt == format('{0}', github.run_attempt) && needs.plan.outputs.flutter == 'true' && !needs.plan.outputs.queue_verified_run }}
    uses: ./.github/workflows/flutter-ci.yml
    with:
      base_sha: ${{ needs.plan.outputs.base_sha }}
      full: ${{ needs.plan.outputs.full == 'true' }}
      commit_window: ${{ needs.plan.outputs.commit_window == 'true' }}
      ui_lint_smoke_in_tools: ${{ needs.plan.outputs.tools_owns_ui_lint_smoke == 'true' }}
      design_parity_in_tools: ${{ needs.plan.outputs.tools_owns_design_parity == 'true' }}

  # A main push the merge queue validated still runs the macOS goldens the
  # queue no longer runs, when the queue's plan selected this lane.
  visual-integration:
    needs: [plan]
    if: ${{ needs.plan.outputs.producer_attempt == format('{0}', github.run_attempt) && ((needs.plan.outputs.visual_integration == 'true' && !needs.plan.outputs.queue_verified_run) || needs.plan.outputs.main_goldens == 'true') }}
    uses: ./.github/workflows/visual-integration-ci.yml
    with:
      macos_only: ${{ needs.plan.outputs.queue_verified_run != '' }}

  admin:
    needs: [plan]
    if: ${{ needs.plan.outputs.producer_attempt == format('{0}', github.run_attempt) && needs.plan.outputs.admin == 'true' && !needs.plan.outputs.queue_verified_run }}
    uses: ./.github/workflows/react-surface-validation.yml
    with:
      surface: admin
      # The nightly (dispatched by ci-nightly.yml or the Scheduled run watchdog) or a full dispatch.
      visual_report: ${{ github.event_name == 'workflow_dispatch' && (inputs.nightly || inputs.full) }}

  marketing:
    needs: [plan, capture-freshness]
    if: ${{ needs.plan.outputs.producer_attempt == format('{0}', github.run_attempt) && needs.plan.outputs.marketing == 'true' && !needs.plan.outputs.queue_verified_run }}
    uses: ./.github/workflows/react-surface-validation.yml
    with:
      surface: marketing
      # The nightly (dispatched by ci-nightly.yml or the Scheduled run watchdog) or a full dispatch.
      visual_report: ${{ github.event_name == 'workflow_dispatch' && (inputs.nightly || inputs.full) }}
      capture_binding: ${{ needs.capture-freshness.outputs.capture_binding }}
      capture_result: ${{ needs.capture-freshness.result }}

  # A main push the merge queue validated renders the captures the queue no
  # longer renders, when the queue's plan selected capture freshness or marketing.
  capture-freshness:
    needs: [plan]
    if: ${{ needs.plan.outputs.producer_attempt == format('{0}', github.run_attempt) && (((needs.plan.outputs.capture_freshness == 'true' || needs.plan.outputs.marketing == 'true') && !needs.plan.outputs.queue_verified_run) || needs.plan.outputs.main_captures == 'true') }}
    uses: ./.github/workflows/marketing-captures.yml
    with:
      automatic_source_sha: ${{ needs.plan.outputs.source_sha }}
      nightly: ${{ github.event_name == 'workflow_dispatch' && inputs.nightly }}

  operations:
    needs: [plan]
    if: ${{ needs.plan.outputs.producer_attempt == format('{0}', github.run_attempt) && needs.plan.outputs.operations == 'true' && !needs.plan.outputs.queue_verified_run }}
    uses: ./.github/workflows/operations-ci.yml

  docs-policy:
    needs: [plan]
    if: >-
      needs.plan.outputs.producer_attempt == format('{0}', github.run_attempt) &&
      (needs.plan.outputs.docs == 'true' ||
       needs.plan.outputs.policy_docs == 'true') &&
      !needs.plan.outputs.queue_verified_run
    runs-on: ubuntu-latest
    # A policy-doc change needs the complete history for Git-backed metadata
    # validation. Full checkout is normally fast, but a three-minute action
    # budget caused an otherwise healthy PR to fail before either policy check
    # began. Keep the lane bounded while leaving time for its actual checks.
    timeout-minutes: 20
    steps:
      - name: Decode graph-projected docs checkout
        id: docs-checkout
        if: >-
          needs.plan.outputs.docs == 'true' &&
          needs.plan.outputs.policy_docs != 'true' &&
          fromJSON(needs.plan.outputs.docs_checkout).mode == 'sparse'
        env:
          DOCS_CHECKOUT: ${{ needs.plan.outputs.docs_checkout }}
        run: |
          set -euo pipefail
          jq -e '
            .mode == "sparse" and
            (.fetchDepth | type == "number") and
            (.coneMode | type == "boolean") and
            (.timeoutMinutes | type == "number") and
            (.paths | type == "array") and
            (.paths | length > 0)
          ' <<< "$DOCS_CHECKOUT" > /dev/null
          delimiter="__CATCH_DOC_CHECKOUT_PATHS__"
          if jq -e --arg delimiter "$delimiter" 'any(.paths[]; . == $delimiter)' \
            <<< "$DOCS_CHECKOUT" > /dev/null; then
            echo "Checkout path collides with the output delimiter."
            exit 64
          fi
          {
            echo "paths<<$delimiter"
            jq -er '.paths[]' <<< "$DOCS_CHECKOUT"
            echo "$delimiter"
            echo "fetch_depth=$(jq -er '.fetchDepth' <<< "$DOCS_CHECKOUT")"
            echo "cone_mode=$(jq -r '.coneMode | tostring' <<< "$DOCS_CHECKOUT")"
            echo "timeout_minutes=$(jq -er '.timeoutMinutes' <<< "$DOCS_CHECKOUT")"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout ordinary-doc closure
        if: ${{ steps.docs-checkout.outcome == 'success' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        # Supplying sparse-checkout to checkout also enables blob:none. The
        # offline metadata scanner needs current and historical document blobs.
        timeout-minutes: 10
        with:
          fetch-depth: ${{ steps.docs-checkout.outputs.fetch_depth }}
          persist-credentials: false

      - name: Apply ordinary-doc working-tree closure
        if: ${{ steps.docs-checkout.outcome == 'success' }}
        env:
          DOCS_CHECKOUT_PATHS: ${{ steps.docs-checkout.outputs.paths }}
          DOCS_CHECKOUT_CONE_MODE: ${{ steps.docs-checkout.outputs.cone_mode }}
        run: |
          set -euo pipefail
          case "$DOCS_CHECKOUT_CONE_MODE" in
            true) cone_flag=--cone ;;
            false) cone_flag=--no-cone ;;
            *) echo "Invalid docs checkout cone mode."; exit 64 ;;
          esac
          printf '%s\n' "$DOCS_CHECKOUT_PATHS" | git sparse-checkout set "$cone_flag" --stdin

      - name: Checkout full policy closure
        if: >-
          needs.plan.outputs.policy_docs == 'true' ||
          fromJSON(needs.plan.outputs.docs_checkout).mode == 'full'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        timeout-minutes: 10
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Load Harness toolchain
        if: ${{ needs.plan.outputs.policy_docs == 'true' && needs.plan.outputs.tools != 'true' }}
        id: policy-toolchain
        uses: ./.github/actions/load-toolchain
      - name: Set up Harness Node.js
        if: ${{ needs.plan.outputs.policy_docs == 'true' && needs.plan.outputs.tools != 'true' }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ steps.policy-toolchain.outputs.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Harness test dependencies
        if: ${{ needs.plan.outputs.policy_docs == 'true' && needs.plan.outputs.tools != 'true' }}
        run: npm ci --ignore-scripts --workspaces=false
      - name: Check source-owned document metadata
        env:
          BASE_SHA: ${{ needs.plan.outputs.base_sha }}
        run: node tool/docs/check_doc_metadata.mjs --base "$BASE_SHA"
      - name: Validate the tool manifest and baseline ownership
        if: ${{ needs.plan.outputs.policy_docs == 'true' }}
        run: node tool/run.mjs check meta:tool-manifest meta:repository-root-hygiene
      - name: Validate CI wiring in the policy lane
        if: ${{ needs.plan.outputs.policy_docs == 'true' && needs.plan.outputs.tools != 'true' }}
        run: node tool/run.mjs check agent:harness-v2

  app-builds:
    needs: [plan]
    if: >-
      needs.plan.outputs.producer_attempt == format('{0}', github.run_attempt) &&
      (needs.plan.outputs.flutter_build_android == 'true' ||
       needs.plan.outputs.flutter_build_ios == 'true' ||
       needs.plan.outputs.flutter_build_web == 'true' ||
       needs.plan.outputs.flutter_web_smoke == 'true') &&
      !needs.plan.outputs.queue_verified_run
    uses: ./.github/workflows/app-build-matrix.yml
    with:
      app_roles: ${{ needs.plan.outputs.app_roles }}
      build_android: ${{ needs.plan.outputs.flutter_build_android == 'true' }}
      build_ios: ${{ needs.plan.outputs.flutter_build_ios == 'true' }}
      build_web: ${{ needs.plan.outputs.flutter_build_web == 'true' }}
      web_smoke: ${{ needs.plan.outputs.flutter_web_smoke == 'true' }}
    secrets:
      GOOGLE_MAPS_ANDROID_API_KEY_DEV: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY_DEV }}
      GOOGLE_MAPS_IOS_API_KEY_DEV: ${{ secrets.GOOGLE_MAPS_IOS_API_KEY_DEV }}

  workflow-lint:
    name: Lint workflows
    # Seconds of work, so it runs on every ready PR and queue group rather
    # than through the planner.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            *.sh
      - name: Install pinned actionlint and zizmor
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ZIZMOR_VERSION: 1.31.1
          ZIZMOR_SHA256: d185f726bdaf92df78273217dfdd24ebcd6b0ef48cf3ce776ff5762b6e138c99
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/workflow-lint"
          mkdir -p "$bin"
          curl -fsSL -o "$bin/actionlint.tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$bin/zizmor.tgz" \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "$ACTIONLINT_SHA256  $bin/actionlint.tgz" | sha256sum -c -
          echo "$ZIZMOR_SHA256  $bin/zizmor.tgz" | sha256sum -c -
          tar -xzf "$bin/actionlint.tgz" -C "$bin" actionlint
          tar -xzf "$bin/zizmor.tgz" -C "$bin"
          echo "$bin" >> "$GITHUB_PATH"
      # shellcheck comes preinstalled on the runner; Python steps are not linted.
      - run: actionlint -pyflakes=
      - run: zizmor --offline --config .github/zizmor.yml --min-severity medium .github
      - name: Shellcheck standalone scripts
        run: git ls-files -z '*.sh' | xargs -0 shellcheck --severity=warning

  # Shadow proof reuse (Phase 1, 22 Nov 2026): records each lane's input key
  # on pull requests and, in the merge queue, whether a lane that passed on the
  # queued pull request could have been reused. Shadow only: every lane still
  # runs, nothing is skipped, and neither job is in Required CI's needs.
  proof-keys:
    name: Compute proof-reuse keys
    needs: [plan]
    if: >-
      ${{ needs.plan.result == 'success' &&
          (github.event_name == 'merge_group' ||
           (github.event_name == 'pull_request' && !github.event.pull_request.draft)) }}
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    outputs:
      verdicts: ${{ steps.verdicts.outputs.verdicts }}
    steps:
      # A pull request's keys are those of its own head, the commit its queue
      # group recomputes, not of the merge commit.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: toolchain
        uses: ./.github/actions/load-toolchain
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
      - name: Install Nx
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Record this commit's lane keys
        env:
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node tool/ci/proof_reuse_shadow.mjs --keys --head "$HEAD_SHA" --out build/ci/proof-keys.json
      - id: verdicts
        name: Decide which lanes the queue could have reused
        if: ${{ github.event_name == 'merge_group' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          set -euo pipefail
          node tool/ci/proof_reuse_shadow.mjs --verdicts --head "$HEAD_SHA" --head-ref "$HEAD_REF" \
            --out build/ci/proof-verdicts.json
          echo "verdicts=$(jq -c . build/ci/proof-verdicts.json)" >> "$GITHUB_OUTPUT"

  proof-reuse-shadow:
    name: Compare proof-reuse verdicts with the lanes
    needs: [proof-keys, admin, app-builds, capture-freshness, contracts, docs-policy, firestore-rules, flutter,
      functions, marketing, operations, tools, visual-integration]
    if: ${{ !cancelled() && github.event_name == 'merge_group' && needs.proof-keys.outputs.verdicts != '' }}
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tool/ci/proof_reuse_shadow.mjs
            /.github/actions/load-toolchain/action.yml
            /tool/ci/toolchain.env
      - id: toolchain
        uses: ./.github/actions/load-toolchain
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
      - name: Compare each verdict with the lane's real result
        env:
          VERDICTS: ${{ needs.proof-keys.outputs.verdicts }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s' "$VERDICTS" > "$RUNNER_TEMP/proof-verdicts.json"
          node tool/ci/proof_reuse_shadow.mjs --compare --verdicts "$RUNNER_TEMP/proof-verdicts.json" \
            --out build/ci/proof-reuse-shadow.json
      - name: Upload the proof-reuse shadow report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proof-reuse-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci/proof-reuse-shadow.json
          if-no-files-found: error
          retention-days: 30

  semantic-checks:
    name: Semantic checks
    needs: [plan]
    # Every merge-queue entry, every non-draft pull request (reporting only),
    # the nightly (timings for the budget report) and a main push with no
    # merge-queue proof (a bypass or a stale proof). No plan selection: the
    # 72 gates are whole-repo checks, run on every entry (owner decision after
    # the clean replay, docs/plans/semantic_check_replay_report.md; the
    # Functions context, client-write and BigQuery export path checks joined
    # with the architecture sign-off, #2445, the account deletion erasure
    # check with #2444, and the schema module, Functions catalog and data
    # run-record checks after #2496 turned main red).
    if: >-
      ${{ needs.plan.outputs.producer_attempt == format('{0}', github.run_attempt) &&
        (github.event_name == 'merge_group' || (github.event_name == 'workflow_dispatch' && inputs.nightly) ||
         (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
         (github.event_name == 'push' && !needs.plan.outputs.queue_verified_run)) }}
    # A pull request sees a red job but Required CI still passes: the gate
    # blocks in the merge queue (and on main), not before it.
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Full history: ratchets compare with origin/main.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: toolchain
        uses: ./.github/actions/load-toolchain
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - run: npm ci
      - run: npm --prefix functions ci --ignore-scripts
      # audit:widget-cleanup scans with rg; the other gates need only Node.
      - uses: ./.github/actions/install-ripgrep
      # Uncached, like source preflight: only validation-lane workflows may
      # restore cached contracts (the ci:generate-contracts-cache policy).
      - uses: ./.github/actions/generate-contracts
      - name: Generate the Admin build modules
        run: |
          node tool/admin/generate_admin_action_catalog.mjs
          node admin/scripts/generateCallableValidators.mjs
      - name: Run the semantic gates
        run: node tool/ci/semantic_gates.mjs run --candidates --timings build/ci/semantic-timings.json
      - name: Retain gate timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semantic-timings-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci/semantic-timings.json
          if-no-files-found: warn
          retention-days: 14

  required:
    name: Required CI
    # A draft cannot merge or enter the merge queue; it validates once ready.
    if: ${{ !cancelled() && !(github.event_name == 'pull_request' && github.event.pull_request.draft) }}
    # Sprint floor (owner, 8 Nov 2026): only the lanes that catch a broken
    # build block a merge. tools, operations, docs-policy and app-builds still
    # run and report, but do not gate; restore them here, and drop them from
    # $reporting below, when the sprint ends.
    needs:
      - plan
      - source-preflight
      - contracts
      - functions
      - firestore-rules
      - flutter
      - visual-integration
      - admin
      - marketing
      - capture-freshness
      - workflow-lint
      - semantic-checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require this attempt's planner
        env:
          PRODUCER_ATTEMPT: ${{ needs.plan.outputs.producer_attempt }}
        run: |
          set -euo pipefail
          if [[ ! "${PRODUCER_ATTEMPT:-}" =~ ^[1-9][0-9]*$ ||
                ! "${GITHUB_RUN_ATTEMPT:-}" =~ ^[1-9][0-9]*$ ||
                "$PRODUCER_ATTEMPT" != "$GITHUB_RUN_ATTEMPT" ]]; then
            echo 'This CI attempt has no matching planner execution. Use Re-run all jobs; partial retries cannot reuse an older plan.'
            exit 64
          fi
      - id: artifact_guard
        name: Require every selected lane
        env:
          QUEUE_RUN: ${{ needs.plan.outputs.queue_verified_run }}
          EVENT_NAME: ${{ github.event_name }}
          NIGHTLY: ${{ github.event_name == 'workflow_dispatch' && inputs.nightly }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          failures="$(
            echo "$NEEDS_JSON" |
              jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"'
          )"
          if [[ -n "$failures" ]]; then
            echo "Selected CI lanes did not pass:"
            echo "$failures"
            exit 1
          fi
          test "$(jq -er '.plan.result' <<< "$NEEDS_JSON")" = success
          preflight="$(jq -er '.["source-preflight"].result' <<< "$NEEDS_JSON")"
          # The cited queue run already completed this exact source's preflight.
          [[ "$preflight" == success || ( -n "${QUEUE_RUN:-}" && "$preflight" == skipped ) ]]
          # The semantic gates must have run and passed wherever they block: every
          # merge-queue entry, the nightly, and a main push with no queue proof.
          # A failure already fails the check above; this also refuses a skipped
          # job (a wrong if:). A pull request only reports, and a queue-proven
          # main push skips the job.
          if [[ "${EVENT_NAME:-}" == merge_group || "${NIGHTLY:-}" == true ||
                ( "${EVENT_NAME:-}" == push && -z "${QUEUE_RUN:-}" ) ]]; then
            test "$(jq -er '.["semantic-checks"].result' <<< "$NEEDS_JSON")" = success
          fi
          # Selection only counts when its owning job actually succeeded.
          jq -e --arg queue "${QUEUE_RUN:-}" '
            . as $needs |
            # Every lane the merge queue proved on this exact source.
            ["admin", "capture_freshness", "contracts", "docs", "firestore_rules", "flutter",
             "flutter_build_android", "flutter_build_ios", "flutter_build_web", "flutter_web_smoke",
             "functions", "marketing", "operations", "policy_docs", "tools", "visual_integration"] as $reusable |
            {admin: "admin", capture_freshness: "capture-freshness", contracts: "contracts",
             docs: "docs-policy", policy_docs: "docs-policy", firestore_rules: "firestore-rules",
             flutter: "flutter", functions: "functions", marketing: "marketing",
             operations: "operations", tools: "tools", visual_integration: "visual-integration",
             flutter_build_android: "app-builds", flutter_build_ios: "app-builds",
             flutter_build_web: "app-builds", flutter_web_smoke: "app-builds"} |
            to_entries | all(.[];
              . as $lane | $needs.plan.outputs[$lane.key] as $selected |
              # Sprint floor: the lanes left out of needs report but do not gate.
              ["app-builds", "docs-policy", "operations", "tools"] as $reporting |
              if $selected == "false" then true
              elif $selected == "true" and ($reporting | index($lane.value)) != null then true
              elif $selected == "true" and $needs[$lane.value].result == "success" then true
              elif $selected == "true" and $queue != "" and ($reusable | index($lane.key)) != null and
                $needs[$lane.value].result == "skipped" then true
              else error("Selected lane " + $lane.key + " lacks successful execution or selection output")
              end)
          ' <<< "$NEEDS_JSON" > /dev/null
          echo "Every selected CI lane passed; unaffected lanes were explicitly skipped."
