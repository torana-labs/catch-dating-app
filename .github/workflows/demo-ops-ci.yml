name: Demo Ops CI

on:
  pull_request:
    paths:
      - "tool/demo/**"
      - "tool/data/recompute_event_*counts*.mjs"
      - "tool/data/recompute_organizer_*counts*.mjs"
      - "docs/demo_data_seeding.md"
      - ".github/actions/**"
      - ".github/workflows/demo-ops-ci.yml"
  push:
    branches:
      - main
    paths:
      - "tool/demo/**"
      - "tool/data/recompute_event_*counts*.mjs"
      - "tool/data/recompute_organizer_*counts*.mjs"
      - "docs/demo_data_seeding.md"
      - ".github/actions/**"
      - ".github/workflows/demo-ops-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # As in ci.yml: a newer push to a PR cancels that PR's older run, and main
  # pushes share one group so a newer merge supersedes the older main run.
  group: demo-ops-ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  demo-ops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - id: toolchain
        uses: ./.github/actions/load-toolchain
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
          cache: "npm"
          cache-dependency-path: functions/package-lock.json
      - run: npm ci --prefix functions
      - uses: ./.github/actions/generate-contracts
      - run: node --check tool/demo/demo_ops.mjs
      - run: node --check tool/demo/demo_ops_core.mjs
      - run: node --check tool/demo/demo_ops_core.test.mjs
      - run: node --check tool/demo/seed_demo_data.mjs
      - run: node --test tool/demo/demo_ops_core.test.mjs tool/data/recompute_event_aggregate_counts.test.mjs tool/data/recompute_organizer_follower_counts.test.mjs
