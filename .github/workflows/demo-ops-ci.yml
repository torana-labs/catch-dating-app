name: Demo Ops CI

on:
  pull_request:
    paths:
      - "tool/demo/**"
      - "tool/data/recompute_event_*counts*.mjs"
      - "tool/data/recompute_club_*counts*.mjs"
      - "docs/demo_data_seeding.md"
      - ".github/actions/**"
      - ".github/workflows/demo-ops-ci.yml"
  push:
    branches:
      - main
    paths:
      - "tool/demo/**"
      - "tool/data/recompute_event_*counts*.mjs"
      - "tool/data/recompute_club_*counts*.mjs"
      - "docs/demo_data_seeding.md"
      - ".github/actions/**"
      - ".github/workflows/demo-ops-ci.yml"

permissions:
  contents: read

jobs:
  demo-ops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - id: toolchain
        uses: ./.github/actions/load-toolchain
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
          cache: "npm"
          cache-dependency-path: functions/package-lock.json
      - run: npm ci --prefix functions
      - run: node --check tool/demo/demo_ops.mjs
      - run: node --check tool/demo/demo_ops_core.mjs
      - run: node --check tool/demo/demo_ops_core.test.mjs
      - run: node --check tool/demo/seed_demo_data.mjs
      - run: node --test tool/demo/demo_ops_core.test.mjs tool/data/recompute_event_aggregate_counts.test.mjs tool/data/recompute_organizer_member_counts.test.mjs
