name: Test selection miss report

# Pull requests run only the Functions unit and emulator tests their change
# can reach; the nightly runs them all. After a failed nightly, this checks
# each failing Functions test against the pull request selection of every
# commit since the last green nightly. A test that no commit selected opens,
# or comments on, one "Test selection missed a failing test" issue.
# Report-only: it runs after the nightly finishes and never changes its result.
# It reads only main's own nightly runs and checks out main's code.
# Logic and tests: tool/ci/selection_miss_report.mjs. Operator guide:
# docs/release_operations.md, "Test selection miss report".

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: selection-miss-report
  cancel-in-progress: false

jobs:
  report:
    name: Check nightly failures against the test selection
    if: ${{ github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'schedule' && github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      # Full first-parent history back to the last green nightly; the
      # selection needs paths and trees, not old file contents.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - id: toolchain
        uses: ./.github/actions/load-toolchain
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
      - run: npm ci --prefix tool/impact
      - name: Open or update the selection miss issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: node tool/ci/selection_miss_report.mjs
