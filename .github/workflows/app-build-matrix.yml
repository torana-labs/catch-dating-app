name: App Build Matrix

on:
  workflow_call:
    inputs:
      app_roles:
        description: JSON array of installable roles to compile.
        required: false
        type: string
        default: '["consumer","host"]'
      build_web:
        required: false
        type: boolean
        default: true
      build_android:
        required: false
        type: boolean
        default: true
      build_ios:
        required: false
        type: boolean
        default: true
      web_smoke:
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      app_roles:
        description: JSON array of installable roles to compile.
        required: false
        type: string
        default: '["consumer","host"]'
      build_web:
        required: false
        type: boolean
        default: true
      build_android:
        required: false
        type: boolean
        default: true
      build_ios:
        required: false
        type: boolean
        default: true
      web_smoke:
        required: false
        type: boolean
        default: false

jobs:
  app-targets:
    name: App target contract
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - id: toolchain
        uses: ./.github/actions/load-toolchain

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}

      - name: Validate requested app roles
        env:
          APP_ROLES: ${{ inputs.app_roles }}
        run: |
          jq -e '
            type == "array" and
            length > 0 and
            all(.[]; . == "consumer" or . == "host") and
            (unique | length) == length
          ' <<< "$APP_ROLES" > /dev/null

      - name: Fail-fast app structural gates
        run: >-
          node tool/run.mjs check
          audit:context-map
          audit:dependency-direction
          audit:mutation-error-surfaces
          audit:route-string-literals
          audit:widget-cleanup

      - name: Check app target contracts
        run: node tool/run.mjs check platform:app-targets platform:app-package-graphs platform:verify-ios-release-identity

  web:
    name: Web build
    needs: app-targets
    if: ${{ inputs.build_web || inputs.web_smoke }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - id: toolchain
        uses: ./.github/actions/load-toolchain

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}

      - uses: ./.github/actions/setup-flutter

      - run: flutter pub get

      - name: Build dev web artifact
        if: ${{ contains(fromJSON(inputs.app_roles), 'consumer') }}
        run: ./tool/flutter_with_env.sh dev build web --debug

      - name: Build dev host web artifact
        if: ${{ contains(fromJSON(inputs.app_roles), 'host') }}
        run: ./tool/flutter_with_env.sh dev --role host build web --debug

      # Also compile the prod config (prod dart-defines + prod Firebase
      # options) so a prod-only build break is caught on PRs, not at release.
      - name: Build prod web artifact
        if: ${{ inputs.build_web && contains(fromJSON(inputs.app_roles), 'consumer') }}
        run: ./tool/flutter_with_env.sh prod build web --release

      - name: Build prod host web artifact
        if: ${{ inputs.build_web && contains(fromJSON(inputs.app_roles), 'host') }}
        run: ./tool/flutter_with_env.sh prod --role host build web --release

  android:
    name: Android debug APK
    needs: app-targets
    if: ${{ inputs.build_android }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6

      - id: toolchain
        uses: ./.github/actions/load-toolchain

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.java-version }}
          cache: gradle
          cache-dependency-path: |
            tool/ci/toolchain.env
            pubspec.lock
            apps/*/pubspec.yaml
            packages/*/pubspec.yaml
            apps/*/android/**/*.gradle*
            apps/*/android/**/gradle-wrapper.properties
            apps/*/android/gradle.properties

      - uses: ./.github/actions/setup-flutter

      - run: flutter pub get

      - name: Write Consumer dev Android Maps key
        if: ${{ contains(fromJSON(inputs.app_roles), 'consumer') }}
        env:
          GOOGLE_MAPS_ANDROID_API_KEY_DEV: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY_DEV }}
        run: |
          key="${GOOGLE_MAPS_ANDROID_API_KEY_DEV:-}"
          if [[ -z "$key" ]]; then
            echo "Missing GOOGLE_MAPS_ANDROID_API_KEY_DEV secret."
            exit 1
          fi
          printf '\nGOOGLE_MAPS_ANDROID_API_KEY_DEV=%s\n' "$key" >> apps/consumer/android/local.properties

      - name: Write Host dev Android Maps key
        if: ${{ contains(fromJSON(inputs.app_roles), 'host') }}
        env:
          GOOGLE_MAPS_ANDROID_API_KEY_DEV: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY_DEV }}
        run: |
          key="${GOOGLE_MAPS_ANDROID_API_KEY_DEV:-}"
          if [[ -z "$key" ]]; then
            echo "Missing GOOGLE_MAPS_ANDROID_API_KEY_DEV secret."
            exit 1
          fi
          printf '\nGOOGLE_MAPS_ANDROID_API_KEY_DEV=%s\n' "$key" >> apps/host/android/local.properties

      - name: Build dev Android debug artifact
        if: ${{ contains(fromJSON(inputs.app_roles), 'consumer') }}
        run: ./tool/flutter_with_env.sh dev build apk --debug

      - name: Build dev host Android debug artifact
        if: ${{ contains(fromJSON(inputs.app_roles), 'host') }}
        run: ./tool/flutter_with_env.sh dev --role host build apk --debug

  ios:
    name: iOS ${{ matrix.role }} simulator build
    needs: app-targets
    if: ${{ inputs.build_ios }}
    runs-on: macos-26
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        role: ${{ fromJSON(inputs.app_roles) }}

    steps:
      - uses: actions/checkout@v6

      - id: toolchain
        uses: ./.github/actions/load-toolchain

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}

      - uses: ./.github/actions/setup-flutter

      - run: flutter pub get

      - name: Restore CocoaPods downloads
        uses: ./.github/actions/cache-cocoapods
        with:
          cocoapods-version: ${{ steps.toolchain.outputs.cocoapods-version }}
          lockfiles: apps/*/ios/Podfile.lock

      - name: Validate Host design reference manifest
        if: ${{ matrix.role == 'host' }}
        run: |
          # Today, the pre-consolidation Events list, Inbox, and Organizer remain
          # historical evidence until DP-HOST-HOME-004 and the Host Messaging /
          # Organizer parity debts gain approved references for the current shell.
          node tool/design/check_reference_screens.mjs --check --summary

      - name: Write Consumer dev iOS Maps key
        if: ${{ matrix.role == 'consumer' }}
        env:
          GOOGLE_MAPS_IOS_API_KEY_DEV: ${{ secrets.GOOGLE_MAPS_IOS_API_KEY_DEV }}
        run: ./tool/write_ios_maps_key_xcconfig.sh dev apps/consumer/ios/Flutter/GoogleMapsKeys.xcconfig

      - name: Write Host dev iOS Maps key
        if: ${{ matrix.role == 'host' }}
        env:
          GOOGLE_MAPS_IOS_API_KEY_DEV: ${{ secrets.GOOGLE_MAPS_IOS_API_KEY_DEV }}
        run: ./tool/write_ios_maps_key_xcconfig.sh dev apps/host/ios/Flutter/GoogleMapsKeys.xcconfig

      - name: Build dev iOS simulator artifact
        if: ${{ matrix.role == 'consumer' }}
        run: ./tool/flutter_with_env.sh dev build ios --debug --simulator --no-codesign

      - name: Build dev host iOS simulator artifact
        if: ${{ matrix.role == 'host' }}
        run: ./tool/flutter_with_env.sh dev --role host build ios --debug --simulator --no-codesign
