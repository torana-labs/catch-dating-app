name: Mobile Production

# Ships a build that testers already have. iOS submits that TestFlight build
# for App Store review as a phased release that goes public automatically on
# approval; run again for a version already submitted, it switches that version
# to release on approval, or releases it now if Apple approved it.
# Android promotes that version code to production as a staged rollout, from
# whichever testing track holds it. Nothing is rebuilt or re-uploaded, so
# production gets the exact bytes testers used. Choose both stores to release
# them in one run: the prod-mobile-release environment requires a reviewer's
# approval, and one approval covers every job waiting in the run. Operator
# guide: docs/release_operations.md, "Mobile releases".

on:
  workflow_dispatch:
    inputs:
      app:
        description: App to release
        type: choice
        options: [consumer, host]
      platform:
        description: Stores to release to
        type: choice
        options: [both, ios, android]
        default: both
      ios_build:
        description: TestFlight build number testers have (iOS or both)
        type: string
        default: ""
      android_version_code:
        description: Play version code testers have (Android or both)
        type: string
        default: ""
      rollout:
        description: Android rollout fraction, for example 0.1 for 10%
        type: string
        default: "0.1"

permissions:
  contents: read

concurrency:
  group: mobile-production-${{ inputs.app }}
  cancel-in-progress: false

jobs:
  inputs:
    # Fails before anyone is asked to approve, so a missing or malformed
    # build number never wastes an approval.
    name: Check the release inputs
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check build numbers for the chosen stores
        env:
          PLATFORM: ${{ inputs.platform }}
          IOS_BUILD: ${{ inputs.ios_build }}
          ANDROID_VERSION_CODE: ${{ inputs.android_version_code }}
          ROLLOUT: ${{ inputs.rollout }}
        run: |
          status=0
          if [ "$PLATFORM" != android ] && ! printf '%s' "$IOS_BUILD" | grep -Eq '^[0-9]+$'; then
            echo "::error::ios_build must be the TestFlight build number testers have"; status=1
          fi
          if [ "$PLATFORM" != ios ]; then
            if ! printf '%s' "$ANDROID_VERSION_CODE" | grep -Eq '^[0-9]+$'; then
              echo "::error::android_version_code must be the Play version code testers have"; status=1
            fi
            if ! printf '%s' "$ROLLOUT" | grep -Eq '^(0?\.[0-9]+|1(\.0+)?)$'; then
              echo "::error::rollout must be a fraction in (0, 1], for example 0.1"; status=1
            fi
          fi
          exit "$status"

  ios:
    name: Submit iOS ${{ inputs.app }} ${{ inputs.ios_build }} for review
    needs: inputs
    if: ${{ github.ref == 'refs/heads/main' && inputs.platform != 'android' }}
    runs-on: macos-26
    environment: prod-mobile-release
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - id: toolchain
        uses: ./.github/actions/load-toolchain
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
      - uses: ruby/setup-ruby@4e97ecde5048e1e0816923020652678063ffbf65 # v1.339.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Submit for App Store review
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          BUILD: ${{ inputs.ios_build }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8
        run: bundle exec fastlane ios release role:${{ inputs.app }} "build:$BUILD"

  android:
    name: Roll out Android ${{ inputs.app }} ${{ inputs.android_version_code }}
    needs: inputs
    if: ${{ github.ref == 'refs/heads/main' && inputs.platform != 'ios' }}
    runs-on: ubuntu-latest
    environment: prod-mobile-release
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - id: toolchain
        uses: ./.github/actions/load-toolchain
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
      - uses: ruby/setup-ruby@4e97ecde5048e1e0816923020652678063ffbf65 # v1.339.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Authenticate to Google Play without a stored key
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL }}
      - name: Promote to production
        env:
          BUILD: ${{ inputs.android_version_code }}
          ROLLOUT: ${{ inputs.rollout }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
        run: bundle exec fastlane android release role:${{ inputs.app }} "version_code:$BUILD" "rollout:$ROLLOUT"
