name: Host measurement preview runtime

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: host-measurement-preview
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: prod-hosting
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: toolchain
        uses: ./.github/actions/load-toolchain
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
      - name: Verify accepted current main and reviewed preview-only bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node tool/ci/host_measurement_preview.mjs authorize
          node --test tool/ci/host_measurement_preview.test.mjs website/scripts/next/measurementRuntime.test.mjs
          node tool/ci/host_measurement_preview.mjs prepare
      - name: Install the pinned Hosting client before authentication
        env:
          FIREBASE_TOOLS_VERSION: ${{ steps.toolchain.outputs.firebase-tools-version }}
        run: npm install --global "firebase-tools@$FIREBASE_TOOLS_VERSION"
      - name: Recheck source and deploy bytes before authentication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node tool/ci/host_measurement_preview.mjs authorize
          node tool/ci/host_measurement_preview.mjs verify-package
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
      - name: Deploy only the isolated two-file measurement site once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node tool/ci/host_measurement_preview.mjs authorize
          node tool/ci/host_measurement_preview.mjs verify-package
          firebase deploy --only hosting:catch-host-measurement --project catch-dating-app-64e51 \
            --config build/host-measurement-preview/measurement-hosting.json \
            --non-interactive --json > build/host-measurement-deploy.json
      - name: Verify actual public bytes and privacy headers
        run: node tool/ci/host_measurement_preview.mjs verify-serving
      - name: Retain deployment and public acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-measurement-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/host-measurement-preview/release.json
            build/host-measurement-deploy.json
            build/host-measurement-serving.json
          if-no-files-found: warn
          retention-days: 30
