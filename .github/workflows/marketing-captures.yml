name: Export canonical marketing captures
run-name: Marketing captures from ${{ inputs.automatic_source_sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.source_sha) }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character source commit SHA in this repository
        required: true
        type: string
  pull_request:
    types: [labeled]
  workflow_call:
    inputs:
      automatic_source_sha:
        description: The exact source SHA of the calling CI consumer, including its PR merge commit.
        required: true
        type: string
    outputs:
      capture_binding:
        description: Exact source, run, attempt, controller, and immutable artifact identity.
        value: ${{ jobs.export.outputs.capture_binding || jobs.reuse.outputs.capture_binding }}

permissions:
  contents: read

jobs:
  plan:
    name: Plan canonical iPhone captures
    if: >-
      inputs.automatic_source_sha != '' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' &&
       github.event.label.name == 'capture:requested' &&
       github.event.pull_request.state == 'open' &&
       github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.base.repo.full_name == github.repository &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      render: ${{ steps.plan.outputs.render }}
      web_render: ${{ steps.plan.outputs.web_render }}
      seeded: ${{ steps.plan.outputs.seeded }}
    env:
      CAPTURE_SOURCE_SHA: ${{ inputs.automatic_source_sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.source_sha) }}
      CAPTURE_WORKFLOW_SHA: ${{ inputs.automatic_source_sha && github.sha || (github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha) }}
      CAPTURE_AUTOMATIC_SOURCE_SHA: ${{ inputs.automatic_source_sha }}
      CAPTURE_RUN_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      CAPTURE_WORKFLOW_DEFINITION_SHA: ${{ github.workflow_sha }}
      CAPTURE_SOURCE_DIR: ${{ github.workspace }}/capture-source
      TZ: UTC
    steps:
      - name: Validate immutable source selection
        shell: bash
        run: |
          set -euo pipefail
          for sha in "$CAPTURE_SOURCE_SHA" "$CAPTURE_WORKFLOW_SHA" "$CAPTURE_WORKFLOW_DEFINITION_SHA"; do
            [[ "$sha" =~ ^[a-f0-9]{40}$ ]] || {
              echo 'Full lowercase source, controller and workflow-definition commit SHAs are required.' >&2
              exit 1
            }
          done
      - name: Initialize runner output directory
        shell: bash
        run: |
          set -euo pipefail
          echo "CAPTURE_OUTPUT_DIR=$RUNNER_TEMP/canonical-marketing-captures" >> "$GITHUB_ENV"
          echo "CAPTURE_SEED_DIR=$RUNNER_TEMP/capture-seeds" >> "$GITHUB_ENV"
      - name: Checkout immutable exporter controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.CAPTURE_WORKFLOW_SHA }}
          persist-credentials: false
      - name: Validate capture request and controller identity
        run: node tool/marketing/export_hosted_captures.mjs --check-request
      - name: Checkout exact capture source separately
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.CAPTURE_SOURCE_SHA }}
          path: capture-source
          # Reused PNGs must prove their original render is an ancestor.
          fetch-depth: 0
          persist-credentials: false
      - id: toolchain
        uses: ./.github/actions/load-toolchain
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
      - id: plan
        name: Plan reuse from earlier main-line capture bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tool/marketing/export_hosted_captures.mjs --plan
      - name: Hand the seeds to the producing job
        if: ${{ steps.plan.outputs.seeded == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capture-seeds-${{ env.CAPTURE_SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CAPTURE_SEED_DIR }}/
          if-no-files-found: error
          retention-days: 1

  storybook:
    name: Build website Storybook for web captures
    needs: plan
    # Prepare for web renders, including native-font changes only macOS can
    # detect, without installing the website's dependencies on the Mac.
    if: ${{ needs.plan.outputs.web_render == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CAPTURE_SOURCE_SHA: ${{ inputs.automatic_source_sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.source_sha) }}
      CAPTURE_WORKFLOW_SHA: ${{ inputs.automatic_source_sha && github.sha || (github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha) }}
      CAPTURE_AUTOMATIC_SOURCE_SHA: ${{ inputs.automatic_source_sha }}
      CAPTURE_RUN_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      CAPTURE_WORKFLOW_DEFINITION_SHA: ${{ github.workflow_sha }}
      CAPTURE_SOURCE_DIR: ${{ github.workspace }}/capture-source
      TZ: UTC
    steps:
      - name: Validate immutable source selection
        shell: bash
        run: |
          set -euo pipefail
          for sha in "$CAPTURE_SOURCE_SHA" "$CAPTURE_WORKFLOW_SHA" "$CAPTURE_WORKFLOW_DEFINITION_SHA"; do
            [[ "$sha" =~ ^[a-f0-9]{40}$ ]] || {
              echo 'Full lowercase source, controller and workflow-definition commit SHAs are required.' >&2
              exit 1
            }
          done
      - name: Checkout immutable exporter controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.CAPTURE_WORKFLOW_SHA }}
          persist-credentials: false
      - name: Checkout exact capture source separately
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.CAPTURE_SOURCE_SHA }}
          path: capture-source
          persist-credentials: false
      - id: toolchain
        uses: ./.github/actions/load-toolchain
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
      - name: Install source dependencies
        working-directory: capture-source
        run: npm ci
      - name: Build the website Storybook
        working-directory: capture-source
        run: npm --workspace website run build:storybook
      - name: Hand the Storybook to the producing job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capture-storybook-${{ env.CAPTURE_SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: capture-source/website/storybook-static/
          if-no-files-found: error
          retention-days: 1

  export:
    name: Render and validate canonical iPhone captures
    needs: [plan, storybook]
    if: ${{ !cancelled() && needs.plan.outputs.render == 'true' && (needs.storybook.result == 'success' || needs.storybook.result == 'skipped') }}
    concurrency:
      group: marketing-captures-${{ inputs.automatic_source_sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.source_sha) }}
      cancel-in-progress: false
    runs-on: macos-26
    timeout-minutes: 45
    outputs:
      capture_binding: ${{ steps.identity.outputs.capture_binding }}
    env:
      CAPTURE_SOURCE_SHA: ${{ inputs.automatic_source_sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.source_sha) }}
      CAPTURE_WORKFLOW_SHA: ${{ inputs.automatic_source_sha && github.sha || (github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha) }}
      CAPTURE_AUTOMATIC_SOURCE_SHA: ${{ inputs.automatic_source_sha }}
      CAPTURE_RUN_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      CAPTURE_WORKFLOW_DEFINITION_SHA: ${{ github.workflow_sha }}
      CAPTURE_SOURCE_DIR: ${{ github.workspace }}/capture-source
      TZ: UTC
    steps:
      - name: Validate immutable source selection
        shell: bash
        run: |
          set -euo pipefail
          for sha in "$CAPTURE_SOURCE_SHA" "$CAPTURE_WORKFLOW_SHA" "$CAPTURE_WORKFLOW_DEFINITION_SHA"; do
            [[ "$sha" =~ ^[a-f0-9]{40}$ ]] || {
              echo 'Full lowercase source, controller and workflow-definition commit SHAs are required.' >&2
              exit 1
            }
          done
      - name: Initialize runner output directory
        shell: bash
        run: |
          set -euo pipefail
          echo "CAPTURE_OUTPUT_DIR=$RUNNER_TEMP/canonical-marketing-captures" >> "$GITHUB_ENV"
          echo "CAPTURE_SEED_DIR=$RUNNER_TEMP/capture-seeds" >> "$GITHUB_ENV"
      - name: Checkout immutable exporter controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.CAPTURE_WORKFLOW_SHA }}
          persist-credentials: false
      - name: Validate capture request and controller identity
        run: node tool/marketing/export_hosted_captures.mjs --check-request
      - name: Checkout exact capture source separately
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.CAPTURE_SOURCE_SHA }}
          path: capture-source
          # Reused PNGs must prove their original render is an ancestor.
          fetch-depth: 0
          persist-credentials: false
      - name: Receive seeds from the plan
        if: ${{ needs.plan.outputs.seeded == 'true' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: capture-seeds-${{ env.CAPTURE_SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CAPTURE_SEED_DIR }}
      - name: Verify source and matching toolchain pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C "$CAPTURE_SOURCE_DIR" rev-parse HEAD)" = "$CAPTURE_SOURCE_SHA"
          cmp tool/ci/toolchain.env "$CAPTURE_SOURCE_DIR/tool/ci/toolchain.env"
          test -f /System/Library/Fonts/SFNS.ttf
      - id: toolchain
        uses: ./.github/actions/load-toolchain
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
      - uses: ./.github/actions/setup-flutter
      - name: Resolve exact source Flutter dependencies
        working-directory: capture-source
        run: flutter pub get --enforce-lockfile
      - name: Receive the website Storybook
        if: ${{ needs.plan.outputs.web_render == 'true' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: capture-storybook-${{ env.CAPTURE_SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/capture-storybook
      - name: Resolve the source's Playwright pin
        id: playwright
        if: ${{ needs.plan.outputs.web_render == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'const p = require(process.argv[1]).packages; ["", "website/"].map(at => p[at + "node_modules/playwright"]?.version).find(Boolean)' "$CAPTURE_SOURCE_DIR/package-lock.json")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright WebKit
        if: ${{ needs.plan.outputs.web_render == 'true' }}
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - name: Install only Playwright and WebKit
        if: ${{ needs.plan.outputs.web_render == 'true' }}
        shell: bash
        env:
          PLAYWRIGHT_VERSION: ${{ steps.playwright.outputs.version }}
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --ignore-scripts --prefix "$RUNNER_TEMP/playwright" "playwright@$PLAYWRIGHT_VERSION"
          "$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install webkit
          {
            echo "CAPTURE_PLAYWRIGHT_DIR=$RUNNER_TEMP/playwright"
            echo "CAPTURE_STORYBOOK_DIR=$RUNNER_TEMP/capture-storybook"
          } >> "$GITHUB_ENV"
      - name: Render, frame, validate and package canonical outputs
        run: node tool/marketing/export_hosted_captures.mjs
      - name: Upload validated immutable capture bundle
        id: bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canonical-marketing-${{ env.CAPTURE_SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CAPTURE_OUTPUT_DIR }}/
          if-no-files-found: error
          retention-days: 7
      - name: Record exact artifact identity
        id: identity
        env:
          ARTIFACT_ID: ${{ steps.bundle.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.bundle.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.bundle.outputs.artifact-url }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const e = process.env;
          const binding = {repository: e.GITHUB_REPOSITORY, sourceSha: e.CAPTURE_SOURCE_SHA,
            workflowRef: e.GITHUB_WORKFLOW_REF,
            workflowSha: e.CAPTURE_WORKFLOW_SHA, workflowDefinitionSha: e.CAPTURE_WORKFLOW_DEFINITION_SHA,
            eventSha: e.GITHUB_SHA, runHeadSha: e.CAPTURE_RUN_HEAD_SHA,
            runId: e.GITHUB_RUN_ID, runAttempt: e.GITHUB_RUN_ATTEMPT,
            artifactId: e.ARTIFACT_ID, artifactDigest: `sha256:${e.ARTIFACT_DIGEST.replace(/^sha256:/, '')}`};
          fs.appendFileSync(e.GITHUB_OUTPUT, `capture_binding=${JSON.stringify(binding)}\n`);
          NODE
          {
            echo "Source: $CAPTURE_SOURCE_SHA"
            echo "Exporter controller: $CAPTURE_WORKFLOW_SHA"
            echo "Workflow definition: $CAPTURE_WORKFLOW_DEFINITION_SHA"
            echo "Event: $GITHUB_EVENT_NAME ($GITHUB_SHA)"
            echo "Run/attempt: $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
            echo "Artifact: $ARTIFACT_ID"
            echo "Digest: $ARTIFACT_DIGEST"
            echo "Download: $ARTIFACT_URL"
            echo 'Synthetic captures; website copies and provenance validated. No golden baseline update or website publication.'
          } >> "$GITHUB_STEP_SUMMARY"

  reuse:
    name: Reuse validated canonical iPhone captures
    needs: plan
    if: ${{ needs.plan.outputs.render == 'false' }}
    concurrency:
      group: marketing-captures-${{ inputs.automatic_source_sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.source_sha) }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      capture_binding: ${{ steps.identity.outputs.capture_binding }}
    env:
      CAPTURE_SOURCE_SHA: ${{ inputs.automatic_source_sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.source_sha) }}
      CAPTURE_WORKFLOW_SHA: ${{ inputs.automatic_source_sha && github.sha || (github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha) }}
      CAPTURE_AUTOMATIC_SOURCE_SHA: ${{ inputs.automatic_source_sha }}
      CAPTURE_RUN_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      CAPTURE_WORKFLOW_DEFINITION_SHA: ${{ github.workflow_sha }}
      CAPTURE_SOURCE_DIR: ${{ github.workspace }}/capture-source
      TZ: UTC
    steps:
      - name: Validate immutable source selection
        shell: bash
        run: |
          set -euo pipefail
          for sha in "$CAPTURE_SOURCE_SHA" "$CAPTURE_WORKFLOW_SHA" "$CAPTURE_WORKFLOW_DEFINITION_SHA"; do
            [[ "$sha" =~ ^[a-f0-9]{40}$ ]] || {
              echo 'Full lowercase source, controller and workflow-definition commit SHAs are required.' >&2
              exit 1
            }
          done
      - name: Initialize runner output directory
        shell: bash
        run: |
          set -euo pipefail
          echo "CAPTURE_OUTPUT_DIR=$RUNNER_TEMP/canonical-marketing-captures" >> "$GITHUB_ENV"
          echo "CAPTURE_SEED_DIR=$RUNNER_TEMP/capture-seeds" >> "$GITHUB_ENV"
      - name: Checkout immutable exporter controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.CAPTURE_WORKFLOW_SHA }}
          persist-credentials: false
      - name: Validate capture request and controller identity
        run: node tool/marketing/export_hosted_captures.mjs --check-request
      - name: Checkout exact capture source separately
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.CAPTURE_SOURCE_SHA }}
          path: capture-source
          # Reused PNGs must prove their original render is an ancestor.
          fetch-depth: 0
          persist-credentials: false
      - name: Receive seeds from the plan
        if: ${{ needs.plan.outputs.seeded == 'true' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: capture-seeds-${{ env.CAPTURE_SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CAPTURE_SEED_DIR }}
      - name: Verify source and matching toolchain pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C "$CAPTURE_SOURCE_DIR" rev-parse HEAD)" = "$CAPTURE_SOURCE_SHA"
          cmp tool/ci/toolchain.env "$CAPTURE_SOURCE_DIR/tool/ci/toolchain.env"
      - id: toolchain
        uses: ./.github/actions/load-toolchain
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
      - name: Validate and package earlier renders of these exact inputs
        run: node tool/marketing/export_hosted_captures.mjs --reuse
      - name: Upload validated immutable capture bundle
        id: bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canonical-marketing-${{ env.CAPTURE_SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CAPTURE_OUTPUT_DIR }}/
          if-no-files-found: error
          retention-days: 7
      - name: Record exact artifact identity
        id: identity
        env:
          ARTIFACT_ID: ${{ steps.bundle.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.bundle.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.bundle.outputs.artifact-url }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const e = process.env;
          const binding = {repository: e.GITHUB_REPOSITORY, sourceSha: e.CAPTURE_SOURCE_SHA,
            workflowRef: e.GITHUB_WORKFLOW_REF,
            workflowSha: e.CAPTURE_WORKFLOW_SHA, workflowDefinitionSha: e.CAPTURE_WORKFLOW_DEFINITION_SHA,
            eventSha: e.GITHUB_SHA, runHeadSha: e.CAPTURE_RUN_HEAD_SHA,
            runId: e.GITHUB_RUN_ID, runAttempt: e.GITHUB_RUN_ATTEMPT,
            artifactId: e.ARTIFACT_ID, artifactDigest: `sha256:${e.ARTIFACT_DIGEST.replace(/^sha256:/, '')}`};
          fs.appendFileSync(e.GITHUB_OUTPUT, `capture_binding=${JSON.stringify(binding)}\n`);
          NODE
          {
            echo "Source: $CAPTURE_SOURCE_SHA"
            echo "Exporter controller: $CAPTURE_WORKFLOW_SHA"
            echo "Workflow definition: $CAPTURE_WORKFLOW_DEFINITION_SHA"
            echo "Event: $GITHUB_EVENT_NAME ($GITHUB_SHA)"
            echo "Run/attempt: $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
            echo "Artifact: $ARTIFACT_ID"
            echo "Digest: $ARTIFACT_DIGEST"
            echo "Download: $ARTIFACT_URL"
            echo 'Synthetic captures; website copies and provenance validated. No golden baseline update or website publication.'
          } >> "$GITHUB_STEP_SUMMARY"
