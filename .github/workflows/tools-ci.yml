name: Tools CI

on:
  workflow_call:
    inputs:
      base_sha:
        required: true
        type: string
      mode:
        required: true
        type: string
      commit_window:
        description: Include every committed path touched between the exact base and source.
        required: false
        type: boolean
        default: false
      full:
        required: true
        type: boolean
      capture_binding:
        description: Exact canonical capture artifact identity shared by the calling CI.
        required: false
        type: string
        default: ""
      marketing_checks_in_react:
        description: The caller's required aggregate owns the same-run React marketing site build, Storybook build, and browser checks.
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      base_sha:
        description: Base Git ref used to resolve affected tool checks.
        required: false
        type: string
        default: origin/main
      full:
        description: Run the complete six-bucket tool matrix.
        required: false
        type: boolean
        default: true
      mode:
        description: Harness execution mode used for lane membership.
        required: false
        type: choice
        options:
          - pr
          - merge_group
          - main
          - nightly
        default: nightly

permissions:
  actions: read
  contents: read

jobs:
  preflight:
    name: Tool manifest preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tool_mode: ${{ steps.impact.outputs.tool_mode }}
      repository_view: ${{ steps.impact.outputs.repository_view }}
      setup_requirements: ${{ steps.impact.outputs.setup_requirements }}
      capture_required: ${{ steps.impact.outputs.capture_required }}
      producer_attempt: ${{ steps.impact.outputs.producer_attempt }}

    steps:
      - name: Checkout tool preflight closure
        timeout-minutes: 3
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tool/
            /.github/actions/load-toolchain/action.yml
            /functions/package.json
            /pubspec.yaml
            /.github/workflows/app-build-matrix.yml
            /.github/workflows/mobile-beta.yml
            /.github/workflows/mobile-production.yml
            /.github/workflows/visual-integration-ci.yml
          persist-credentials: false

      - id: toolchain
        uses: ./.github/actions/load-toolchain

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
          cache: npm
          cache-dependency-path: tool/impact/package-lock.json

      - name: Check CI toolchain pins
        run: bash tool/ci/check_toolchain_consistency.sh

      - name: Install the pinned import-graph tool
        run: npm ci --prefix tool/impact --no-audit --no-fund

      - id: impact
        name: Resolve affected tool checks
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          SOURCE_SHA: ${{ github.sha }}
          COMMIT_WINDOW: ${{ inputs.commit_window || false }}
          FULL: ${{ inputs.full }}
          MODE: ${{ inputs.mode }}
          MARKETING_CHECKS_IN_REACT: ${{ inputs.marketing_checks_in_react }}
        run: |
          set -euo pipefail
          window_flag=()
          if [[ "$COMMIT_WINDOW" == "true" ]]; then
            window_flag=(--commit-window)
          fi
          full_flag=()
          if [[ "$FULL" == "true" ]]; then
            full_flag=(--full)
          fi
          shared_flags=()
          if [[ "$MARKETING_CHECKS_IN_REACT" == "true" ]]; then
            shared_flags=(--marketing-checks-in-react)
          fi
          mkdir -p build/ci
          node tool/impact/import_owners.mjs > build/ci/import-owners.json
          node tool/run.mjs affected-tools \
            --base "$BASE_SHA" --head "$SOURCE_SHA" "${window_flag[@]}" \
            --mode "$MODE" --import-owners build/ci/import-owners.json \
            "${full_flag[@]}" "${shared_flags[@]}" \
            --github-output "$GITHUB_OUTPUT" \
            --json > build/ci/affected-tools-plan.json
          echo "producer_attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Publish affected-tool summary
        run: |
          {
            echo "## Affected tool checks"
            echo
            echo '```json'
            jq . build/ci/affected-tools-plan.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload affected-tool plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: affected-tools-plan-${{ github.sha }}
          path: build/ci/affected-tools-plan.json
          if-no-files-found: error
          retention-days: 14

  captures:
    name: Produce required canonical captures
    needs: preflight
    if: ${{ needs.preflight.outputs.producer_attempt == format('{0}', github.run_attempt) && needs.preflight.outputs.capture_required == 'true' && inputs.capture_binding == '' }}
    uses: ./.github/workflows/marketing-captures.yml
    with:
      automatic_source_sha: ${{ github.sha }}

  affected-tools:
    name: Tool checks (affected)
    needs: [preflight, captures]
    if: >-
      ${{ !cancelled() && needs.preflight.result == 'success' &&
          needs.preflight.outputs.producer_attempt == format('{0}', github.run_attempt) &&
          needs.preflight.outputs.tool_mode == 'affected' &&
          (needs.captures.result == 'success' || needs.captures.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout affected index closure
        if: ${{ needs.preflight.outputs.repository_view == 'index' }}
        timeout-minutes: 3
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tool/
            /.github/actions/load-toolchain/action.yml
          persist-credentials: false

      - name: Checkout full affected repository
        if: ${{ needs.preflight.outputs.repository_view != 'index' }}
        timeout-minutes: 5
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: toolchain
        uses: ./.github/actions/load-toolchain

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
          cache: ${{ (contains(fromJSON(needs.preflight.outputs.setup_requirements), 'root-npm') || contains(fromJSON(needs.preflight.outputs.setup_requirements), 'functions-npm')) && 'npm' || '' }}
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Derive exact-source route and widget inventories
        if: ${{ needs.preflight.outputs.repository_view != 'index' }}
        run: node tool/ci/generated_inventories.mjs --source-sha "$GITHUB_SHA"

      - name: Import verified exact-source marketing captures
        if: ${{ needs.preflight.outputs.capture_required == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CAPTURE_BINDING: ${{ inputs.capture_binding || needs.captures.outputs.capture_binding }}
        run: node tool/marketing/import_hosted_captures.mjs --import

      - uses: ./.github/actions/setup-flutter
        if: ${{ contains(fromJSON(needs.preflight.outputs.setup_requirements), 'flutter') }}

      - name: Install scanner dependencies
        if: ${{ contains(fromJSON(needs.preflight.outputs.setup_requirements), 'ripgrep') }}
        run: |
          if command -v rg >/dev/null 2>&1; then
            rg --version
            exit 0
          fi
          test "$(uname -m)" = "x86_64"
          version="14.1.1"
          asset="ripgrep-${version}-x86_64-unknown-linux-musl.tar.gz"
          archive="${RUNNER_TEMP}/${asset}"
          curl -fsSL --retry 3 --retry-all-errors \
            "https://github.com/BurntSushi/ripgrep/releases/download/${version}/${asset}" \
            -o "$archive"
          echo "4cf9f2741e6c465ffdb7c26f38056a59e2a2544b51f7cc128ef28337eeae4d8e  ${archive}" \
            | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          sudo install -m 0755 \
            "$RUNNER_TEMP/ripgrep-${version}-x86_64-unknown-linux-musl/rg" \
            /usr/local/bin/rg
          rg --version

      - name: Resolve Flutter and standalone Dart tool dependencies
        if: ${{ contains(fromJSON(needs.preflight.outputs.setup_requirements), 'flutter-pub') }}
        run: |
          flutter pub get
          dart pub get -C tool/widget_dedupe

      - run: npm ci
        if: ${{ contains(fromJSON(needs.preflight.outputs.setup_requirements), 'root-npm') }}

      - run: npm --prefix functions ci
        if: ${{ contains(fromJSON(needs.preflight.outputs.setup_requirements), 'functions-npm') }}

      - name: Install marketing design browser
        if: ${{ contains(fromJSON(needs.preflight.outputs.setup_requirements), 'playwright') }}
        run: npx playwright install chromium

      - name: Install the pinned import-graph tool
        run: npm ci --prefix tool/impact --no-audit --no-fund

      - name: Check affected tools
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          SOURCE_SHA: ${{ github.sha }}
          COMMIT_WINDOW: ${{ inputs.commit_window || false }}
          MODE: ${{ inputs.mode }}
          MARKETING_CHECKS_IN_REACT: ${{ inputs.marketing_checks_in_react }}
          CAPTURE_REQUIRED: ${{ needs.preflight.outputs.capture_required }}
          CAPTURE_BINDING: ${{ inputs.capture_binding || needs.captures.outputs.capture_binding }}
          INVENTORY_MATERIALIZED: ${{ needs.preflight.outputs.repository_view != 'index' }}
        run: |
          set -euo pipefail
          shared_flags=()
          if [[ "$MARKETING_CHECKS_IN_REACT" == "true" ]]; then
            shared_flags=(--marketing-checks-in-react)
          fi
          if [[ "$CAPTURE_REQUIRED" == "true" ]]; then
            shared_flags+=(--marketing-captures-imported)
          fi
          if [[ "$INVENTORY_MATERIALIZED" == "true" ]]; then
            shared_flags+=(--generated-inventories-materialized)
          fi
          window_flag=()
          if [[ "$COMMIT_WINDOW" == "true" ]]; then
            window_flag=(--commit-window)
          fi
          mkdir -p build/ci
          node tool/impact/import_owners.mjs > build/ci/import-owners.json
          node tool/run.mjs affected-tools --base "$BASE_SHA" --head "$SOURCE_SHA" --mode "$MODE" \
            --import-owners build/ci/import-owners.json --check "${shared_flags[@]}" "${window_flag[@]}"

      - name: Upload visual diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tools-visual-diagnostics-affected-${{ github.run_id }}
          path: |
            artifacts/visual-actuals
            artifacts/visual-diffs
          if-no-files-found: ignore
          retention-days: 14

  fast-gates:
    name: Fast deterministic tool gates
    needs: preflight
    if: ${{ needs.preflight.outputs.producer_attempt == format('{0}', github.run_attempt) && needs.preflight.outputs.tool_mode == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout fast deterministic gate closure
        timeout-minutes: 2
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions/load-toolchain/action.yml
            /tool/ci/toolchain.env
            /tool/lib/repo_paths.mjs
            /tool/test/check_flutter_test_size.mjs
            /tool/test/flutter_test_size_baseline.json
            /test/
            /integration_test/
          persist-credentials: false

      - id: toolchain
        uses: ./.github/actions/load-toolchain

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}

      - name: Enforce Flutter test spec maintainability ratchet
        run: node tool/test/check_flutter_test_size.mjs --check

  tool-buckets:
    name: Tool checks (${{ matrix.name }})
    needs:
      - preflight
      - fast-gates
      - captures
    if: >-
      !cancelled() && needs.preflight.outputs.producer_attempt == format('{0}', github.run_attempt) &&
      needs.preflight.outputs.tool_mode == 'full' &&
      needs.fast-gates.result == 'success' &&
      (needs.captures.result == 'success' || needs.captures.result == 'skipped')
    runs-on: ubuntu-latest
    # Serial analyzer probes and the complete marketing/design contract matrix
    # need more time than the smaller scanner buckets.
    timeout-minutes: ${{ (matrix.name == 'lint-scanners' || matrix.name == 'marketing-design') && 45 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core-audit
            categories: meta audit remote-ops branding agent architecture ci git
          - name: lint-scanners
            categories: lint test
          - name: contracts-data
            categories: contracts data demo firebase operations
          - name: platform-env
            categories: env platform generator cloudflare
          - name: marketing-design
            categories: marketing ui-capture design analytics
          - name: organizer-intake
            categories: organizer-intake

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: toolchain
        uses: ./.github/actions/load-toolchain

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Derive exact-source route and widget inventories
        run: node tool/ci/generated_inventories.mjs --source-sha "$GITHUB_SHA"

      - name: Import verified exact-source marketing captures
        if: ${{ matrix.name == 'marketing-design' && needs.preflight.outputs.capture_required == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CAPTURE_BINDING: ${{ inputs.capture_binding || needs.captures.outputs.capture_binding }}
        run: node tool/marketing/import_hosted_captures.mjs --import

      - uses: ./.github/actions/setup-flutter

      - name: Install scanner dependencies
        run: |
          if command -v rg >/dev/null 2>&1; then
            rg --version
            exit 0
          fi
          test "$(uname -m)" = "x86_64"
          version="14.1.1"
          asset="ripgrep-${version}-x86_64-unknown-linux-musl.tar.gz"
          archive="${RUNNER_TEMP}/${asset}"
          curl -fsSL --retry 3 --retry-all-errors \
            "https://github.com/BurntSushi/ripgrep/releases/download/${version}/${asset}" \
            -o "$archive"
          echo "4cf9f2741e6c465ffdb7c26f38056a59e2a2544b51f7cc128ef28337eeae4d8e  ${archive}" \
            | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          sudo install -m 0755 \
            "$RUNNER_TEMP/ripgrep-${version}-x86_64-unknown-linux-musl/rg" \
            /usr/local/bin/rg
          rg --version

      - name: Resolve Flutter and standalone Dart tool dependencies
        run: |
          flutter pub get
          dart pub get -C tool/widget_dedupe

      - run: npm ci

      - run: npm --prefix functions ci

      - name: Install marketing design browser
        if: matrix.name == 'marketing-design'
        run: npx playwright install chromium

      - name: Check tool categories
        env:
          CATEGORIES: ${{ matrix.categories }}
          MARKETING_CHECKS_IN_REACT: ${{ inputs.marketing_checks_in_react }}
          CAPTURE_REQUIRED: ${{ matrix.name == 'marketing-design' && needs.preflight.outputs.capture_required == 'true' }}
          CAPTURE_BINDING: ${{ inputs.capture_binding || needs.captures.outputs.capture_binding }}
          INVENTORY_MATERIALIZED: "true"
        run: |
          set -euo pipefail
          shared_flags=()
          if [[ "$MARKETING_CHECKS_IN_REACT" == "true" ]]; then
            shared_flags=(--marketing-checks-in-react)
          fi
          if [[ "$CAPTURE_REQUIRED" == "true" ]]; then
            shared_flags+=(--marketing-captures-imported)
          fi
          if [[ "$INVENTORY_MATERIALIZED" == "true" ]]; then
            shared_flags+=(--generated-inventories-materialized)
          fi
          category_flags=()
          for category in $CATEGORIES; do
            category_flags+=(--category "$category")
          done
          (( ${#category_flags[@]} > 0 ))
          node tool/run.mjs check "${category_flags[@]}" "${shared_flags[@]}"

      - name: Upload visual diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tools-visual-diagnostics-${{ matrix.name }}-${{ github.run_id }}
          path: |
            artifacts/visual-actuals
            artifacts/visual-diffs
          if-no-files-found: ignore
          retention-days: 14

  tools:
    name: Validate tool manifest and fast checks
    runs-on: ubuntu-latest
    needs:
      - preflight
      - captures
      - affected-tools
      - fast-gates
      - tool-buckets
    if: ${{ !cancelled() }}
    timeout-minutes: 5

    steps:
      - name: Check tool job results
        env:
          PRODUCER_ATTEMPT: ${{ needs.preflight.outputs.producer_attempt }}
          CAPTURE_REQUIRED: ${{ needs.preflight.outputs.capture_required }}
          CAPTURE_BINDING: ${{ inputs.capture_binding }}
          CAPTURE_RESULT: ${{ needs.captures.result }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          AFFECTED_RESULT: ${{ needs['affected-tools'].result }}
          FAST_GATES_RESULT: ${{ needs['fast-gates'].result }}
          BUCKETS_RESULT: ${{ needs['tool-buckets'].result }}
        run: |
          set -euo pipefail
          if [[ "$PRODUCER_ATTEMPT" != "$GITHUB_RUN_ATTEMPT" ]]; then
            echo "Tools requires this attempt's preflight. Use Re-run all jobs."
            exit 64
          fi
          if [[ "$CAPTURE_REQUIRED" == "true" && -z "$CAPTURE_BINDING" && "$CAPTURE_RESULT" != "success" ]]; then
            echo 'Required canonical capture producer did not succeed.'
            exit 1
          fi
          echo "preflight: ${PREFLIGHT_RESULT}"
          echo "affected tools: ${AFFECTED_RESULT}"
          echo "fast gates: ${FAST_GATES_RESULT}"
          echo "tool buckets: ${BUCKETS_RESULT}"
          if [[ "${PREFLIGHT_RESULT}" != "success" ]]; then
            exit 1
          fi
          if [[ "${AFFECTED_RESULT}" == "success" && "${FAST_GATES_RESULT}" == "skipped" && "${BUCKETS_RESULT}" == "skipped" ]]; then
            exit 0
          fi
          if [[ "${AFFECTED_RESULT}" == "skipped" && "${FAST_GATES_RESULT}" == "success" && "${BUCKETS_RESULT}" == "success" ]]; then
            exit 0
          fi
          echo "Exactly one affected or full tool execution path must succeed."
          exit 1
