name: Install ripgrep
description: Install the repo-pinned ripgrep release the source scanners read with.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        if command -v rg >/dev/null 2>&1; then
          rg --version
          exit 0
        fi
        test "$(uname -m)" = "x86_64"
        version="14.1.1"
        asset="ripgrep-${version}-x86_64-unknown-linux-musl.tar.gz"
        archive="${RUNNER_TEMP}/${asset}"
        curl -fsSL --retry 3 --retry-all-errors \
          "https://github.com/BurntSushi/ripgrep/releases/download/${version}/${asset}" \
          -o "$archive"
        echo "4cf9f2741e6c465ffdb7c26f38056a59e2a2544b51f7cc128ef28337eeae4d8e  ${archive}" \
          | sha256sum --check -
        tar -xzf "$archive" -C "$RUNNER_TEMP"
        sudo install -m 0755 \
          "$RUNNER_TEMP/ripgrep-${version}-x86_64-unknown-linux-musl/rg" \
          /usr/local/bin/rg
        rg --version
