# zizmor configuration. CI runs it in the "Lint workflows" job of ci.yml and
# fails on high-severity findings.
rules:
  unpinned-uses:
    ignore:
      # Open work owns these files: codex/deploy-one-cli-run (backend deploy),
      # #1296 (demo-ops-ci) and the branch-prune claim. Pin them to commit SHAs
      # and delete these entries once that work merges.
      - _backend-deploy.yml
      - branch-prune.yml
      - demo-ops-ci.yml
  excessive-permissions:
    ignore:
      # Same: codex/deploy-one-cli-run owns this file.
      - backend-deploy.yml
