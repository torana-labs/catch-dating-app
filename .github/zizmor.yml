# zizmor configuration. CI runs it in the "Lint workflows" job of ci.yml and
# fails on high-severity findings.
rules:
  dangerous-triggers:
    ignore:
      # Its plan job runs only for main pushes, schedules and dispatches,
      # never for pull-request workflow runs.
      - website-release.yml
      # Runs only for main's own push and nightly CI runs, checks out main,
      # and can only write issues and dispatch the dispatch-only golden
      # baseline workflows (golden-policy job).
      - main-red-alert.yml
      # Wakes only after main's own push or nightly CI runs (same repository,
      # branch main), checks out main, reads no artifact or event payload
      # beyond the run's event, repository and branch, and keeps its own
      # permissions (read contents, dispatch dev-only runs, write issues).
      - cron-watchdog.yml
  unpinned-uses:
    ignore:
      # Open work owns these files: codex/deploy-one-cli-run (backend deploy,
      # #1311) and a stale branch-prune claim. Pin them to commit SHAs and
      # delete these entries once they are free.
      - _backend-deploy.yml
      - branch-prune.yml
  excessive-permissions:
    ignore:
      # Same: codex/deploy-one-cli-run owns this file.
      - backend-deploy.yml
