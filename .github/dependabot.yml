version: 2
updates:
  # Security fixes stay grouped. Routine version updates are limited to one
  # compatible minor/patch PR per ecosystem; majors require an explicit slice.
  - package-ecosystem: "npm"
    # The root npm workspace owns admin, website, and packages/web-ui. Listing
    # those members separately makes Dependabot resolve @catch/web-ui from the
    # public registry instead of the checked-in workspace package. Functions
    # has its own monthly entry below.
    directories:
      - "/"
      - "/operations"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "05:30"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 1
    groups:
      security:
        applies-to: "security-updates"
        patterns:
          - "*"
      compatible-version-updates:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "npm"
    # Every merged Functions lockfile change redeploys each Function that loads
    # a changed package, and a firebase-admin or firebase-functions bump
    # redeploys all of them (hours of Cloud Build per environment). Routine
    # updates therefore arrive once a month; security updates still open as
    # soon as an advisory is published.
    directory: "/functions"
    schedule:
      interval: "monthly"
      time: "05:30"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 1
    groups:
      security:
        applies-to: "security-updates"
        patterns:
          - "*"
      compatible-version-updates:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "pub"
    # The root Pub workspace owns apps/consumer and apps/host. Listing either
    # member separately makes Dependabot run dependency_services below the
    # workspace root and fail before it can propose an update.
    directories:
      - "/"
      - "/packages/catch_ui_lints"
      - "/tool/widget_dedupe"
      - "/widgetbook"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "05:45"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 1
    groups:
      security:
        applies-to: "security-updates"
        patterns:
          - "*"
      compatible-version-updates:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
        # Grouped pub updates pull in the FlutterFire 5 majors despite the
        # ignore rules below, so these leave the group until CAT-281 lands.
        exclude-patterns:
          - "firebase_*"
          - "cloud_firestore*"
          - "cloud_functions*"
          - "fake_cloud_firestore"
          - "firebase_auth_mocks"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # These minor bumps require majors the major rule above cannot hold
      # back: the Firebase mocks need FlutterFire 5 (CAT-281), and
      # analysis_server_plugin needs analyzer 14 (CAT-274). Remove each
      # pair when its migration lands.
      - dependency-name: "fake_cloud_firestore"
      - dependency-name: "firebase_auth_mocks"
      - dependency-name: "analysis_server_plugin"
      - dependency-name: "analyzer"
      # These releases need Dart 3.13, which the analyzer 12 behind
      # catch_ui_lints cannot resolve, so its CatchText scan fails on their
      # importers. Remove them with the analyzer pair above (CAT-274).
      - dependency-name: "xml"
      - dependency-name: "petitparser"
      - dependency-name: "google_maps_flutter"

  - package-ecosystem: "github-actions"
    # Workflows pin actions to commit SHAs with a version comment; Dependabot
    # updates both. The composite actions under .github/actions pin theirs too.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "06:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 1
    groups:
      security:
        applies-to: "security-updates"
        patterns:
          - "*"
      compatible-version-updates:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
