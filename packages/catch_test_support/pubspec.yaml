name: catch_test_support
description: Test support shared by the root, app and Widgetbook suites, such as pump helpers, golden support, design fixtures and repoFile().
version: 0.1.0
publish_to: 'none'
resolution: workspace

environment:
  sdk: ^3.12.0

# The root package, both app packages and Widgetbook depend on this package,
# and it depends on the root package for the types its fixtures build. Pub
# resolves that cycle because the reverse edges are dev dependencies (and
# Widgetbook sits outside the workspace).
dependencies:
  catch_dating_app:
    path: ../..
  catch_kernel:
    path: ../kernel
  catch_platform:
    path: ../platform
  fake_cloud_firestore: ^4.3.0
  firebase_auth: ^6.7.1
  firebase_auth_mocks: ^0.15.1
  flutter:
    sdk: flutter
  flutter_riverpod: '>=3.5.0 <3.6.0'
  flutter_test:
    sdk: flutter
  go_router: ^17.1.0
  image_picker: ^1.2.4
  riverpod: '>=3.5.0 <3.6.0'
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_lints: ^6.0.0
