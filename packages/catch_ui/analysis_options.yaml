include: package:flutter_lints/flutter.yaml

plugins:
  catch_ui_lints:
    path: ../catch_ui_lints

linter:
  rules:
    - always_use_package_imports
    - directives_ordering
    - prefer_single_quotes
analyzer:
  exclude:
    - build/**
  errors:
    # Legacy components stay @Deprecated for their callers until P7 deletes
    # them, and the library's own legacy parts still build them;
    # `dart analyze --fatal-infos` would fail every one. The shim ratchet
    # (tool/design/check_library_shims.mjs) is the guard, not the analyzer hint.
    deprecated_member_use_from_same_package: ignore
